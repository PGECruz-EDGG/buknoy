  const style=`body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#2E211A;margin:0;background:#fff;font-size:12.5px;line-height:1.35}.pg{max-width:1000px;margin:0 auto;padding:28px 32px}h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:26px;margin:0}h2{font-family:Georgia,serif;font-weight:600;font-size:17px;margin:22px 0 8px;border-bottom:1px solid #D9CBB4;padding-bottom:4px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#B5563A;margin:16px 0 6px}.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #3B2A20;padding-bottom:10px;gap:12px;flex-wrap:wrap}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7A6656;font-weight:700}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}.kp div{border-left:3px solid #A8836A;padding-left:10px}.kp b{font-family:Georgia,serif;font-size:30px;font-weight:500;display:block;line-height:1}.kp span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7A6656}.rag{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.rag div{border:1px solid #D9CBB4;border-radius:4px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:12px}.rag i{width:12px;height:12px;border-radius:50%;display:inline-block}table{border-collapse:collapse;width:100%;margin-bottom:6px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7A6656;padding:6px 8px;border-bottom:1px solid #C9B79B}td{padding:7px 8px;border-bottom:1px solid #EFE6D6;vertical-align:top}tr.od td:first-child{border-left:3px solid #A93A2C}.m{font-size:11px;color:#7A6656;margin-top:2px}.m.bad{color:#A93A2C;font-weight:600}.m.warn{color:#8a6215;font-weight:600}.m.note{color:#3B2A20;font-style:italic}.num{white-space:nowrap;font-variant-numeric:tabular-nums}.bad{color:#A93A2C;font-weight:700}.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:700;background:#EFE6D6;white-space:nowrap}.pCritical{background:#F1D6CF;color:#A93A2C}.pHigh{background:#F3E6C8;color:#8a6215}.sIP{background:#DCE6EC;color:#5E7A8C}.sBL{background:#F1D6CF;color:#A93A2C}.sWO{background:#F3E6C8;color:#8a6215}.sFR{background:#E9DFCD;color:#3B2A20}.sDN{background:#E4EADB;color:#6E8560}.prog{min-width:120px}.bar{display:inline-block;width:80px;height:8px;background:#EFE6D6;border-radius:4px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%}.pct{font-size:11px;margin-left:6px;font-variant-numeric:tabular-nums}.sd{color:#6E8560}.so{color:#7A6656}em{font-style:normal;color:#A8836A}.person{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.person .s{font-size:11px;color:#7A6656}.ft{margin-top:24px;border-top:1px solid #D9CBB4;padding-top:8px;font-size:10px;color:#7A6656;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.leg{font-size:10px;color:#7A6656;margin-top:6px}@media print{.pg{padding:0}h2{break-after:avoid}tr{break-inside:avoid}}`;
  let h=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDGG Progress Report — ${E(label)} — ${today}</title><style>${style}</style></head><body><div class="pg">
  <div class="hd"><div><div class="lbl">WRLD Capital Holdings · Enterprise Development &amp; Growth Group</div><h1>Tasks &amp; Progress Report</h1><div class="lbl" style="margin-top:4px;color:#B5563A">${E(label)}</div></div><div style="text-align:right"><div class="lbl">As of</div><div style="font-family:Georgia,serif;font-size:18px">${fmtD(today)} ${today.slice(0,4)}</div><div class="m">Prepared by ${E(role().label)} · ${stamp(nowISO())} (Asia/Manila)</div></div></div>
  <div class="kp"><div><b>${k.open}</b><span>Open tasks</span></div><div><b style="color:${k.overdue?"#A93A2C":"#6E8560"}">${k.overdue}</b><span>Overdue</span></div><div><b>${k.week}</b><span>Due this week</span></div><div><b style="color:${k.blocked?"#C08A2E":"#2E211A"}">${k.blocked}</b><span>Blocked</span></div><div><b>${k.review}</b><span>For review</span></div><div><b style="color:#6E8560">${done.length}</b><span>Completed · ${back}d</span></div><div><b>${open.length?Math.round(open.reduce((s,t)=>s+progressOf(t),0)/open.length):0}%</b><span>Avg progress (open)</span></div></div>`;
  if(units.length>1)h+=`<h3>Unit health</h3><div class="rag">${units.map(u=>{const r=ragOf(u);return `<div><i style="background:${col[r.c]}"></i><b>${E(u)}</b><span class="m" style="margin:0">${r.open} open · ${r.od} overdue · ${r.bl} blocked</span></div>`;}).join("")}</div><div class="leg">Red = any overdue Critical/High, or ≥2 blocked, or ≥3 overdue · Amber = any overdue or blocked · Green otherwise.</div>`;
  if(att.length)h+=`<h2>Needs attention (${att.length})</h2><table><thead><tr><th>Task</th><th>Priority</th><th>Status</th><th>Progress</th><th>Due</th></tr></thead><tbody>${att.map(trow).join("")}</tbody></table>`;
  h+=`<h2>Open tasks by person (${open.length})</h2>`;
  for(const p of order){const a=groups[p].sort((x,y)=>overdueDays(y)-overdueDays(x)||PRIOS.indexOf(x.priority)-PRIOS.indexOf(y.priority)||(x.due||"9").localeCompare(y.due||"9"));const st=seatOf(a[0]);const od=a.filter(t=>overdueDays(t)>0).length;const avg=Math.round(a.reduce((s,t)=>s+progressOf(t),0)/a.length);
    h+=`<div class="person"><h3 style="margin-bottom:4px">${E(p)}${st?` <span class="s" style="text-transform:none;letter-spacing:0;color:#7A6656">— ${E(st.title)}${st.code?" · "+E(st.code):""}</span>`:""}</h3><span class="s">${a.length} open · <span class="${od?"bad":""}">${od} overdue</span> · ${a.filter(t=>t.status==="BL").length} blocked · avg ${avg}%</span></div><table><thead><tr><th style="width:52%">Task</th><th>Priority</th><th>Status</th><th>Progress</th><th>Due</th></tr></thead><tbody>${a.map(trow).join("")}</tbody></table>`;}
  if(!order.length)h+=`<p class="m">No open tasks in this scope.</p>`;
  h+=`<h2>Completed in the last ${back} days (${done.length})</h2>${done.length?`<table><thead><tr><th>Task</th><th>Owner</th><th>Unit</th><th>Due</th><th>Completed</th></tr></thead><tbody>${done.map(t=>`<tr><td><b>${E(t.title)}</b>${t.link?`<div class="m">${E(t.link)}</div>`:""}</td><td>${E(t.owner)}</td><td>${E(USHORT[t.unit]||t.unit)}</td><td class="num">${fmtD(t.due)}</td><td class="num">${fmtD(t.completed)}${t.due&&t.completed>t.due?` <span class="bad">(+${daysBetween(t.due,t.completed)}d)</span>`:""}</td></tr>`).join("")}</tbody></table>`:`<p class="m">Nothing closed in this period.</p>`}`;
  h+=`<div class="ft"><span>EDGG Task Monitor · progress = sub-tasks done, or a status-based estimate where a task has none (In Progress 40%, Waiting 50%, Blocked 35%, For Review 90%).</span><span>${ts.length} tasks in scope · ${E(S.meta.docNo||"")} ${E(S.meta.revision||"")}</span></div></div></body></html>`;
  return h;
}
function htmlToText(sc){
  const {ts,label,back}=sc;const today=todayStr();const k=kpis(ts);const open=ts.filter(t=>OPEN(t.status));const by={};for(const t of open){(by[t.owner||"Unassigned"]=by[t.owner||"Unassigned"]||[]).push(t);}
  const out=[`EDGG TASKS & PROGRESS REPORT — ${label} — as of ${fmtD(today)} ${today.slice(0,4)}`,`Open ${k.open} · Overdue ${k.overdue} · Due this week ${k.week} · Blocked ${k.blocked} · For review ${k.review} · Completed (${back}d) ${ts.filter(t=>t.status==="DN"&&t.completed&&daysBetween(t.completed,today)<=back).length}`,""];
  for(const [p,a] of Object.entries(by)){out.push(`${p.toUpperCase()} — ${a.length} open, ${a.filter(t=>overdueDays(t)>0).length} overdue`);for(const t of a)out.push(` - ${t.title} [${SNAME[t.status]} · ${t.priority} · ${progressOf(t)}% · ${dueWord(t)}]${t.status==="BL"&&t.blockReason?" — blocked: "+t.blockReason:""}${t.status==="WO"&&t.waitingOn?" — waiting on "+t.waitingOn:""}${latestNote(t)?" — "+latestNote(t):""}`);out.push("");}
  const done=ts.filter(t=>t.status==="DN"&&t.completed&&daysBetween(t.completed,today)<=back);out.push(`COMPLETED (last ${back} days): ${done.length}`);for(const t of done)out.push(` - ${t.title} [${t.owner}] completed ${fmtD(t.completed)}`);
  return out.join("\n");
}

/* ===================== org chart ===================== */
function seatsAll(){return [...S.seats.values()].filter(s=>!s.abolished);}
function seatChildren(id){return seatsAll().filter(s=>s.reportsTo===id).sort((a,b)=>(a.order||0)-(b.order||0)||a.title.localeCompare(b.title));}
function seatLayer(s){let n=1,c=s,g=0;while(c&&c.reportsTo&&S.seats.get(c.reportsTo)&&g++<40){c=S.seats.get(c.reportsTo);n++;}return n;}
function occ(s){if(s.status==="VACANT")return "VACANT";if(s.status==="OIC")return "OIC: "+(s.occupant||"—");if(s.status==="ACTING")return "ACTING: "+(s.occupant||"—");return s.occupant||"—";}
function seatPerson(s){return s&&s.status!=="VACANT"?(s.occupant||""):"";}
function isCover(y){return y.status==="OIC"||y.status==="ACTING";}
function gradeNum(g){const m=String(g||"").match(/(\d+)/);return m?+m[1]:null;}
function actualOf(s){if(!isCover(s))return null;const own=s.alsoSeat?S.seats.get(s.alsoSeat):null;const title=(s.actualTitle||"").trim()||(own?own.title:"")||(s.substantive||"");const grade=(s.actualGrade||"").trim()||(own?own.grade:"")||"";const rq=gradeNum(s.grade),ac=gradeNum(grade);const gap=(rq!=null&&ac!=null)?rq-ac:null;return {title,grade,gap,own};}
function belowGrade(s){const a=actualOf(s);return !!(a&&a.gap>0);}
function actualText(s){const a=actualOf(s);if(!a||(!a.title&&!a.grade))return "";return [a.title,a.grade].filter(Boolean).join(" · ");}
function gapText(s){const a=actualOf(s);if(!a||a.gap==null)return "";return a.gap>0?`${a.gap} grade${a.gap>1?"s":""} below the seat's ${s.grade}`:a.gap<0?`above the seat's ${s.grade}`:"at seat grade";}
function actualHtml(s,cls){const t=actualText(s);if(!t)return "";const g=gapText(s);return `<span class="${cls||"small muted"}" style="font-weight:400"> · actually ${esc(t)}</span>${g?`<span class="pill ${belowGrade(s)?"gap":"gapok"}" title="Actual grade of the person covering vs the grade the seat requires">${esc(g)}</span>`:""}`;}
function coversFor(seat){ // seats this person also covers as OIC/Acting
  if(!seat||!seatPerson(seat))return [];const nm=seatPerson(seat).trim().toLowerCase();
  return seatsAll().filter(y=>y.id!==seat.id&&isCover(y)&&(y.alsoSeat===seat.id||(y.occupant||"").trim().toLowerCase()===nm));}
function coversForName(name){if(!name)return [];const nm=name.trim().toLowerCase();return seatsAll().filter(y=>isCover(y)&&(y.occupant||"").trim().toLowerCase()===nm);}
function seatShort(s){return `${s.title}${seatPerson(s)?" — "+seatPerson(s):" (vacant)"}`;}
function descendants(id){const out=new Set();const walk=x=>{for(const c of seatChildren(x)){if(!out.has(c.id)){out.add(c.id);walk(c.id);}}};walk(id);return out;}
function orgScope(){const all=seatsAll();if(S.orgView==="all")return all;const inUnit=all.filter(s=>s.unit===S.orgView);const ids=new Set(inUnit.map(s=>s.id));const extra=[];for(const s of inUnit){if(s.reportsTo&&!ids.has(s.reportsTo)){const p=S.seats.get(s.reportsTo);if(p&&!p.abolished&&!extra.includes(p))extra.push(p);}}return extra.concat(inUnit);}
function orgRoots(list){const ids=new Set(list.map(s=>s.id));return list.filter(s=>!s.reportsTo||!ids.has(s.reportsTo)).sort((a,b)=>seatLayer(a)-seatLayer(b)||(a.order||0)-(b.order||0));}
function subHead(subId){const mine=seatsAll().filter(x=>x.sub===subId);return mine.find(x=>!x.reportsTo||!mine.some(y=>y.id===x.reportsTo))||null;}
function subProjects(subId){return projectsAll().filter(p=>p.subId===subId);}
function seatProjects(s){const h=s.sub?subHead(s.sub):null;return projectsAll().filter(p=>p.leadSeat===s.id||(p.team||[]).some(m=>m.seatId===s.id)||(h&&h.id===s.id&&p.subId===s.sub));}
function projectHome(p){if(p.subId&&subunit(p.subId))return subLabel(p.subId);const st=p.leadSeat&&S.seats.get(p.leadSeat);return st?`${seatPerson(st)||st.title}`:(p.leadName||"");}
async function assignProject(pid,target){ // target: {seatId} or {subId} or {} to unassign
  const p=S.projects.get(pid);if(!p||!isDirector())return;const n=JSON.parse(JSON.stringify(p));n.log=n.log||[];const before=projectHome(p)||"unassigned";
  if(target.seatId){const st=S.seats.get(target.seatId);if(!st)return;n.leadSeat=st.id;n.leadName=seatPerson(st)||st.title;n.leadDept="";n.subId=st.sub||"";}
  else if(target.subId){const u=subunit(target.subId);if(!u)return;n.subId=u.id;const h=subHead(u.id);if(h){n.leadSeat=h.id;n.leadName=seatPerson(h)||h.title;n.leadDept="";}}
  else{n.subId="";n.leadSeat="";n.leadName="";}
  const after=projectHome(n)||"unassigned";if(before===after)return;logEntry(n,"assign",`Placed under ${after} (was ${before})`);await saveProject(n);toast(`${p.name} → ${after}`);
}
async function quickAddProjects(names,target){
  const list=names.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);if(!list.length)return;
  for(const name of list){if(projectsAll().some(p=>p.name.toLowerCase()===name.toLowerCase()))continue;const pj=blankProject();pj.name=name;pj.status="Planning";pj.log=[];logEntry(pj,"create","Project created from the org chart");
    if(target&&target.seatId){const st=S.seats.get(target.seatId);if(st){pj.leadSeat=st.id;pj.leadName=seatPerson(st)||st.title;pj.subId=st.sub||"";}}
    if(target&&target.subId){pj.subId=target.subId;const h=subHead(target.subId);if(h){pj.leadSeat=h.id;pj.leadName=seatPerson(h)||h.title;}}
    S.projects.set(pj.id,pj);await saveProject(pj);}
  toast(`${list.length} project${list.length>1?"s":""} added`);
}
let TM=null;
function headsUnit(x){return x.sub&&subHead(x.sub)&&subHead(x.sub).id===x.id?subunit(x.sub):null;}

  TM={seatId};
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog" style="width:min(680px,100%)"><div class="dh"><h2>Units under ${esc(x.title)}${seatPerson(x)?" — "+esc(seatPerson(x)):""}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db">
    <div class="note">Fill in the outline and press Save: the top line names the unit this person heads; each line below names the team that report leads. Leave a line blank to keep that report directly under ${esc(seatPerson(x)||x.title)} with no team of their own.</div>
    <div class="sub"><h3>Unit headed by ${esc(seatPerson(x)||x.title)}</h3><div class="grid" style="grid-template-columns:2fr 1fr;gap:8px"><div class="field"><label>Name</label><input type="text" id="tm_head" value="${esc(hu?hu.name:"")}" placeholder="e.g. PROJECT DEVELOPMENT - BATAAN"></div><div class="field"><label>Kind</label><select id="tm_headkind">${SUB_KINDS.map(k=>`<option ${k===(hu?hu.kind:"Territory")?"selected":""}>${k}</option>`).join("")}</select></div></div>${x.sub&&!hu?`<div class="small muted" style="margin-top:4px">Currently inside ${esc(subLabel(x.sub))}; the new unit is created under it.</div>`:""}</div>
    <div class="sub"><h3>Teams under it — one line per direct report</h3>${reports.length?`<div class="rowhead" style="grid-template-columns:1.6fr 2fr 1fr"><span>Report</span><span>Team name</span><span>Kind</span></div>${reports.map(r=>{const ru=headsUnit(r);return `<div class="rowline" style="grid-template-columns:1.6fr 2fr 1fr"><div><b>${esc(seatPerson(r)||r.title)}</b><div class="small muted">${esc(r.title)}${r.sub&&!ru?" · in "+esc(subLabel(r.sub)):""}</div></div><input type="text" data-tm-team="${r.id}" value="${esc(ru?ru.name:"")}" placeholder="e.g. Asiana PET"><select data-tm-kind="${r.id}">${SUB_KINDS.map(k=>`<option ${k===(ru?ru.kind:"Team")?"selected":""}>${k}</option>`).join("")}</select></div>`;}).join("")}`:`<div class="small muted">No direct reports yet — add them with + Report, then come back here to name their teams.</div>`}</div>
  </div><div class="df"><span class="spacer"></span><button class="btn" data-close type="button">Cancel</button><button class="btn primary" data-tmsave="1" type="button">Save</button></div></div></div>`;
  setTimeout(()=>{const f=$("#tm_head");f&&f.focus();},30);
}
async function saveTeamDialog(){
  const x=S.seats.get(TM.seatId);if(!x)return;
  const headName=$("#tm_head").value.trim(),headKind=$("#tm_headkind").value;
  const teams=[...document.querySelectorAll("[data-tm-team]")].map(el=>({id:el.dataset.tmTeam,name:el.value.trim(),kind:(document.querySelector(`[data-tm-kind="${el.dataset.tmTeam}"]`)||{}).value||"Team"}));
  const st=JSON.parse(JSON.stringify(S.struct));const moves=new Map();const notes=[];
  const moveTree=(root,oldSub,newSub)=>{moves.set(root.id,newSub);for(const id of descendants(root.id)){const d=S.seats.get(id);if(d&&(moves.has(id)?moves.get(id):(d.sub||""))===oldSub)moves.set(id,newSub);}};
  // 1. unit headed by x
  let headId=x.sub||"";const hu=headsUnit(x);
  if(headName){
    if(hu){const u=st.subunits.find(u=>u.id===hu.id);if(u.name!==headName||u.kind!==headKind){notes.push(`unit "${u.name}" → "${headName}"`);u.name=headName;u.kind=headKind;}headId=u.id;}
    else{const u={id:uid("su"),deptId:x.unit,parentId:x.sub||"",kind:headKind,name:headName,order:st.subunits.length};st.subunits.push(u);moveTree(x,x.sub||"",u.id);headId=u.id;notes.push(`${headKind.toLowerCase()} "${headName}" headed by ${x.title}`);}
  }
  // 2. teams per direct report
  for(const t of teams){const r=S.seats.get(t.id);if(!r)continue;const ru=headsUnit(r);
    if(t.name){
      if(ru){const u=st.subunits.find(u=>u.id===ru.id);if(u.name!==t.name||u.kind!==t.kind||u.parentId!==headId){notes.push(`team "${u.name}" → "${t.name}"`);u.name=t.name;u.kind=t.kind;u.parentId=headId;}}
      else{const u={id:uid("su"),deptId:r.unit,parentId:headId,kind:t.kind,name:t.name,order:st.subunits.length};st.subunits.push(u);const old=moves.has(r.id)?moves.get(r.id):(r.sub||"");moveTree(r,old,u.id);notes.push(`${t.kind.toLowerCase()} "${t.name}" led by ${seatPerson(r)||r.title}`);}
    }else if(!ru){ // no team: sit directly in the head unit
      const cur=moves.has(r.id)?moves.get(r.id):(r.sub||"");if(cur!==headId)moveTree(r,cur,headId);
    }
  }
  if(!notes.length&&!moves.size){toast("Nothing to change.");return;}
  closeModal();TM=null;await saveStruct(st);
  for(const [id,sub] of moves){const y=S.seats.get(id);if(!y||(y.sub||"")===sub)continue;const n=JSON.parse(JSON.stringify(y));n.sub=sub;n.log=n.log||[];logEntry(n,"field",`Placed in ${sub?subLabel(sub):"department level"}`);await saveSeat(n);}
  // drop sub-units left empty by the reshuffle
  const st2=JSON.parse(JSON.stringify(S.struct));const used=new Set([...S.seats.values()].filter(y=>!y.abolished).map(y=>y.sub).filter(Boolean));const before=st2.subunits.length;st2.subunits=st2.subunits.filter(u=>used.has(u.id)||st2.subunits.some(c=>c.parentId===u.id&&used.has(c.id))||projectsAll().some(p=>p.subId===u.id));if(st2.subunits.length!==before)await saveStruct(st2);
  const m=Object.assign({},S.meta);m.pendingStructural=true;m.structuralNotes=(m.structuralNotes||[]).concat(notes.length?notes:["units reorganised"]).slice(-12);await saveMeta(m);

  const noMgr=(S.struct.subunits||[]).filter(u=>{const mine=seats.filter(x=>x.sub===u.id);return mine.length&&!mine.some(x=>!x.reportsTo||!mine.some(y=>y.id===x.reportsTo));}).map(u=>u.kind+" "+u.name);add(noMgr.length?"warn":"ok",noMgr.length?`Sub-units where nobody is in charge: ${noMgr.join("; ")}.`:"Every sub-unit with seats has someone in charge.");
  const oic=seats.filter(s=>isCover(s)&&!s.substantive&&!s.alsoSeat);add(oic.length?"warn":"ok",oic.length?`${oic.length} OIC/acting seat(s) do not say which seat the covering person actually holds (${oic.slice(0,3).map(s=>s.title).join("; ")}). Name it so the chart shows they hold two boxes.`:"Every OIC or acting seat names the covering person's own seat.",oic.map(s=>s.id));
  const bg=seats.filter(belowGrade);add(bg.length?"warn":"ok",bg.length?`${bg.length} seat(s) are covered by someone below the seat's grade: ${bg.map(s=>`${s.title} needs ${s.grade}, ${s.occupant} is ${actualOf(s).grade}`).join("; ")}. Decide: promote, appoint, or keep as OIC with a date.`:"No seat is covered by someone below its grade.",bg.map(s=>s.id));

function readForm(){

  document.querySelectorAll("[data-sub-done]").forEach(el=>{t.subtasks[+el.dataset.subDone].done=el.checked;});

async function saveModal(){
  readForm();const t=M.t,o=M.orig;
  if(!t.title){M.err="Title is required.";drawModal();return;}
  if(t.tier==="Routine"&&!t.recurrence){M.err="Routine tasks need a recurrence.";drawModal();return;}
  if(t.start&&t.due&&t.due<t.start){M.err="Due date is before start date.";drawModal();return;}
  const from=o?o.status:"NS";
  if(t.status!==from||M.isNew){
    const chk=checkStatusChange(t,t.status,{reason:t.blockReason,waitingOn:t.waitingOn});
    if(!chk.ok){M.err=chk.msg;drawModal();return;}
    if(t.status==="DN"&&!t.completed)t.completed=todayStr();
    if(t.status!=="DN"&&from==="DN")t.completed="";
    if(!M.isNew)logEntry(t,"status",`Status ${SNAME[from]} → ${SNAME[t.status]}${t.status==="BL"?" — "+t.blockReason:t.status==="WO"?" — waiting on "+t.waitingOn:""}`,{from,to:t.status});
  }
  t.subtasks=t.subtasks.filter(s=>s.title.trim());t.attachments=t.attachments.filter(a=>a.url||a.label);
  if(M.isNew){logEntry(t,"create","Task created");}
  else{
    for(const [k,l] of [["due","Due date"],["start","Start date"],["completed","Completed date"]])if((o[k]||"")!==(t[k]||""))logEntry(t,"date",`${l} ${fmtD(o[k])} → ${fmtD(t[k])}`);
    for(const [k,l] of [["owner","Owner"],["priority","Priority"],["unit","Unit"],["tier","Tier"],["category","Category"]])if((o[k]||"")!==(t[k]||""))logEntry(t,"field",`${l} "${o[k]||"—"}" → "${t[k]||"—"}"`);
    const osd=(o.subtasks||[]).filter(s=>s.done).length,nsd=t.subtasks.filter(s=>s.done).length;if(osd!==nsd)logEntry(t,"sub",`Sub-tasks done ${osd} → ${nsd}`);
  }
  const wasRoutineDone=t.status==="DN"&&from!=="DN"&&t.tier==="Routine"&&t.recurrence&&t.due;
  closeModal();
  await saveTask(t);if(t.status==="DN"&&from!=="DN")await issueTaskDone(t);
  if(wasRoutineDone){
    const nx=JSON.parse(JSON.stringify(t));nx.id=uid("t");nx.status="NS";nx.completed="";nx.blockReason="";nx.waitingOn="";nx.comments=[];nx.log=[];nx.due=nextDue(t.due,t.recurrence);nx.start=t.start?nextDue(t.start,t.recurrence):"";nx.subtasks=t.subtasks.map(s=>Object.assign({},s,{done:false,id:uid("s")}));nx.created=nowISO();nx.createdBy=role().label;
    logEntry(nx,"create",`Auto-generated next ${t.recurrence.toLowerCase()} instance`);await saveTask(nx);toast(`Saved. Next ${t.recurrence.toLowerCase()} instance due ${fmtD(nx.due)}.`);
  }else toast(M&&M.isNew?"Task created":"Saved");
}
function closeModal(){$("#modals").innerHTML="";}
function askText(title,label,cb,opts){
  opts=opts||{};
  $("#modals").insertAdjacentHTML("beforeend",`<div class="ov" id="ask"><div class="dlg narrow"><div class="dh"><h2>${esc(title)}</h2></div><div class="db"><div class="field"><label>${esc(label)}</label><textarea id="askV" rows="${opts.value!==undefined?1:3}">${esc(opts.value||"")}</textarea></div></div><div class="df"><span class="spacer"></span><button class="btn" id="askNo" type="button">Cancel</button><button class="btn primary" id="askOk" type="button">${esc(opts.ok||"Confirm")}</button></div></div></div>`);
  const close=()=>{const a=$("#ask");if(a)a.remove();};
  $("#askNo").onclick=()=>{close();cb(null);};
  $("#askOk").onclick=()=>{const v=$("#askV").value.trim();if(!v){toast("This field is required.");return;}close();cb(v);};
  setTimeout(()=>{const v=$("#askV");if(v){v.focus();v.select();}},30);
  $("#askV").addEventListener("keydown",e=>{if(e.key==="Enter"&&opts.value!==undefined){e.preventDefault();$("#askOk").click();}});
}
function askConfirm(title,body,cb){
  $("#modals").insertAdjacentHTML("beforeend",`<div class="ov" id="ask"><div class="dlg narrow"><div class="dh"><h2>${esc(title)}</h2></div><div class="db">${esc(body)}</div><div class="df"><span class="spacer"></span><button class="btn" id="askNo" type="button">Keep</button><button class="btn danger" id="askOk" type="button">Confirm</button></div></div></div>`);
  const close=()=>{const a=$("#ask");if(a)a.remove();};
  $("#askNo").onclick=()=>{close();cb(false);};$("#askOk").onclick=()=>{close();cb(true);};
}

async function clearSample(){
  askConfirm("Clear sample data","This removes every task, escalation, project, issue and org-chart seat marked SAMPLE. Your own records are untouched.",async ok=>{
    if(!ok)return;
    const ts=allTasks().filter(t=>t.sample),es=[...S.esc.values()].filter(e=>e.sample);
    for(const t of ts){S.tasks.delete(t.id);if(S.db){try{await S.db.doc("tasks/"+t.id).delete();}catch(e){}}}
    for(const e of es){S.esc.delete(e.id);if(S.db){try{await S.db.doc("escalations/"+e.id).delete();}catch(x){}}}
    for(const x of [...S.projects.values()].filter(p=>p.sample)){S.projects.delete(x.id);if(S.db){try{await S.db.doc("projects/"+x.id).delete();}catch(e){}}}
    for(const x of [...S.issues.values()].filter(i=>i.sample)){S.issues.delete(x.id);if(S.db){try{await S.db.doc("issues/"+x.id).delete();}catch(e){}}}
    for(const x of [...S.events.values()].filter(e=>e.sample)){S.events.delete(x.id);if(S.db){try{await S.db.doc("events/"+x.id).delete();}catch(e){}}}
    const ss=[...S.seats.values()].filter(s=>s.sample);
    for(const s of ss){S.seats.delete(s.id);if(S.db){try{await S.db.doc("seats/"+s.id).delete();}catch(x){}}}
    render();toast(`Removed ${ts.length} sample tasks and ${ss.length} sample seats.`);
  });
}

function accountsSynced(){ // called after every accounts snapshot: validate the session
  const ses=sessionLoad();
  if(ses){const a=S.accounts.get(ses.username);if(a&&!a.disabled&&a.hash.startsWith(ses.token)){S.user={username:a.username,name:a.name,level:a.level,seatId:a.seatId||"",unit:a.unit||""};if(a.mustChange&&!S._pwPrompted){S._pwPrompted=true;setTimeout(()=>openPassword(true),200);}}else{S.user=null;sessionSave(null);}}
  const sel=$("#roleSel");if(sel)sel.hidden=true;
  render();
}
async function login(username,pw){
  username=(username||"").trim().toLowerCase();const a=S.accounts.get(username);
  if(!a||a.disabled)return "Unknown username, or the account is disabled.";
  const h=await pwHash(pw,a.salt);if(h!==a.hash)return "Wrong password.";
  sessionSave({username,token:h.slice(0,16)});const n=Object.assign({},a,{lastLogin:nowISO()});await saveAccount(n);
  S.user={username:a.username,name:a.name,level:a.level,seatId:a.seatId||"",unit:a.unit||""};S.tab=a.level==="director"?"board":"units";if(role().unit)S.unitPage=role().unit;
  if(a.mustChange){S._pwPrompted=true;setTimeout(()=>openPassword(true),200);}
  render();return "";
}
function logout(){sessionSave(null);S.user=null;S._pwPrompted=false;render();}
function renderLogin(){
  const first=S.accountsLoaded&&S.accounts.size===0;const connecting=!S.accountsLoaded;
  $("#main").innerHTML=`<div class="gate"><div class="lbl">WRLD Capital Holdings · ${esc(S.struct.group.short||"EDGG")}</div>
  ${connecting?`<h2>Connecting…</h2><p>Loading the shared database.</p>`:first?`<h2>Create the administrator</h2><p>No accounts exist yet. This first account is the Director's and can create everyone else's from the org chart.</p>
    <div class="field"><label>Your name</label><input type="text" id="lg_name" placeholder="e.g. P. Cruz"></div><div class="field" style="margin-top:8px"><label>Username</label><input type="text" id="lg_user" placeholder="e.g. pcruz" autocomplete="username"></div><div class="field" style="margin-top:8px"><label>Password (8+ characters)</label><input type="password" id="lg_pw" autocomplete="new-password"></div><div class="field" style="margin-top:8px"><label>Repeat password</label><input type="password" id="lg_pw2" autocomplete="new-password"></div>
    <div class="err" id="lg_err" hidden style="margin-top:10px"></div><button class="btn primary" id="lg_create" style="width:100%;justify-content:center;padding:10px;margin-top:12px">Create administrator account</button>`
  :`<h2>Sign in</h2><p>Use the username and password the Director gave you. Every change is recorded under your name.</p>
    <div class="field"><label>Username</label><input type="text" id="lg_user" autocomplete="username" autocapitalize="none"></div><div class="field" style="margin-top:8px"><label>Password</label><input type="password" id="lg_pw" autocomplete="current-password"></div>
    <div class="err" id="lg_err" hidden style="margin-top:10px"></div><button class="btn primary" id="lg_go" style="width:100%;justify-content:center;padding:10px;margin-top:12px">Sign in</button><p class="small muted" style="margin:10px 0 0">Forgot it? Ask the Director to reset your password in Settings → Accounts.</p>`}
  </div>`;
  const err=m=>{const e=$("#lg_err");if(!e)return;e.hidden=!m;e.textContent=m;};
  const go=$("#lg_go");if(go){const doLogin=async()=>{go.disabled=true;const m=await login($("#lg_user").value,$("#lg_pw").value);go.disabled=false;if(m)err(m);};go.onclick=doLogin;["lg_user","lg_pw"].forEach(id=>$("#"+id).addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();}));setTimeout(()=>{const u=$("#lg_user");u&&u.focus();},30);}
  const cr=$("#lg_create");if(cr)cr.onclick=async()=>{const name=$("#lg_name").value.trim(),user=$("#lg_user").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),pw=$("#lg_pw").value,pw2=$("#lg_pw2").value;
    if(!name||!user)return err("Name and username are required.");if(pw.length<8)return err("Use at least 8 characters.");if(pw!==pw2)return err("The passwords do not match.");if(S.accounts.size)return err("An administrator already exists — sign in instead.");
    const salt=randStr(16);const a={username:user,name,level:"director",seatId:"",unit:"",salt,hash:await pwHash(pw,salt),mustChange:false,disabled:false,created:nowISO(),createdBy:name};await saveAccount(a);await login(user,pw);toast("Welcome. Next: create the others' accounts from Settings → Accounts.");};
}
/* change password */
function openPassword(forced){
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg narrow" role="dialog"><div class="dh"><h2>${forced?"Set your own password":"Change password"}</h2>${forced?"":`<button class="x" data-close aria-label="Close">×</button>`}</div><div class="db">${forced?`<div class="note">You signed in with a temporary password. Choose your own before continuing.</div>`:""}
    ${forced?"":`<div class="field"><label>Current password</label><input type="password" id="pw_old" autocomplete="current-password"></div>`}<div class="field" style="margin-top:8px"><label>New password (8+ characters)</label><input type="password" id="pw_new" autocomplete="new-password"></div><div class="field" style="margin-top:8px"><label>Repeat new password</label><input type="password" id="pw_new2" autocomplete="new-password"></div><div class="err" id="pw_err" hidden style="margin-top:10px"></div>
  </div><div class="df"><span class="spacer"></span>${forced?"":`<button class="btn" data-close type="button">Cancel</button>`}<button class="btn primary" id="pw_save" type="button">Save password</button></div></div></div>`;
  $("#pw_save").onclick=async()=>{const e=$("#pw_err");const show=m=>{e.hidden=false;e.textContent=m;};const a=S.accounts.get(S.user.username);if(!a)return show("Account not found.");
    if(!forced){const h=await pwHash($("#pw_old").value,a.salt);if(h!==a.hash)return show("Current password is wrong.");}
    const pw=$("#pw_new").value;if(pw.length<8)return show("Use at least 8 characters.");if(pw!==$("#pw_new2").value)return show("The passwords do not match.");
    const salt=randStr(16);const n=Object.assign({},a,{salt,hash:await pwHash(pw,salt),mustChange:false,pwChanged:nowISO()});sessionSave({username:a.username,token:n.hash.slice(0,16)});closeModal();await saveAccount(n);toast("Password changed");};
  setTimeout(()=>{const f=$(forced?"#pw_new":"#pw_old");f&&f.focus();},30);
}
/* admin: accounts panel + provisioning */
function vAccounts(){
  if(!isDirector())return "";
  const seats=seatsAll().filter(x=>seatPerson(x)).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||seatLayer(a)-seatLayer(b));
  const hasAcc=x=>accountForSeat(x.id)||[...S.accounts.values()].find(a=>a.name.trim().toLowerCase()===seatPerson(x).trim().toLowerCase());
  const missing=seats.filter(x=>!hasAcc(x));
  const rows=seats.filter(x=>accountForSeat(x.id)||!isCover(x)||!hasAcc(x)).map(x=>{const a=accountForSeat(x.id)||(isCover(x)?null:null);const cov=seatPerson(x)?coversForName(seatPerson(x)).filter(c=>c.id!==x.id):[];return `<tr><td class="t" style="cursor:default"><b>${esc(seatPerson(x))}</b><div class="small muted">${esc(x.title)} · ${esc(USHORT[x.unit])}${cov.length?` · also ${cov.map(c=>(c.status==="OIC"?"OIC":"Acting")+" — "+esc(c.title)).join("; ")}`:""}${isCover(x)?` · <span style="color:var(--warn)">${x.status==="OIC"?"OIC":"Acting"} seat — the person signs in with their own account</span>`:""}</div></td><td>${a?`<code>${esc(a.username)}</code>${a.disabled?" "+pill("st-CX","disabled"):a.mustChange?" "+pill("st-WO","temp password"):" "+pill("st-DN","active")}`:`<span class="muted small">no account</span>`}</td><td>${a?`<select data-acclevel="${esc(a.username)}">${ACC_LEVELS.map(([v,l])=>`<option value="${v}" ${a.level===v?"selected":""}>${l.split(" — ")[0]}</option>`).join("")}</select>`:`<span class="small muted">${ACC_LEVELS.find(l=>l[0]===levelFor(x))[1].split(" — ")[0]}</span>`}</td><td class="small muted num">${a&&a.lastLogin?stamp(a.lastLogin):"—"}</td><td><div class="row" style="gap:4px">${a?`<button class="btn sm" data-acc="reset:${esc(a.username)}">Reset password</button><button class="btn sm ghost" data-acc="${a.disabled?"enable":"disable"}:${esc(a.username)}">${a.disabled?"Enable":"Disable"}</button><button class="btn sm ghost danger" data-acc="delete:${esc(a.username)}">Delete</button>`:`<button class="btn sm primary" data-acc="create:${x.id}">Create account</button>`}</div></td></tr>`;}).join("");
  const orphans=[...S.accounts.values()].filter(a=>!a.seatId||!S.seats.get(a.seatId)||S.seats.get(a.seatId).abolished);
  return `<div class="panel" style="margin-bottom:12px"><div class="ph"><h2>Accounts</h2><span class="small muted">one per person on the org chart · ${S.accounts.size} account${S.accounts.size===1?"":"s"}</span><span class="spacer"></span>${missing.length?`<button class="btn primary sm" data-acc="createall">Create ${missing.length} missing account${missing.length>1?"s":""}</button>`:""}</div><div class="pb">
    <p class="small muted" style="margin:0 0 10px">Accounts are created from the people named on the org chart. Each gets a username and a temporary password that you hand to them; they set their own password at first sign-in. Level decides what they can change: Director everything, Department head their department's tasks and projects, Member their own tasks (and comments and issues) with everything else read-only. Put a name in a seat first, then create the account.</p>
    <div class="tblwrap"><table class="reg" style="min-width:720px"><thead><tr><th>Person · seat</th><th>Username</th><th>Level</th><th>Last sign-in</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">No filled seats yet — put names into the org chart first.</td></tr>`}
    ${orphans.map(a=>`<tr><td class="t" style="cursor:default"><b>${esc(a.name)}</b><div class="small muted">${a.level==="director"?"administrator":"not linked to a seat"}</div></td><td><code>${esc(a.username)}</code>${a.disabled?" "+pill("st-CX","disabled"):""}</td><td><select data-acclevel="${esc(a.username)}">${ACC_LEVELS.map(([v,l])=>`<option value="${v}" ${a.level===v?"selected":""}>${l.split(" — ")[0]}</option>`).join("")}</select></td><td class="small muted num">${a.lastLogin?stamp(a.lastLogin):"—"}</td><td><div class="row" style="gap:4px"><button class="btn sm" data-acc="reset:${esc(a.username)}">Reset password</button>${a.username===S.user.username?"":`<button class="btn sm ghost" data-acc="${a.disabled?"enable":"disable"}:${esc(a.username)}">${a.disabled?"Enable":"Disable"}</button><button class="btn sm ghost danger" data-acc="delete:${esc(a.username)}">Delete</button>`}</div></td></tr>`).join("")}</tbody></table></div>
    <div class="note" style="margin-top:10px">These are app-level accounts: passwords are stored only as salted hashes, but anyone holding the database URL and workspace key can still reach the data directly. Keep those two private; move to Firebase Authentication when you need real per-user security.</div>
  </div></div>`;
}
let CRED=null;
async function provision(seatIds){
  const made=[];
  for(const id of seatIds){const x=S.seats.get(id);if(!x||accountForSeat(id))continue;
    const same=[...S.accounts.values()].find(acc=>acc.name.trim().toLowerCase()===seatPerson(x).trim().toLowerCase());
    if(same){if(!same.seatId)await saveAccount(Object.assign({},same,{seatId:x.id,unit:x.unit}));continue;}
    const username=suggestUsername(seatPerson(x));const pw=tempPassword();const salt=randStr(16);
    const a={username,name:seatPerson(x),level:levelFor(x),seatId:x.id,unit:x.unit,salt,hash:await pwHash(pw,salt),mustChange:true,disabled:false,created:nowISO(),createdBy:role().label};S.accounts.set(username,a);if(S.db){try{await S.db.doc("accounts/"+username).set(a);}catch(e){}}made.push({name:a.name,seat:x.title,username,pw,level:a.level});}
  if(made.length){CRED=made;showCredentials();}render();
}
function showCredentials(){
  const rows=CRED;
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog"><div class="dh"><h2>Temporary passwords</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db"><div class="note">Shown once. Give each person their line privately; they will be asked to choose their own password at first sign-in.</div>
    <div class="tblwrap"><table class="reg" style="min-width:0"><thead><tr><th>Person</th><th>Seat</th><th>Username</th><th>Temporary password</th><th>Level</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.seat)}</td><td><code>${esc(r.username)}</code></td><td><code style="font-size:14px">${esc(r.pw)}</code></td><td>${esc(r.level)}</td></tr>`).join("")}</tbody></table></div>
  </div><div class="df"><button class="btn sm" data-acc="copycred" type="button">Copy as text</button><button class="btn sm" data-acc="dlcred" type="button">Download CSV</button><span class="spacer"></span><button class="btn primary" data-close type="button">Done</button></div></div></div>`;
}
async function accountAction(a){
  const [op,arg]=a.split(":");
  if(op==="create"){await provision([arg]);return;}
  if(op==="createall"){await provision(seatsAll().filter(x=>seatPerson(x)&&!accountForSeat(x.id)).map(x=>x.id));return;}
  if(op==="copycred"){copyText(CRED.map(r=>`${r.name} (${r.seat}) — username: ${r.username} — temporary password: ${r.pw}`).join("\n"),"Copied");return;}
  if(op==="dlcred"){deliver(`EDGG-accounts-${todayStr()}.csv`,"Name,Seat,Username,Temporary password,Level\r\n"+CRED.map(r=>[r.name,r.seat,r.username,r.pw,r.level].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"Credentials");return;}
  const acc=S.accounts.get(arg);if(!acc)return;
  if(op==="reset"){const pw=tempPassword();const salt=randStr(16);const n=Object.assign({},acc,{salt,hash:await pwHash(pw,salt),mustChange:true,disabled:false});await saveAccount(n);CRED=[{name:n.name,seat:(S.seats.get(n.seatId)||{}).title||"—",username:n.username,pw,level:n.level}];showCredentials();return;}
  if(op==="disable"){if(arg===S.user.username){toast("You cannot disable your own account.");return;}await saveAccount(Object.assign({},acc,{disabled:true}));toast("Disabled");return;}
  if(op==="enable"){await saveAccount(Object.assign({},acc,{disabled:false}));toast("Enabled");return;}
  if(op==="delete"){if(arg===S.user.username){toast("You cannot delete your own account.");return;}askConfirm("Delete this account?",`${acc.name} (${acc.username}) will no longer be able to sign in. Their tasks and log entries stay.`,async ok=>{if(!ok)return;await deleteAccount(arg);toast("Account deleted");});return;}
}

(function boot(){
  try{const th=localStorage.getItem("edgg.theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
  if(ACCOUNTS){S.accounts=new Map();S.accountsLoaded=false;render();}
  else{let r=null;try{r=localStorage.getItem("edgg.role");}catch(e){}
  if(r&&ROLES.some(x=>x.id===r)){setRole(r);}else render();}
  initDb();
})();
</script>
