function importFileChosen(input){
  const f=input.files&&input.files[0];if(!f)return;
  IM=Object.assign(IM||{},{file:f.name,text:"",err:"",proposal:null,status:"Reading "+f.name+"…"});
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  const done=txt=>{IM.text=txt;IM.status=`Loaded ${f.name} (${Math.round(txt.length/1024)} KB)`;const el=$("#impStatus");if(el)el.textContent=IM.status;};
  if(ext==="xlsx"||ext==="xls"){
    loadXlsx().then(()=>{const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});let out="";for(const n of wb.SheetNames){out+=`### Sheet: ${n}\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n],{dateNF:"yyyy-mm-dd",blankrows:false})+"\n\n";}done(out);}catch(x){IM.err="Could not read the workbook: "+x.message;render();}};rd.readAsArrayBuffer(f);}).catch(()=>{IM.err="The Excel reader could not be loaded. Save the sheet as CSV and upload that instead.";render();});
  }else{const rd=new FileReader();rd.onload=e=>done(String(e.target.result||""));rd.readAsText(f);}
}
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res();s.onerror=()=>rej();document.head.appendChild(s);});}

  if(a==="apply"){applyProposal();return;}

  let h=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDGG Progress Report — ${E(label)} — ${today}</title><style>${style}</style></head><body><div class="pg">

function htmlToText(sc){

  for(const [p,a] of Object.entries(by)){out.push(`${p.toUpperCase()} — ${a.length} open, ${a.filter(t=>overdueDays(t)>0).length} overdue`);for(const t of a)out.push(` - ${t.title} [${SNAME[t.status]} · ${t.priority} · ${progressOf(t)}% · ${dueWord(t)}]${t.status==="BL"&&t.blockReason?" — blocked: "+t.blockReason:""}${t.status==="WO"&&t.waitingOn?" — waiting on "+t.waitingOn:""}${latestNote(t)?" — "+latestNote(t):""}`);out.push("");}

/* ===================== org chart ===================== */
function seatsAll(){return [...S.seats.values()].filter(s=>!s.abolished);}
function seatChildren(id){return seatsAll().filter(s=>s.reportsTo===id).sort((a,b)=>seatRank(a)-seatRank(b)||(a.order||0)-(b.order||0)||a.title.localeCompare(b.title));}
function seatLayer(s){let n=1,c=s,g=0;while(c&&c.reportsTo&&S.seats.get(c.reportsTo)&&g++<40){c=S.seats.get(c.reportsTo);n++;}return n;}
function posOnly(){return S.orgPeople===false;}
function dStat(s){return posOnly()?(s.status==="VACANT"?"VACANT":"FILLED"):s.status;}
function occ(s){if(posOnly())return s.status==="VACANT"?"VACANT":"FILLED";if(s.status==="VACANT")return "VACANT";if(s.status==="OIC")return "OIC: "+(s.occupant||"—");if(s.status==="ACTING")return "ACTING: "+(s.occupant||"—");return s.occupant||"—";}
function seatPerson(s){return s&&s.status!=="VACANT"?(s.occupant||""):"";}
function isCover(y){return y.status==="OIC"||y.status==="ACTING";}
function gradeNum(g){const m=String(g||"").match(/(\d+)/);return m?+m[1]:null;}
function actualOf(s){if(!isCover(s))return null;const own=s.alsoSeat?S.seats.get(s.alsoSeat):null;const title=(s.actualTitle||"").trim()||(own?own.title:"")||(s.substantive||"");const grade=(s.actualGrade||"").trim()||(own?own.grade:"")||"";const rq=gradeNum(s.grade),ac=gradeNum(grade);const gap=(rq!=null&&ac!=null)?rq-ac:null;return {title,grade,gap,own};}
function belowGrade(s){const a=actualOf(s);return !!(a&&a.gap>0);}
function actualText(s){const a=actualOf(s);if(!a||(!a.title&&!a.grade))return "";return [a.title,a.grade].filter(Boolean).join(" · ");}
function gapText(s){const a=actualOf(s);if(!a||a.gap==null)return "";return a.gap>0?`${a.gap} grade${a.gap>1?"s":""} below the seat's ${s.grade}`:a.gap<0?`above the seat's ${s.grade}`:"at seat grade";}
function actualHtml(s,cls){const t=actualText(s);if(!t)return "";const g=gapText(s);return `<span class="${cls||"small muted"}" style="font-weight:400"> · actually ${esc(t)}</span>${g?`<span class="pill ${belowGrade(s)?"gap":"gapok"}" title="Actual grade of the person covering vs the grade the seat requires">${esc(g)}</span>`:""}`;}
function coversFor(seat){ // seats this person also covers as OIC/Acting
  if(!seat||!seatPerson(seat))return [];const nm=seatPerson(seat).trim().toLowerCase();
  return seatsAll().filter(y=>y.id!==seat.id&&isCover(y)&&(y.alsoSeat===seat.id||(y.occupant||"").trim().toLowerCase()===nm));}
function coversForName(name){if(!name)return [];const nm=name.trim().toLowerCase();return seatsAll().filter(y=>isCover(y)&&(y.occupant||"").trim().toLowerCase()===nm);}
function seatShort(s){return `${s.title}${seatPerson(s)?" — "+seatPerson(s):" (vacant)"}`;}
function descendants(id){const out=new Set();const walk=x=>{for(const c of seatChildren(x)){if(!out.has(c.id)){out.add(c.id);walk(c.id);}}};walk(id);return out;}
function orgScope(){const all=seatsAll();if(S.orgView==="all")return all;const inUnit=all.filter(s=>s.unit===S.orgView);const ids=new Set(inUnit.map(s=>s.id));const extra=[];for(const s of inUnit){if(s.reportsTo&&!ids.has(s.reportsTo)){const p=S.seats.get(s.reportsTo);if(p&&!p.abolished&&!extra.includes(p))extra.push(p);}}return extra.concat(inUnit);}
function orgRoots(list){const ids=new Set(list.map(s=>s.id));return list.filter(s=>!s.reportsTo||!ids.has(s.reportsTo)).sort((a,b)=>seatLayer(a)-seatLayer(b)||(a.order||0)-(b.order||0));}
function subHead(subId){const mine=seatsAll().filter(x=>x.sub===subId);return mine.find(x=>!x.reportsTo||!mine.some(y=>y.id===x.reportsTo))||null;}
function subProjects(subId){return projectsRaw().filter(p=>p.subId===subId);}
function subDescendants(subId){const out=new Set();const walk=id=>{for(const u of (S.struct.subunits||[]).filter(u=>(u.parentId||"")===id)){if(!out.has(u.id)){out.add(u.id);walk(u.id);}}};walk(subId);return out;}
function rolledProjects(s){ // projects held below this seat: by seats in its downline, or placed on sub-units under the one it heads
  const own=new Set(seatProjects(s).map(p=>p.id));const down=descendants(s.id);const h=s.sub?subHead(s.sub):null;const subs=(h&&h.id===s.id)?subDescendants(s.sub):new Set();
  return projectsRaw().filter(p=>!own.has(p.id)&&((p.leadSeat&&down.has(p.leadSeat))||(p.team||[]).some(m=>down.has(m.seatId))||(p.subId&&subs.has(p.subId))));}
function viaLabel(p,s){if(p.subId&&s.sub!==p.subId&&S.struct.subunits.some(u=>u.id===p.subId))return "via "+subLabel(p.subId);const ls=p.leadSeat?S.seats.get(p.leadSeat):null;return ls?"via "+(ls.occupant||ls.title):"via team";}
function seatProjects(s){const h=s.sub?subHead(s.sub):null;return projectsRaw().filter(p=>p.leadSeat===s.id||(p.team||[]).some(m=>m.seatId===s.id)||(h&&h.id===s.id&&p.subId===s.sub));}
function projectHome(p){if(p.subId&&subunit(p.subId))return subLabel(p.subId);const st=p.leadSeat&&S.seats.get(p.leadSeat);return st?`${seatPerson(st)||st.title}`:(p.leadName||"");}
async function assignProject(pid,target){ // target: {seatId} or {subId} or {} to unassign
  const p=S.projects.get(pid);if(!p||!projInCover(p))return;if(!isDirector()&&(target.subId||(target.seatId&&!canAddUnder(target.seatId)))){toast("Outside your coverage — place it on a seat in your branch");render();return;}const n=JSON.parse(JSON.stringify(p));n.log=n.log||[];const before=projectHome(p)||"unassigned";

}
async function quickAddProjects(names,target){

  for(const name of list){if(projectsAll().some(p=>p.name.toLowerCase()===name.toLowerCase()))continue;const pj=blankProject();pj.name=name;pj.status="Planning";pj.log=[];logEntry(pj,"create","Project created from the org chart");

}

async function saveTeamDialog(){
  const x=S.seats.get(TM.seatId);if(!x)return;

  const teams=[...document.querySelectorAll("[data-tm-team]")].map(el=>({id:el.dataset.tmTeam,name:el.value.trim(),kind:(document.querySelector(`[data-tm-kind="${el.dataset.tmTeam}"]`)||{}).value||"Team"}));
  const st=JSON.parse(JSON.stringify(S.struct));const moves=new Map();const notes=[];
  const moveTree=(root,oldSub,newSub)=>{moves.set(root.id,newSub);for(const id of descendants(root.id)){const d=S.seats.get(id);if(d&&(moves.has(id)?moves.get(id):(d.sub||""))===oldSub)moves.set(id,newSub);}};
  // 1. unit headed by x
  let headId=x.sub||"";const hu=headsUnit(x);

    else{const u={id:uid("su"),deptId:x.unit,parentId:x.sub||"",kind:headKind,name:headName,order:st.subunits.length};st.subunits.push(u);moveTree(x,x.sub||"",u.id);headId=u.id;notes.push(`${headKind.toLowerCase()} "${headName}" headed by ${x.title}`);}

      else{const u={id:uid("su"),deptId:r.unit,parentId:headId,kind:t.kind,name:t.name,order:st.subunits.length};st.subunits.push(u);const old=moves.has(r.id)?moves.get(r.id):(r.sub||"");moveTree(r,old,u.id);notes.push(`${t.kind.toLowerCase()} "${t.name}" led by ${seatPerson(r)||r.title}`);}

function seatMenu(id,x,y){const s=S.seats.get(id);if(!s)return;document.querySelectorAll(".ctxm").forEach(m=>m.remove());const occ0=s.status!=="VACANT";
  const items=[["open","Open seat"],["line","Reports to… (change line)"]].concat(occ0?[["moveto","Move "+(s.occupant||"person")+" to…"],["swap","Swap "+(s.occupant||"person")+" with…"],["vacate","Vacate seat"]]:[["fill","Move someone here…"]]).concat([["rep","⧉ Replicate seat"]]);
  const m=document.createElement("div");m.className="ctxm";m.innerHTML=items.map(([k,l])=>`<div class="ctxi" data-ctx="${k}">${esc(l)}</div>`).join("");document.body.appendChild(m);
  const r=m.getBoundingClientRect();m.style.left=Math.min(x,innerWidth-r.width-8)+"px";m.style.top=Math.min(y,innerHeight-r.height-8)+"px";
  const close=()=>{m.remove();document.removeEventListener("pointerdown",away,true);};const away=e=>{if(!m.contains(e.target))close();};setTimeout(()=>document.addEventListener("pointerdown",away,true),0);

function reparentSeat(id,newParent){

  if(descendants(id).has(newParent)){toast("A seat cannot report to one of its own reports.");return;}
  askConfirm("Change reporting line?",`"${s.title}" will report to "${p.title}" (solid line). This is a structural change and needs a new revision.`,async ok=>{if(!ok){render();return;}
    const ns=JSON.parse(JSON.stringify(s));const oldP=s.reportsTo&&S.seats.get(s.reportsTo);ns.reportsTo=newParent;ns.unit=ns.unit||p.unit;ns.order=seatChildren(newParent).length+1;

    const m=Object.assign({},S.meta);m.pendingStructural=true;m.structuralNotes=(m.structuralNotes||[]).concat([`reporting line changed for ${ns.code}`]).slice(-12);await saveMeta(m);toast(`${s.title} now reports to ${p.title}`);});
}

async function saveStructureModal(){
  readStructure();const st=ST,orig=ST._orig;
  if(!st.group.name){toast("Name the service group.");return;}
  if(st.departments.some(d=>!d.name)){toast("Every department needs a name.");return;}
  if(new Set(st.departments.map(d=>d.name.toLowerCase())).size!==st.departments.length){toast("Two departments have the same name.");return;}
  st.subunits=st.subunits.filter(u=>u.name);

ROWDEFS.targets={title:"Monthly targets by channel and team",help:"One row per month × channel × team (leave Team blank for the channel's overall target). Value is the ₱ target; Units is optional. Targets show on the Sales dashboard against actuals.",coll:"targets",cols:[{k:"month",l:"Month (YYYY-MM)",t:"text",w:"110px",alias:["period"]},{k:"channel",l:"Channel",t:"select",opts:SALES_CHANNELS,w:"150px"},{k:"teamName",l:"Team (blank = whole channel)",t:"text",w:"1.2fr",alias:["sales team","group"],list:"teamList"},{k:"value",l:"Target ₱",t:"number",w:"130px",alias:["target","amount","quota"]},{k:"units",l:"Target units",t:"number",w:"100px",alias:["count","no of units"]},{k:"note",l:"Note",t:"text",w:"1fr"}]};
function salesAll(){return [...S.sales.values()].filter(x=>x.date);}
function salesTeams(){const t=new Set();for(const x of S.sales.values())if(x.teamName)t.add(x.teamName.trim());for(const x of S.targets.values())if(x.teamName)t.add(x.teamName.trim());for(const u of (S.struct.subunits||[]))if(u.deptId&&/sales/i.test(u.deptId))t.add(u.name);return [...t].filter(Boolean).sort();}
function periodRange(kind,anchor){const d=anchor||todayStr();const y=+d.slice(0,4),m=+d.slice(5,7);
  if(kind==="day")return {from:d,to:d,label:fmtD(d)+" "+y};
  if(kind==="month"){const last=new Date(Date.UTC(y,m,0)).getUTCDate();return {from:`${d.slice(0,7)}-01`,to:`${d.slice(0,7)}-${String(last).padStart(2,"0")}`,label:["January","February","March","April","May","June","July","August","September","October","November","December"][m-1]+" "+y};}
  if(kind==="quarter"){const q=Math.floor((m-1)/3);const m0=q*3+1,m1=q*3+3;const last=new Date(Date.UTC(y,m1,0)).getUTCDate();return {from:`${y}-${String(m0).padStart(2,"0")}-01`,to:`${y}-${String(m1).padStart(2,"0")}-${String(last).padStart(2,"0")}`,label:`Q${q+1} ${y}`};}
  return {from:`${y}-01-01`,to:`${y}-12-31`,label:String(y)};}
function salesIn(from,to){return salesAll().filter(x=>x.status!=="Cancelled"&&x.date>=from&&x.date<=to);}
function sumVal(rows){return rows.reduce((a,x)=>a+(Number(x.value)||0),0);}
function targetFor(month,channel,team){let t=0,u=0;for(const x of S.targets.values()){if(x.month!==month||x.channel!==channel)continue;if(team===undefined?true:(x.teamName||"").trim().toLowerCase()===(team||"").trim().toLowerCase()){t+=Number(x.value)||0;u+=Number(x.units)||0;}}return {value:t,units:u};}
function monthsIn(from,to){const out=[];let y=+from.slice(0,4),m=+from.slice(5,7);const ey=+to.slice(0,4),em=+to.slice(5,7);while(y<ey||(y===ey&&m<=em)){out.push(`${y}-${String(m).padStart(2,"0")}`);m++;if(m>12){m=1;y++;}}return out;}
function targetIn(from,to,channel,team){let v=0,u=0;for(const mo of monthsIn(from,to)){const t=targetFor(mo,channel,team);v+=t.value;u+=t.units;}return {value:v,units:u};}

async function saveModal(){
  readForm();const t=M.t,o=M.orig;
  if(!t.title){M.err="Title is required.";drawModal();return;}
  if(t.tier==="Routine"&&!t.recurrence){M.err="Routine tasks need a recurrence.";drawModal();return;}
  if(!M.isNew&&o&&!authOver(o))t.due=o.due; // members cannot move a target directly
  if(M.isNew)t.dueOriginal=t.due||"";
  if(!M.isNew&&o&&authOver(o)&&(o.due||"")!==(t.due||"")&&t.due){t.dueOriginal=t.dueOriginal||o.due||"";t.dueRevisions=revs(t).filter(r=>r.status!=="pending");t.dueRevisions.push({id:uid("rv"),ts:nowISO(),by:role().label,from:o.due||"",to:t.due,reason:"Set by the Director",status:"approved",decidedBy:role().label,decidedAt:nowISO()});}
  if(t.start&&t.due&&t.due<t.start){M.err="Due date is before start date.";drawModal();return;}
  const from=o?o.status:"NS";
  if(t.status!==from||M.isNew){
    const chk=checkStatusChange(t,t.status,{reason:t.blockReason,waitingOn:t.waitingOn});
    if(!chk.ok){M.err=chk.msg;drawModal();return;}
    if(t.status==="DN"&&!t.completed)t.completed=todayStr();
    if(t.status!=="DN"&&from==="DN")t.completed="";
    if(!M.isNew)logEntry(t,"status",`Status ${SNAME[from]} → ${SNAME[t.status]}${t.status==="BL"?" — "+t.blockReason:t.status==="WO"?" — waiting on "+t.waitingOn:""}`,{from,to:t.status});
  }
  t.subtasks=t.subtasks.filter(s=>s.title.trim());t.attachments=t.attachments.filter(a=>a.url||a.label);
  if(M.isNew){logEntry(t,"create","Task created");const r=role();const toSomeoneElse=!!(t.ownerSeat||t.owner)&&!isMine(t);if(toSomeoneElse){t.assignedBy=r.label;t.assignedBySeat=r.seatId||"";t.assignedAt=nowISO();if(authOver(t)){t.assignStatus="accepted";logEntry(t,"assign",`Assigned by ${isDirector()?"the Director":r.label+" (line manager)"} to ${t.owner||"seat"} — accepted automatically`);}else{t.assignStatus="pending";logEntry(t,"assign",`Assigned by ${r.label} to ${t.owner||"seat"} — awaiting acceptance`);}}}
  else if(o&&((o.ownerSeat||"")!==(t.ownerSeat||"")||(o.owner||"").trim().toLowerCase()!==(t.owner||"").trim().toLowerCase())&&!isMine(t)){const r=role();t.assignedBy=r.label;t.assignedBySeat=r.seatId||"";t.assignedAt=nowISO();t.assignStatus=authOver(t)?"accepted":"pending";t.declineNote="";logEntry(t,"assign",authOver(t)?`Reassigned by ${isDirector()?"the Director":r.label} to ${t.owner||"seat"}`:`Reassigned by ${r.label} to ${t.owner||"seat"} — awaiting acceptance`);}
  else{
    for(const [k,l] of [["due","Due date"],["start","Start date"],["completed","Completed date"]])if((o[k]||"")!==(t[k]||""))logEntry(t,"date",`${l} ${fmtD(o[k])} → ${fmtD(t[k])}`);
    for(const [k,l] of [["owner","Owner"],["priority","Priority"],["unit","Unit"],["tier","Tier"],["category","Category"]])if((o[k]||"")!==(t[k]||""))logEntry(t,"field",`${l} "${o[k]||"—"}" → "${t[k]||"—"}"`);
    const osd=(o.subtasks||[]).filter(s=>s.done).length,nsd=t.subtasks.filter(s=>s.done).length;if(osd!==nsd)logEntry(t,"sub",`Sub-tasks done ${osd} → ${nsd}`);
  }
  const wasRoutineDone=t.status==="DN"&&from!=="DN"&&t.tier==="Routine"&&t.recurrence&&t.due;
  closeModal();
  await saveTask(t);if(t.status==="DN"&&from!=="DN")await issueTaskDone(t);
  if(wasRoutineDone){
    const nx=JSON.parse(JSON.stringify(t));nx.id=uid("t");nx.status="NS";nx.completed="";nx.blockReason="";nx.waitingOn="";nx.comments=[];nx.log=[];nx.due=nextDue(t.due,t.recurrence);nx.start=t.start?nextDue(t.start,t.recurrence):"";nx.subtasks=t.subtasks.map(s=>Object.assign({},s,{done:false,id:uid("s")}));nx.created=nowISO();nx.createdBy=role().label;
    logEntry(nx,"create",`Auto-generated next ${t.recurrence.toLowerCase()} instance`);await saveTask(nx);toast(`Saved. Next ${t.recurrence.toLowerCase()} instance due ${fmtD(nx.due)}.`);
  }else toast(M&&M.isNew?"Task created":"Saved");
}

function openPassword(forced){
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg narrow" role="dialog"><div class="dh"><h2>${forced?"Set your own password":"Change password"}</h2>${forced?"":`<button class="x" data-close aria-label="Close">×</button>`}</div><div class="db">${forced?`<div class="note">You signed in with a temporary password. Choose your own before continuing.</div>`:""}
    ${forced?"":`<div class="field"><label>Current password</label><input type="password" id="pw_old" autocomplete="current-password"></div>`}<div class="field" style="margin-top:8px"><label>New password (8+ characters)</label><input type="password" id="pw_new" autocomplete="new-password"></div><div class="field" style="margin-top:8px"><label>Repeat new password</label><input type="password" id="pw_new2" autocomplete="new-password"></div><div class="err" id="pw_err" hidden style="margin-top:10px"></div>
  </div><div class="df"><span class="spacer"></span>${forced?"":`<button class="btn" data-close type="button">Cancel</button>`}<button class="btn primary" id="pw_save" type="button">Save password</button></div></div></div>`;
  $("#pw_save").onclick=async()=>{const e=$("#pw_err");const show=m=>{e.hidden=false;e.textContent=m;};const a=S.accounts.get(S.user.username);if(!a)return show("Account not found.");
    if(!forced){const h=await pwHash($("#pw_old").value,a.salt);if(h!==a.hash)return show("Current password is wrong.");}
    const pw=$("#pw_new").value;if(pw.length<8)return show("Use at least 8 characters.");if(pw!==$("#pw_new2").value)return show("The passwords do not match.");
    const salt=randStr(16);const n=Object.assign({},a,{salt,hash:await pwHash(pw,salt),mustChange:false,tempPw:"",pwChanged:nowISO()});sessionSave({username:a.username,token:n.hash.slice(0,16)});closeModal();await saveAccount(n);toast("Password changed");};
  setTimeout(()=>{const f=$(forced?"#pw_new":"#pw_old");f&&f.focus();},30);
}
/* admin: accounts panel + provisioning */
function vAccounts(){
  if(!isDirector())return "";
  const seats=seatsAll().filter(x=>seatPerson(x)).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||seatLayer(a)-seatLayer(b));
  const hasAcc=x=>accountForSeat(x.id)||[...S.accounts.values()].find(a=>a.name.trim().toLowerCase()===seatPerson(x).trim().toLowerCase());
  const missing=seats.filter(x=>!hasAcc(x));
  const rows=seats.filter(x=>accountForSeat(x.id)||!isCover(x)||!hasAcc(x)).map(x=>{const a=accountForSeat(x.id)||(isCover(x)?null:null);const cov=seatPerson(x)?coversForName(seatPerson(x)).filter(c=>c.id!==x.id):[];return `<tr ${a?`data-userlog="${esc(a.username)}" title="Click for sign-ins and activity log"`:""}><td class="t" style="cursor:${a?"pointer":"default"}"><b>${esc(seatPerson(x))}</b><div class="small muted">${esc(x.title)} · ${esc(USHORT[x.unit])}${cov.length?` · also ${cov.map(c=>(c.status==="OIC"?"OIC":"Acting")+" — "+esc(c.title)).join("; ")}`:""}${isCover(x)?` · <span style="color:var(--warn)">${x.status==="OIC"?"OIC":"Acting"} seat — the person signs in with their own account</span>`:""}</div></td><td>${a?`<code>${esc(a.username)}</code>${a.disabled?" "+pill("st-CX","disabled"):a.mustChange?" "+pill("st-WO","temp password"):" "+pill("st-DN","active")}`:`<span class="muted small">no account</span>`}</td><td>${a?(a.tempPw?`<code>${esc(a.tempPw)}</code>`:`<span class="small muted">${a.mustChange?"issued earlier — reset to see it":"set by the user — reset to issue one"}</span>`):"—"}</td><td>${a?`<select data-acclevel="${esc(a.username)}">${ACC_LEVELS.map(([v,l])=>`<option value="${v}" ${a.level===v?"selected":""}>${l.split(" — ")[0]}</option>`).join("")}</select>`:`<span class="small muted">${ACC_LEVELS.find(l=>l[0]===levelFor(x))[1].split(" — ")[0]}</span>`}</td><td class="small muted num">${a&&a.lastLogin?stamp(a.lastLogin):"—"}</td><td style="white-space:nowrap"><div class="row" style="gap:4px;flex-wrap:nowrap">${a?`<button class="btn sm primary" data-acc="copycred:${esc(a.username)}" title="Copy this person's sign-in details (link, username, password) to paste into Viber or e-mail">Copy user &amp; password</button><button class="btn sm" data-acc="copylink" title="Copy the sign-in page link">Copy link</button><button class="btn sm ghost" data-acc="viewas:${esc(a.username)}" title="See the app exactly as this person sees it (read-only)">View as</button><button class="btn sm ghost" data-acc="reset:${esc(a.username)}">Reset password</button><button class="btn sm ghost" data-acc="${a.disabled?"enable":"disable"}:${esc(a.username)}">${a.disabled?"Enable":"Disable"}</button><button class="btn sm ghost danger" data-acc="delete:${esc(a.username)}">Delete</button>`:`<button class="btn sm primary" data-acc="create:${x.id}">Create account</button>`}</div></td></tr>`;}).join("");
  const orphans=[...S.accounts.values()].filter(a=>!a.seatId||!S.seats.get(a.seatId)||S.seats.get(a.seatId).abolished);
  return `<div class="panel" style="margin-bottom:12px"><div class="ph"><h2>Accounts</h2><span class="small muted">one per person on the org chart · ${S.accounts.size} account${S.accounts.size===1?"":"s"}</span><span class="spacer"></span>${missing.length?`<button class="btn primary sm" data-acc="createall">Create ${missing.length} missing account${missing.length>1?"s":""}</button>`:""}<span class="seg" title="Director-issued: passwords are set here and stay readable in this register. Users set their own: each person must change it at first sign-in and only a reset shows a new one."><span class="btn sm ${pwPolicy()==="director"?"primary":""}" data-acc="policy:director" role="button">Passwords issued by Director</span><span class="btn sm ${pwPolicy()==="user"?"primary":""}" data-acc="policy:user" role="button">Users set their own</span></span><button class="btn sm" data-acc="register">Copy endorsement list</button><button class="btn sm" data-acc="registercsv">Download register (CSV)</button></div><div class="pb">
    <p class="small muted" style="margin:0 0 10px">You create the accounts here — nobody signs up on their own. Send each person the site link with their username and temporary password (the endorsement list has one ready-to-paste block per person); the temporary password stays listed below until they replace it at first sign-in, after which only a reset can issue a new one. Accounts are created from the people named on the org chart. Each gets a username and a temporary password that you hand to them; they set their own password at first sign-in. Level decides what they can change: Director everything, Department head their department's tasks and projects, Member their own tasks (and comments and issues) with everything else read-only. Put a name in a seat first, then create the account.</p>
    <div class="tblwrap"><table class="reg" style="min-width:1080px"><thead><tr><th>Person · seat</th><th>Username</th><th>Password</th><th>Level</th><th>Last sign-in</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="empty">No filled seats yet — put names into the org chart first.</td></tr>`}
    ${orphans.map(a=>`<tr data-userlog="${esc(a.username)}" title="Click for sign-ins and activity log"><td class="t"><b>${esc(a.name)}</b><div class="small muted">${a.level==="director"?"administrator":a.previousSeat?"formerly "+esc(a.previousSeat)+(a.disabledNote?" · "+esc(a.disabledNote):""):"not linked to a seat"}</div></td><td><code>${esc(a.username)}</code>${a.disabled?" "+pill("st-CX","disabled"):""}</td><td>${a.tempPw?`<code>${esc(a.tempPw)}</code>`:`<span class="small muted">${a.mustChange?"issued earlier":"set by the user"}</span>`}</td><td><select data-acclevel="${esc(a.username)}">${ACC_LEVELS.map(([v,l])=>`<option value="${v}" ${a.level===v?"selected":""}>${l.split(" — ")[0]}</option>`).join("")}</select></td><td class="small muted num">${a.lastLogin?stamp(a.lastLogin):"—"}</td><td style="white-space:nowrap"><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn sm primary" data-acc="copycred:${esc(a.username)}" title="Copy this person's sign-in details (link, username, password) to paste into Viber or e-mail">Copy user &amp; password</button><button class="btn sm" data-acc="copylink" title="Copy the sign-in page link">Copy link</button><button class="btn sm ghost" data-acc="viewas:${esc(a.username)}" title="See the app exactly as this person sees it (read-only)">View as</button><button class="btn sm ghost" data-acc="reset:${esc(a.username)}">Reset password</button>${a.username===S.user.username?"":`<button class="btn sm ghost" data-acc="${a.disabled?"enable":"disable"}:${esc(a.username)}">${a.disabled?"Enable":"Disable"}</button><button class="btn sm ghost danger" data-acc="delete:${esc(a.username)}">Delete</button>`}</div></td></tr>`).join("")}</tbody></table></div>
    <div class="note" style="margin-top:10px">These are app-level accounts: passwords are stored only as salted hashes, but anyone holding the database URL and workspace key can still reach the data directly. Keep those two private; move to Firebase Authentication when you need real per-user security.</div>
  </div></div>`;
}
let CRED=null;
async function provision(seatIds){
  const made=[];
  for(const id of seatIds){const x=S.seats.get(id);if(!x||accountForSeat(id))continue;
    const same=[...S.accounts.values()].find(acc=>acc.name.trim().toLowerCase()===seatPerson(x).trim().toLowerCase());
    if(same){if(!same.seatId)await saveAccount(Object.assign({},same,{seatId:x.id,unit:x.unit}));continue;}
    const username=suggestUsername(seatPerson(x));const pw=tempPassword();const salt=randStr(16);
    const a={username,name:seatPerson(x),level:levelFor(x),seatId:x.id,unit:x.unit,salt,hash:await pwHash(pw,salt),mustChange:pwPolicy()==="user",tempPw:pw,disabled:false,created:nowISO(),createdBy:role().label};S.accounts.set(username,a);if(S.db){try{await S.db.doc("accounts/"+username).set(a);}catch(e){}}made.push({name:a.name,seat:x.title,username,pw,level:a.level});}
  if(made.length){CRED=made;showCredentials();}render();
}
function showCredentials(){
  const rows=CRED;
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog"><div class="dh"><h2>Temporary passwords</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db"><div class="note">Shown once. Give each person their line privately; they will be asked to choose their own password at first sign-in.</div>
    <div class="tblwrap"><table class="reg" style="min-width:0"><thead><tr><th>Person</th><th>Seat</th><th>Username</th><th>Temporary password</th><th>Level</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.seat)}</td><td><code>${esc(r.username)}</code></td><td><code style="font-size:14px">${esc(r.pw)}</code></td><td>${esc(r.level)}</td></tr>`).join("")}</tbody></table></div>
  </div><div class="df"><button class="btn sm" data-acc="copycred" type="button">Copy as text</button><button class="btn sm" data-acc="dlcred" type="button">Download CSV</button><span class="spacer"></span><button class="btn primary" data-close type="button">Done</button></div></div></div>`;
}
async function accountAction(a){
  const [op,arg]=a.split(":");
  if(op==="create"){await provision([arg]);return;}
  if(op==="copylink"){const site=location.href.split("#")[0].split("?")[0];try{await navigator.clipboard.writeText(site);toast("Sign-in link copied");}catch(e){prompt("Copy the sign-in link:",site);}return;}
  if(op==="copycred"){const acc=S.accounts.get(arg);if(!acc)return;const site=location.href.split("#")[0].split("?")[0];const st=acc.seatId&&S.seats.get(acc.seatId);const txt=`${acc.name}${st?" — "+st.title:""}\nEDGG Monitoring: ${site}\nUsername: ${acc.username}\nPassword: ${acc.tempPw||"(set by the user — use Reset password to issue a new one)"}\n${pwPolicy()==="user"&&acc.mustChange?"Sign in, then set your own password when asked.":"Sign in with this password."} Every change you make is recorded under your name.`;try{await navigator.clipboard.writeText(txt);toast(`Sign-in details for ${acc.name} copied — paste into Viber or e-mail`);}catch(e){prompt("Copy the sign-in details:",txt);}return;}
  if(op==="viewas"){enterViewAs(arg);return;}
  if(op==="policy"){await setPwPolicy(arg);toast(arg==="director"?"Passwords are now issued by the Director and stay visible here":"People will set their own password at first sign-in");return;}
  if(op==="register"||op==="registercsv"){const accs=[...S.accounts.values()].filter(a=>!a.disabled).sort((a,b)=>a.name.localeCompare(b.name));const site=location.href.split("#")[0].split("?")[0];
    if(op==="registercsv"){const rows=[["Name","Seat","Department","Username","Temporary password","Level","Status"]].concat(accs.map(a=>[a.name,(S.seats.get(a.seatId)||{}).title||"",USHORT[a.unit]||a.unit||"",a.username,a.tempPw||"",a.level,a.tempPw?"temporary — must change at first sign-in":a.mustChange?"temporary issued earlier":"password set by user"]));deliver(`EDGG-account-register-${todayStr()}.csv`,rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"Account register");return;}
    const txt=accs.map(a=>`${a.name} — ${(S.seats.get(a.seatId)||{}).title||a.level}\nEDGG Monitoring: ${site}\nUsername: ${a.username}\nTemporary password: ${a.tempPw||"(already changed by the user — use Reset password to issue a new one)"}\n${pwPolicy()==="user"?"Sign in, then set your own password when asked.":"Sign in with this password (the Director keeps the register)."} Every change you make is recorded under your name.`).join("\n\n");
    try{await navigator.clipboard.writeText(txt);toast(`Endorsement list for ${accs.length} account${accs.length===1?"":"s"} copied — paste one block per person into Viber/e-mail`);}catch(e){deliver(`EDGG-endorsement-${todayStr()}.txt`,txt,"Endorsement list");}return;}
  if(op==="createall"){await provision(seatsAll().filter(x=>seatPerson(x)&&!accountForSeat(x.id)).map(x=>x.id));return;}
  if(op==="copycred"){copyText(CRED.map(r=>`${r.name} (${r.seat}) — username: ${r.username} — temporary password: ${r.pw}`).join("\n"),"Copied");return;}
  if(op==="dlcred"){deliver(`EDGG-accounts-${todayStr()}.csv`,"Name,Seat,Username,Temporary password,Level\r\n"+CRED.map(r=>[r.name,r.seat,r.username,r.pw,r.level].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"Credentials");return;}
  const acc=S.accounts.get(arg);if(!acc)return;
  if(op==="reset"){const pw=tempPassword();const salt=randStr(16);const n=Object.assign({},acc,{salt,hash:await pwHash(pw,salt),mustChange:pwPolicy()==="user",tempPw:pw,disabled:false});await saveAccount(n);CRED=[{name:n.name,seat:(S.seats.get(n.seatId)||{}).title||"—",username:n.username,pw,level:n.level}];showCredentials();return;}
  if(op==="disable"){if(arg===S.user.username){toast("You cannot disable your own account.");return;}await saveAccount(Object.assign({},acc,{disabled:true}));toast("Disabled");return;}
  if(op==="enable"){await saveAccount(Object.assign({},acc,{disabled:false}));toast("Enabled");return;}
  if(op==="delete"){if(arg===S.user.username){toast("You cannot delete your own account.");return;}askConfirm("Delete this account?",`${acc.name} (${acc.username}) will no longer be able to sign in. Their tasks and log entries stay.`,async ok=>{if(!ok)return;await deleteAccount(arg);toast("Account deleted");});return;}
}

(function boot(){
  try{const th=localStorage.getItem("edgg.theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
  if(ACCOUNTS){S.accounts=new Map();S.accountsLoaded=false;render();}
  else{let r=null;try{r=localStorage.getItem("edgg.role");}catch(e){}
  if(r&&ROLES.some(x=>x.id===r)){setRole(r);}else render();}
  initDb();
})();
</script>
