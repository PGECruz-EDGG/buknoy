<style>
.bk-fab{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:0;border-radius:999px;background:var(--espresso);color:#F3EAE0;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}.bk-fab img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#111}.bk-fab:hover{filter:brightness(1.1)}
.bk-panel{position:fixed;right:18px;bottom:72px;z-index:61;width:min(440px,calc(100vw - 36px));height:min(620px,calc(100vh - 100px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.bk-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}.bk-head img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#111}.bk-head .x{background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--muted)}
.bk-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.bk-msg{display:flex;gap:8px;align-items:flex-start}.bk-msg.user{justify-content:flex-end}.bk-msg img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:#111}.bk-bubble{max-width:85%;padding:8px 11px;border-radius:12px;background:var(--surface2);font-size:13px;line-height:1.45}.bk-msg.user .bk-bubble{background:var(--terracotta);color:#fff}.bk-li{padding-left:8px}
.bk-quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}.bk-quick .btn{font-size:11.5px}
.bk-input{display:flex;gap:6px;padding:8px 12px 12px}.bk-input input{flex:1}
@media print{#buknoy{display:none}}
</style>

<style>
:root{
  --espresso:#3B2A20; --terracotta:#B5563A; --sand:#E9DFCD; --clay:#A8836A; --sage:#7E8F6E;
  --bg:#F3EDE2; --surface:#FBF8F2; --surface2:#EFE6D6; --line:#D9CBB4; --line2:#C9B79B;
  --text:#2E211A; --muted:#7A6656; --faint:#A79483;
  --accent:#B5563A; --accent-ink:#FFFFFF;
  --good:#6E8560; --warn:#C08A2E; --bad:#A93A2C; --info:#5E7A8C;
  --good-bg:#E4EADB; --warn-bg:#F3E6C8; --bad-bg:#F1D6CF; --info-bg:#DCE6EC;
  --shadow:0 6px 24px rgba(59,42,32,.14);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sand:#3A2E24; --bg:#1E1712; --surface:#2A2119; --surface2:#332A20; --line:#463A2E; --line2:#5A4B3C;
    --text:#F0E7DA; --muted:#BDAA95; --faint:#8C7A68;
    --accent:#D2734F; --accent-ink:#1E1712;
    --good:#9DB58C; --warn:#DDB25A; --bad:#E07A66; --info:#8FB0C4;
    --good-bg:#2E3A28; --warn-bg:#443620; --bad-bg:#4A2820; --info-bg:#25353F;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sand:#3A2E24; --bg:#1E1712; --surface:#2A2119; --surface2:#332A20; --line:#463A2E; --line2:#5A4B3C;
  --text:#F0E7DA; --muted:#BDAA95; --faint:#8C7A68;
  --accent:#D2734F; --accent-ink:#1E1712;
  --good:#9DB58C; --warn:#DDB25A; --bad:#E07A66; --info:#8FB0C4;
  --good-bg:#2E3A28; --warn-bg:#443620; --bad-bg:#4A2820; --info-bg:#25353F;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
.wrap{padding-inline:16px;max-width:1440px;margin:0 auto}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* app shell: left menu */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:linear-gradient(180deg,var(--espresso) 0%,#2A1D15 100%);color:#F3EAE0;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:16px 12px;gap:8px}
.sbrand{display:flex;align-items:center;gap:10px;padding:0 6px 8px;border-bottom:1px solid rgba(255,255,255,.1)}
.sbrand h1{font-size:17px;color:#fff;line-height:1.1}
.sbrand small{font-size:11px;color:#C9B79B;display:block;letter-spacing:.04em}
.slogo{width:40px;height:40px;border-radius:10px;background:#111;overflow:hidden;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.45)}.slogo img{width:100%;height:100%;object-fit:cover;display:block}
.burger{display:none;margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 9px;font-size:16px;cursor:pointer}
.snav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow:auto;padding-top:4px;scrollbar-width:thin}
.snav .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#A79483;padding:6px 10px 2px;font-weight:700}
.snav button{appearance:none;border:0;background:transparent;color:#E4D8C8;text-align:left;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;transition:background .15s,transform .15s}
.snav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.snav button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}

.sfoot{border-top:1px solid rgba(255,255,255,.1);padding-top:6px;display:flex;flex-direction:column;gap:4px}
.sfoot .lbl{color:#A79483}
.sfoot select{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.uchip{display:flex;gap:10px;align-items:center;color:#F3EAE0}.uchip .av{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}.uchip .small{color:#C9B79B;font-size:11px}
.sfoot select option{color:var(--text);background:var(--surface)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#C9B79B}

.sync.local i{background:var(--warn)}
.mainwrap{min-width:0}
.topbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 16px 0;max-width:1440px;margin:0 auto}
.topbar h2{font-size:26px}
.topbar .tsub{font-size:13px;color:var(--muted)}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap;cursor:pointer;font-weight:600;font-size:13px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button .cnt{display:inline-block;margin-left:6px;font-size:11px;background:var(--surface2);border-radius:10px;padding:0 6px;color:var(--muted)}

@media (max-width:900px){

  .snav,.sfoot{display:none}
  .side.open .snav,.side.open .sfoot{display:flex}
  .side.open .snav{max-height:60vh}
  .topbar{padding-top:12px}.topbar h2{font-size:22px}
}
main.wrap{padding-block:14px 60px}

/* controls */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--clay)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=url],input[type=search],textarea{border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius);padding:7px 9px;min-width:0;max-width:100%}
textarea{resize:vertical;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel .ph{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .ph h2{font-size:17px}
.panel .ph .spacer{flex:1}
.panel .pb{padding:12px 14px}
.sec{margin-bottom:18px}
.sec>h2{font-size:20px;margin-bottom:10px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;border-top:3px solid var(--clay)}
.kpi .v{font-family:var(--serif);font-size:38px;line-height:1;font-weight:500;margin:6px 0 2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad{border-top-color:var(--bad)} .kpi.bad .v{color:var(--bad)}
.kpi.warn{border-top-color:var(--warn)}
.kpi.good{border-top-color:var(--good)}
.kpi.info{border-top-color:var(--info)}

/* RAG strip */
.rag{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.rag .u{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.rag .dot{width:14px;height:14px;border-radius:50%;flex:none}
.rag .dot.G{background:var(--good)} .rag .dot.A{background:var(--warn)} .rag .dot.R{background:var(--bad)}
.rag .u b{display:block;font-size:14px}
.rag .u .s{font-size:12px;color:var(--muted)}

/* task list rows */
.tl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.tr:first-child{border-top:0}
.tr:hover{background:var(--surface2)}
.tr .t{font-weight:600;min-width:0}
.tr .m{font-size:12px;color:var(--muted);min-width:0}
.tr .why{font-size:12px;color:var(--bad);font-weight:600;white-space:nowrap}
.sev{width:6px;align-self:stretch;border-radius:3px;background:var(--line2)}
.sev.Critical{background:var(--bad)} .sev.High{background:var(--warn)} .sev.Normal{background:var(--clay)} .sev.Low{background:var(--line2)}

/* pills */
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid transparent}
.pill.st-NS{background:var(--surface2)} .pill.st-IP{background:var(--info-bg);color:var(--info)}
.pill.st-WO{background:var(--warn-bg);color:var(--warn)} .pill.st-BL{background:var(--bad-bg);color:var(--bad)}
.pill.st-FR{background:var(--sand);color:var(--espresso);border-color:var(--clay)} .pill.st-DN{background:var(--good-bg);color:var(--good)} .pill.st-CX{color:var(--faint);text-decoration:line-through}
:root[data-theme="dark"] .pill.st-FR{color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.st-FR{color:var(--text)}}
.pill.pr-Critical{background:var(--bad-bg);color:var(--bad)} .pill.pr-High{background:var(--warn-bg);color:var(--warn)}
.pill.sample{background:transparent;border:1px dashed var(--clay);color:var(--clay)}
.pill.over{background:var(--bad);color:#fff}
.pill.tier{border:1px solid var(--line2);background:transparent}

/* kanban */
.kb-wrap{overflow-x:auto;padding-bottom:8px}
.kb{display:grid;grid-template-columns:120px repeat(6,minmax(190px,1fr));min-width:1280px;gap:6px}
.kb .kh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:6px 8px;position:sticky;top:0}
.kb .lane{font-family:var(--serif);font-size:15px;font-weight:600;padding:8px;border-top:1px solid var(--line);position:sticky;left:0;background:var(--bg)}
.kb .cell{border-top:1px solid var(--line);min-height:70px;padding:6px;display:flex;flex-direction:column;gap:6px;border-radius:4px}
.kb .cell.over{background:var(--surface2);outline:2px dashed var(--clay)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:4px;padding:7px 9px;cursor:grab;font-size:13px}

.card .ct{font-weight:600;line-height:1.25}
.card .cm{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card.dragging{opacity:.4}
.card select{font-size:11px;padding:2px 4px;margin-top:4px;width:100%}

/* register */
.tblwrap{overflow-x:auto}
table.reg{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
table.reg th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
table.reg th.on{color:var(--text)}
table.reg td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.reg tr:hover td{background:var(--surface2)}
table.reg td.t{font-weight:600;cursor:pointer}

/* timeline */
.gantt{overflow-x:auto}
.gantt svg{display:block;font-family:var(--sans)}
.gantt .lbl-unit{font-family:var(--serif);font-weight:600;font-size:14px}

/* routines */
.rt-group{margin-bottom:16px}
.rt-group h3{font-size:16px;margin-bottom:6px}

/* report */
.report{background:var(--surface);border:1px solid var(--line);padding:26px 30px;max-width:900px;border-radius:var(--radius)}
.report h2{font-size:26px}
.report .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--espresso);padding-bottom:10px;margin-bottom:14px;gap:12px;flex-wrap:wrap}

.report .rk span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.report h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--sans);color:var(--terracotta);margin:14px 0 6px}
.report ul{margin:0;padding-left:18px}
.report li{margin:2px 0}
.report .rf{margin-top:18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(30,20,14,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);width:min(920px,100%);max-height:92vh;display:flex;flex-direction:column}

.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}

.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--radius);padding:8px 10px;font-weight:600;margin-bottom:10px}
.note{background:var(--warn-bg);border-radius:var(--radius);padding:8px 10px;font-size:13px;margin-bottom:12px}
.deps{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:13px}

/* org chart */
.org-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.org-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative}

.seat-title{font-family:var(--serif);font-weight:600;font-size:13px}

.seat-status{font-size:9px;font-weight:700;letter-spacing:.08em}
.seat-occ{font-size:12px;font-weight:600}
.org-list{display:flex;flex-direction:column;gap:4px}
.org-li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer}
.org-li.VACANT,.org-li.OIC{border-style:dashed;background:var(--surface2)}
.org-li .lyr{font-size:10px;color:var(--muted);width:44px;text-align:center;font-weight:700}
.org-li b{font-family:var(--serif);font-weight:600}
.org-li .s{font-size:11px;color:var(--muted)}
.tblock{font-size:11px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--surface);margin-top:10px}

.checks{margin-top:10px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dotted var(--line);font-size:13px}
.chk:first-child{border-top:0}
.chk i{flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#fff}
.chk.ok i{background:var(--good)} .chk.bad i{background:var(--bad)} .chk.warn i{background:var(--warn)}
.dotrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px}
.legendbox{font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .legendbox i,:root:not([data-theme="light"]) .legendbox em{border-color:var(--text)}}
:root[data-theme="dark"] .legendbox i,:root[data-theme="dark"] .legendbox em{border-color:var(--text)}

.org-stage{position:relative;height:min(68vh,680px);min-height:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;touch-action:none;user-select:none;background-image:radial-gradient(var(--line) .8px,transparent .8px);background-size:22px 22px;cursor:grab}
.org-stage:active{cursor:grabbing}

.org-stage svg{display:block}
.seatg{transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .2s}
.seatg .box{transition:filter .15s,stroke .15s}
.seatg:hover .box{filter:drop-shadow(0 4px 10px rgba(59,42,32,.22))}
.seatg.dim{opacity:.22}
.seatg.hit .box{stroke:var(--terracotta);stroke-width:2.5}
.rank{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--clay)}.rank.r0{color:var(--espresso)}.rank.r3{color:var(--muted)}.ph.grab{cursor:grab}.ph.lift{opacity:.9;filter:drop-shadow(0 6px 10px rgba(59,42,32,.4))}.ctxm{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(59,42,32,.25);padding:4px;min-width:200px;font-size:13px}.ctxi{padding:7px 12px;border-radius:6px;cursor:pointer}.ctxi:hover{background:var(--surface2)}
.seatg.lift{opacity:.85;filter:drop-shadow(0 10px 18px rgba(59,42,32,.35));z-index:5}
.seatg.target .box{stroke:var(--terracotta);stroke-width:3;stroke-dasharray:none}

@media (hover:none){.seatg .addb{opacity:1}}
@media (prefers-reduced-motion:reduce){.seatg{transition:none}}
.ohud{position:absolute;right:10px;top:10px;display:flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);padding:4px 6px;box-shadow:var(--shadow)}
.ohint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);background:var(--surface);border-radius:4px;padding:3px 8px;opacity:.9;max-width:calc(100% - 20px)}
.ostats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;margin-bottom:10px}
.ostats>div{display:flex;align-items:baseline;gap:6px}
.ostats b{font-family:var(--serif);font-size:24px;font-weight:500;line-height:1}

.ostats .ulegend{margin-left:auto;gap:10px;font-size:11px;color:var(--muted)}

.seg{display:inline-flex;gap:2px}
.org-li .av{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.qs{border-top:3px solid var(--terracotta)}
.qsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qsteps>div{display:flex;gap:10px;align-items:flex-start}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

.ibar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex;margin-bottom:4px}.ibar i{display:block;height:100%}.ibar .s{background:var(--sage)}.ibar .r{background:var(--warn)}
.ibar.sm{display:inline-flex;width:90px;vertical-align:middle;margin:0 6px 0 0}

const DEFAULT_STRUCT={group:{name:"Enterprise Development and Growth Group",short:"EDGG",headTitle:"Director, EDGG"},
  departments:[{id:"d_do",name:"Director's Office",short:"DO",color:"#3B2A20",order:0,roleId:"",headTitle:"Director"},{id:"d_pd",name:"Project Development",short:"PD",color:"#B5563A",order:1,roleId:"pd",headTitle:"PD Head"},{id:"d_bd",name:"Business Development",short:"BD",color:"#A8836A",order:2,roleId:"bd",headTitle:"BD Head"},{id:"d_sl",name:"Sales",short:"Sales",color:"#7E8F6E",order:3,roleId:"sales",headTitle:"Sales Head"},{id:"d_mc",name:"MarCom",short:"MarCom",color:"#5E7A8C",order:4,roleId:"marcom",headTitle:"MarCom Head"}],
  subunits:[]};
const SUB_KINDS=["Territory","Section","Team","Project team","Site"];
let UNITS=[],USHORT={},UCOL={},HEAD_OF={},ROLES=[];
function applyStruct(st){
  st=st||DEFAULT_STRUCT;st.departments=(st.departments||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));st.subunits=st.subunits||[];st.group=st.group||DEFAULT_STRUCT.group;
  S.struct=st;UNITS=st.departments.map(d=>d.name);USHORT={};UCOL={};HEAD_OF={};
  for(const d of st.departments){USHORT[d.name]=d.short||d.name.slice(0,3);UCOL[d.name]=d.color||"#888";HEAD_OF[d.name]=d.headTitle||(d.short+" Head");}
  ROLES=[{id:"director",label:st.group.headTitle||"Director",unit:null}].concat(st.departments.filter(d=>d.name!=="Director's Office"&&d.id!=="d_do").map(d=>({id:d.roleId||("head:"+d.id),label:d.name+" Head",unit:d.name})));
}
function deptOf(name){return (S.struct?S.struct.departments:DEFAULT_STRUCT.departments).find(d=>d.name===name);}
function subunit(id){return id?(S.struct.subunits||[]).find(u=>u.id===id):null;}
function subPath(id){const out=[];let u=subunit(id),g=0;while(u&&g++<10){out.unshift(u);u=u.parentId?subunit(u.parentId):null;}return out;}
function subLabel(id){const p=subPath(id);return p.map(u=>u.name).join(" › ");}
function subsOf(dept,parentId){return (S.struct.subunits||[]).filter(u=>u.deptId===dept&&(u.parentId||"")===(parentId||"")).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));}
function subsFlat(dept){const out=[];const walk=(pid,d)=>{for(const u of subsOf(dept,pid)){out.push({u,d});walk(u.id,d+1);}};walk("",0);return out;}

/* ===================== date helpers ===================== */
const fmtISO=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
function todayStr(){return fmtISO.format(new Date());}
function nowISO(){return new Date().toISOString();}
function stamp(iso){try{return new Intl.DateTimeFormat("en-PH",{timeZone:TZ,dateStyle:"medium",timeStyle:"short"}).format(new Date(iso));}catch(e){return iso;}}
function dnum(d){if(!d)return NaN;const[y,m,dd]=d.split("-").map(Number);return Date.UTC(y,m-1,dd)/86400000;}
function dstr(n){return new Date(n*86400000).toISOString().slice(0,10);}

function fmtD(d){if(!d)return "—";const[y,m,dd]=d.split("-").map(Number);return `${dd} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1]}${y!==Number(todayStr().slice(0,4))?" "+y:""}`;}

function peso(n){n=Number(n);if(!isFinite(n))return "—";return "₱"+n.toLocaleString("en-PH",{maximumFractionDigits:0});}

async function requestRevision(id,to,reason){const t=S.tasks.get(id);if(!t||!to)return;const n=JSON.parse(JSON.stringify(t));n.dueOriginal=n.dueOriginal||n.due||"";n.dueRevisions=revs(n).filter(r=>r.status!=="pending");

function inboxItems(){const r=role();if(!r)return [];const seen=(S.user&&S.accounts.get(S.user.username)||{}).inboxSeen||"";const out=[];
  for(const t of active()){if(!isMine(t))continue;
    if(t.assignStatus==="pending")out.push({ts:t.assignedAt||t.created||"",kind:"assign",title:t.title,id:t.id,text:`Assigned to you by ${t.assignedBy||t.createdBy||"—"} — accept or decline`,hot:true});
    for(const f of (t.followUps||[]))out.push({ts:f.ts,kind:"followup",title:t.title,id:t.id,text:`Follow-up #${(t.followUps||[]).indexOf(f)+1} from ${f.by}${f.note?" — "+f.note:""}`,hot:(t.followUps||[]).length>=3});

    if(t.assignedBy&&t.assignedBy===r.label&&t.assignStatus==="accepted"&&t.acceptedAt)out.push({ts:t.acceptedAt,kind:"accepted",title:t.title,id:t.id,text:`${t.owner||"—"} accepted`});}

function openSubtasks(t){return (t.subtasks||[]).filter(s=>!s.done);}

function checkStatusChange(t,to,extra){
  extra=extra||{};
  if(to==="DN"){
    const os=openSubtasks(t),od=openDeps(t);
    if(os.length)return {ok:false,msg:`Cannot mark Done: ${os.length} open sub-task${os.length>1?"s":""} (${os.slice(0,2).map(s=>s.title).join("; ")}${os.length>2?"…":""}). Close them first.`};
    if(od.length)return {ok:false,msg:`Cannot mark Done: blocked by open dependenc${od.length>1?"ies":"y"} (${od.map(d=>d.title).join("; ")}).`};
  }
  if(to==="BL"&&!(extra.reason||"").trim())return {ok:false,msg:"Blocked needs a reason.",need:"reason"};
  if(to==="WO"&&!(extra.waitingOn||"").trim())return {ok:false,msg:"Waiting on Others needs the name of who you are waiting on.",need:"waitingOn"};

}
async function applyStatus(t,to,extra){

    if(chk.need){askText(to==="BL"?"Why is this blocked?":"Waiting on whom?",chk.need==="reason"?"Reason":"Person / office",v=>{if(v)applyStatus(t,to,{[chk.need]:v});});return;}

  if(to==="WO")nt.waitingOn=extra.waitingOn;

  logEntry(nt,"status",`Status ${SNAME[from]} → ${SNAME[to]}${to==="BL"?" — "+extra.reason:to==="WO"?" — waiting on "+extra.waitingOn:""}`,{from,to});

function allTasks(){return [...S.tasks.values()];}
function active(){return allTasks().filter(t=>t.status!=="CX");}
function unitRag(unit){
  const ts=active().filter(t=>t.unit===unit&&OPEN(t.status));
  const od=ts.filter(t=>overdueDays(t)>0),bl=ts.filter(t=>t.status==="BL");
  const hot=od.filter(t=>t.priority==="Critical"||t.priority==="High").length;
  let c="G";if(od.length||bl.length)c="A";if(hot>=1||bl.length>=2||od.length>=3)c="R";
  return {c,od:od.length,bl:bl.length,open:ts.length,hot};
}
function attention(){
  const out=[];
  for(const t of active()){
    if(!OPEN(t.status))continue;
    const od=overdueDays(t);
    if(od>0&&(t.priority==="Critical"||t.priority==="High"))out.push({t,w:3,why:`Overdue ${od}d · ${t.priority}`});
    else if(t.status==="BL"&&blockedDays(t)>3)out.push({t,w:2,why:`Blocked ${blockedDays(t)}d`});
    else if(t.status==="FR")out.push({t,w:1,why:"For Review — awaiting Director"});
    else if(od>0)out.push({t,w:0.5,why:`Overdue ${od}d`});
  }
  return out.sort((a,b)=>b.w-a.w||overdueDays(b.t)-overdueDays(a.t)).slice(0,10);
}
function kpis(scope){
  const ts=scope.filter(t=>t.status!=="CX");const today=todayStr();const {mon,sun}=weekOf(today);
  const open=ts.filter(t=>OPEN(t.status));
  return {
    open:open.length,
    overdue:open.filter(t=>overdueDays(t)>0).length,
    week:open.filter(t=>t.due&&t.due>=mon&&t.due<=sun).length,
    blocked:open.filter(t=>t.status==="BL").length,
    done30:ts.filter(t=>t.status==="DN"&&t.completed&&daysBetween(t.completed,today)<=30).length,
    review:open.filter(t=>t.status==="FR").length
  };
}

  </div>
  <div class="legend">RAG rule: red = any overdue Critical/High, or ≥2 blocked, or ≥3 overdue; amber = any overdue or blocked; green otherwise.

function wireKanban(){
  let dragId=null;
  document.querySelectorAll(".card[draggable=true]").forEach(c=>{
    c.addEventListener("dragstart",e=>{dragId=c.dataset.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId);}catch(x){}});
    c.addEventListener("dragend",()=>{c.classList.remove("dragging");document.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));});
  });
  document.querySelectorAll(".cell").forEach(cell=>{
    cell.addEventListener("dragover",e=>{if(!dragId)return;const t=S.tasks.get(dragId);if(t&&t.unit===cell.dataset.unit){e.preventDefault();cell.classList.add("over");}});
    cell.addEventListener("dragleave",()=>cell.classList.remove("over"));
    cell.addEventListener("drop",e=>{e.preventDefault();cell.classList.remove("over");const t=S.tasks.get(dragId);dragId=null;if(!t||t.unit!==cell.dataset.unit)return;applyStatus(t,cell.dataset.drop);});
  });
}

/* ---- Register ---- */
function filtered(){
  const f=S.filters;let ts=allTasks();
  if(!f.showCX)ts=ts.filter(t=>t.status!=="CX");
  if(f.q){const q=f.q.toLowerCase();ts=ts.filter(t=>(t.title+" "+(t.description||"")+" "+(t.link||"")+" "+(t.owner||"")).toLowerCase().includes(q));}
  if(f.unit)ts=ts.filter(t=>t.unit===f.unit);if(f.cat)ts=ts.filter(t=>t.category===f.cat);if(f.tier)ts=ts.filter(t=>t.tier===f.tier);
  if(f.owner)ts=ts.filter(t=>(t.owner||"").toLowerCase().includes(f.owner.toLowerCase()));if(f.status)ts=ts.filter(t=>t.status===f.status);if(f.prio)ts=ts.filter(t=>t.priority===f.prio);
  if(f.from)ts=ts.filter(t=>t.due&&t.due>=f.from);if(f.to)ts=ts.filter(t=>t.due&&t.due<=f.to);
  const k=S.sort.k,d=S.sort.d;
  const key=t=>k==="priority"?PRIOS.indexOf(t.priority):k==="status"?STATUSES.findIndex(s=>s[0]===t.status):k==="overdue"?-overdueDays(t):(t[k]||"");
  ts.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*d;});
  return ts;
}
function vRegister(){
  const f=S.filters;const ts=filtered();
  const sel=(id,opts,val,ph)=>`<select data-f="${id}"><option value="">${ph}</option>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${val===v?"selected":""}>${esc(l)}</option>`;}).join("")}</select>`;
  const th=(k,l)=>`<th data-sort="${k}" class="${S.sort.k===k?"on":""}">${l}${S.sort.k===k?(S.sort.d>0?" ↑":" ↓"):""}</th>`;
  return `<div class="row no-print" style="margin-bottom:10px">
    <input type="search" data-f="q" value="${esc(f.q)}" placeholder="Search title, description, project tag" style="flex:1;min-width:180px">
    ${sel("unit",UNITS,f.unit,"All units")}${sel("cat",CATS,f.cat,"All categories")}${sel("tier",TIERS,f.tier,"All tiers")}
    <input type="text" data-f="owner" value="${esc(f.owner)}" placeholder="Owner" style="width:120px">
    ${sel("status",STATUSES,f.status,"All statuses")}${sel("prio",PRIOS,f.prio,"All priorities")}
    <label class="small muted">Due from <input type="date" data-f="from" value="${f.from}"></label><label class="small muted">to <input type="date" data-f="to" value="${f.to}"></label>
    <label class="small muted"><input type="checkbox" data-f="showCX" ${f.showCX?"checked":""}> show cancelled</label><span class="small muted" style="margin-left:8px" title="Follow-up marker">${bkMark(0,16)} none · ${bkMark(1,16)} 1st · ${bkMark(2,16)} 2nd · ${bkMark(3,16)} 3rd</span>
    <button class="btn sm" id="clearF">Reset</button><button class="btn sm" id="csv">Export CSV</button><span class="small muted num">${ts.length} tasks</span></div>
  <div class="tblwrap"><table class="reg"><thead><tr>${th("title","Task")}${th("unit","Unit")}${th("category","Category")}${th("tier","Tier")}${th("owner","Owner")}${th("priority","Priority")}${th("status","Status")}${th("start","Start")}${th("due","Due")}${th("overdue","Overdue")}${th("link","Project / account")}</tr></thead>
  <tbody>${ts.map(t=>{const od=overdueDays(t);return `<tr><td class="t" data-open="${t.id}">${esc(t.title)}${t.sample?" "+pill("sample","SAMPLE"):""} ${followPill(t)} ${assignPill(t)} ${targetPill(t)}<div class="small muted" style="font-weight:400">${(t.subtasks||[]).length?`${(t.subtasks||[]).filter(s=>s.done).length}/${t.subtasks.length} sub-tasks · `:""}${(t.deps||[]).length?`${t.deps.length} dep · `:""}${t.accountable?esc(t.accountable):""}</div></td><td>${USHORT[t.unit]||esc(t.unit)}</td><td>${esc(t.category)}</td><td>${esc(t.tier)}${t.recurrence?` <span class="muted small">(${esc(t.recurrence)})</span>`:""}</td><td>${esc(t.owner)}</td><td>${pill("pr-"+t.priority,t.priority)}</td><td>${pill("st-"+t.status,SNAME[t.status])}</td><td class="num">${fmtD(t.start)}</td><td class="num">${fmtD(t.due)}</td><td class="num" style="${od?"color:var(--bad);font-weight:700":""}">${od?od+"d":""}</td><td>${esc(t.link)}</td></tr>`;}).join("")||`<tr><td colspan="11" class="empty">No tasks match.</td></tr>`}</tbody></table></div>`;

function exportCSV(){
  const cols=["id","title","description","unit","category","tier","owner","accountable","priority","status","start","due","completed","recurrence","link","blockReason","waitingOn","deps","subtasks","attachments","sample"];
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=filtered().map(t=>cols.map(c=>c==="status"?SNAME[t.status]:c==="deps"?(t.deps||[]).map(id=>(S.tasks.get(id)||{}).title||id).join("; "):c==="subtasks"?(t.subtasks||[]).map(s=>(s.done?"[x] ":"[ ] ")+s.title).join("; "):c==="attachments"?(t.attachments||[]).map(a=>a.url).join(" "):t[c]).map(q).join(","));
  const csv=[cols.join(","),...rows].join("\r\n");
  const fn=`EDGG-register-${todayStr()}.csv`;
  deliver(fn,csv,"CSV");
}
function copyText(txt,msg){
  const done=()=>toast(msg||"Copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("Select and copy manually");}ta.remove();}

/* ---- Timeline ---- */
function vTimeline(){
  const ts=active().filter(t=>t.tier!=="Routine"&&t.due).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||(a.start||a.due).localeCompare(b.start||b.due));
  if(!ts.length)return `<div class="empty">No Deliverables or Workstreams with a due date yet.</div>`;
  const today=todayStr();
  let min=Math.min(...ts.map(t=>dnum(t.start||t.due)),dnum(today))-7,max=Math.max(...ts.map(t=>dnum(t.due)),dnum(today))+14;
  const L=210,RW=18,pxPerDay=Math.max(3,Math.min(14,1000/(max-min)));const W=L+(max-min)*pxPerDay+20;
  let y=34;const rows=[];let lastUnit=null;
  for(const t of ts){if(t.unit!==lastUnit){rows.push({unit:t.unit,y});y+=24;lastUnit=t.unit;}rows.push({t,y});y+=RW+6;}
  const H=y+10;const x=d=>L+(dnum(d)-min)*pxPerDay;
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline">`;
  // month grid
  let d=new Date(min*86400000);d.setUTCDate(1);
  for(;d.getTime()/86400000<max;d.setUTCMonth(d.getUTCMonth()+1)){const ds=d.toISOString().slice(0,10);const xx=x(ds);if(xx<L)continue;svg+=`<line x1="${xx}" y1="22" x2="${xx}" y2="${H}" stroke="var(--line)" stroke-width="1"/><text x="${xx+4}" y="14" font-size="11" fill="var(--muted)">${d.toLocaleString("en",{month:"short",timeZone:"UTC"})} ${d.getUTCFullYear()}</text>`;}
  for(const r of rows){
    if(r.unit){svg+=`<text x="4" y="${r.y+16}" class="lbl-unit" fill="var(--text)">${esc(r.unit)}</text>`;continue;}
    const t=r.t,s=t.start||t.due,x1=x(s),x2=Math.max(x(t.due),x1+4);const od=overdueDays(t)>0;const done=t.status==="DN";
    const fill=od?"var(--bad)":done?"var(--sage)":t.tier==="Workstream"?"var(--clay)":"var(--terracotta)";
    const pct=(t.subtasks||[]).length?(t.subtasks.filter(s=>s.done).length/t.subtasks.length):(done?1:0);
    svg+=`<g data-open="${t.id}" style="cursor:pointer"><title>${esc(t.title)} · ${fmtD(s)} → ${fmtD(t.due)} · ${SNAME[t.status]}</title>
      <text x="${L-8}" y="${r.y+13}" font-size="12" text-anchor="end" fill="var(--text)">${esc(t.title.length>30?t.title.slice(0,29)+"…":t.title)}</text>
      <rect x="${x1}" y="${r.y}" width="${x2-x1}" height="${RW}" rx="3" fill="${fill}" opacity="${done?".55":".85"}"/>
      ${pct>0&&!done?`<rect x="${x1}" y="${r.y}" width="${(x2-x1)*pct}" height="${RW}" rx="3" fill="var(--espresso)" opacity=".35"/>`:""}
      ${(t.subtasks||[]).filter(s=>s.due).map(s=>{const mx=x(s.due);return `<polygon points="${mx},${r.y-2} ${mx+6},${r.y+RW/2} ${mx},${r.y+RW+2} ${mx-6},${r.y+RW/2}" fill="${s.done?"var(--sage)":"var(--surface)"}" stroke="var(--espresso)" stroke-width="1.2"><title>${esc(s.title)} · ${fmtD(s.due)}</title></polygon>`;}).join("")}
      </g>`;
  }
  const tx=x(today);svg+=`<line x1="${tx}" y1="20" x2="${tx}" y2="${H}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${tx+4}" y="${H-2}" font-size="11" fill="var(--bad)" font-weight="700">Today ${fmtD(today)}</text>`;
  svg+=`</svg>`;
  return `<div class="gantt panel" style="padding:8px">${svg}</div><div class="legend">Bars: terracotta = Deliverable, clay = Workstream, sage = Done, red = overdue. Darker overlay = sub-task completion. Diamonds = dated sub-task milestones (filled when done). Routine tasks live on the Routines tab.</div>`;
}

/* ---- Routines ---- */
function vRoutines(){
  const today=todayStr();const {mon,sun}=weekOf(today);const mEnd=addMonths(today.slice(0,8)+"01",1);
  const rs=active().filter(t=>t.tier==="Routine").sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const g={over:[],week:[],month:[],later:[],done:[]};
  for(const t of rs){if(t.status==="DN"){g.done.push(t);continue;}const od=overdueDays(t);if(od)g.over.push(t);else if(t.due&&t.due<=sun)g.week.push(t);else if(t.due&&t.due<mEnd)g.month.push(t);else g.later.push(t);}
  const grp=(title,arr,cls)=>`<div class="rt-group panel"><div class="ph"><h2 style="${cls?"color:var(--"+cls+")":""}">${title}</h2><span class="small muted num">${arr.length}</span></div><div class="pb tl">${arr.map(t=>`<div class="tr" data-open="${t.id}"><div class="sev ${t.priority}"></div><div><div class="t">${esc(t.title)} <span class="small muted">· ${USHORT[t.unit]} · ${esc(t.recurrence||"")}</span></div><div class="m">${taskMeta(t)}</div></div><div>${canEdit(t)&&OPEN(t.status)?`<button class="btn sm" data-done="${t.id}">Mark done</button>`:""}</div></div>`).join("")||`<div class="empty">None.</div>`}</div></div>`;
  return `<div class="note no-print">Marking a routine Done closes this instance and creates the next one automatically (weekly +7d, monthly +1m, quarterly +3m, annual +1y), carrying the sub-task checklist reset.</div>
  ${grp("Overdue",g.over,"bad")}${grp(`Due this week · ${fmtD(mon)} – ${fmtD(sun)}`,g.week)}${grp("Due later this month",g.month)}${grp("Upcoming",g.later)}${grp("Completed instances",g.done.slice(-15).reverse())}`;
}

  const k=kpis(ts);
  const text=[`EDGG WEEKLY STATUS — week of ${fmtD(mon)} to ${fmtD(sun)}`,`Open ${k.open} · Overdue ${k.overdue} · Blocked ${k.blocked} · Completed this week ${completed.length}`,"",
    ...[["COMPLETED",completed],["SLIPPED / OVERDUE",slipped],["BLOCKED / WAITING",blocked],["UPCOMING NEXT WEEK",upcoming],["FOR DIRECTOR REVIEW",review]].flatMap(([h,a])=>[h+" ("+a.length+")",...(a.length?a.map(t=>` - ${t.title} [${USHORT[t.unit]}${t.owner?" · "+t.owner:""}${t.due?" · due "+fmtD(t.due):""}${t.status==="BL"&&t.blockReason?" · "+t.blockReason:""}${t.status==="WO"&&t.waitingOn?" · waiting on "+t.waitingOn:""}]`):[" - none"]),""]),
    "ESCALATIONS ("+escs.length+")",...(escs.length?escs.map(e=>` - ${e.taskTitle} [${USHORT[e.unit]}] — ${e.reason}${e.acked?" (acknowledged)":" (pending)"}`):[" - none"]),"",
    "PROJECT ISSUES — critical or overdue ("+iHot.length+")",...(iHot.length?iHot.map(i=>` - ${i.title} [${(S.projects.get(i.projectId)||{}).name||""} · ${i.category} · ${i.severity}${i.owner?" · "+i.owner:""}]`):[" - none"]),

    ${(()=>{const wk=eventsAll().filter(e=>e.date>=mon&&e.date<=sun),nx=eventsAll().filter(e=>e.date>=nmon&&e.date<=nsun);const li=e=>{const a=attSummary(e);return `<li><b>${esc(e.title)}</b> <span class="muted">(${esc(e.type)} · ${fmtD(e.date)} · ${esc(e.status)} · checklist ${evProgress(e)}%${a.clients?` · ${a.clients} clients, ${a.sold} sold ${peso(a.soldValue)}`:""})</span></li>`;};return `<h3>Events this week <span class="muted num">(${wk.length})</span></h3>${wk.length?`<ul>${wk.map(li).join("")}</ul>`:`<div class="muted small">None.</div>`}<h3>Events next week <span class="muted num">(${nx.length})</span></h3>${nx.length?`<ul>${nx.map(li).join("")}</ul>`:`<div class="muted small">None.</div>`}`;})()}

    <div class="rf">Generated ${stamp(nowISO())} (Asia/Manila) · Unit-by-unit RAG: ${UNITS.map(u=>USHORT[u]+" "+unitRag(u).c).join(" · ")}</div>
  </div>`;
}

/* ===================== projects & issues ===================== */
function pcat(p){return p.category||"active";}
function riskScore(r){const v=x=>({Low:1,Medium:2,High:3}[x]||1);return v(r.likelihood)*v(r.impact);}
function riskBand(r){const sc=riskScore(r);return sc>=6?"R":sc>=3?"A":"G";}
function openRisks(p){return (p.risks||[]).filter(r=>r.title&&r.status!=="Closed");}
function flaggedRisks(p){return openRisks(p).filter(r=>r.flag==="Yes"||riskBand(r)==="R");}
function projectsRaw(){return [...S.projects.values()].filter(p=>!p.archived).sort((a,b)=>(a.name||"").localeCompare(b.name||""));}
function pScope(){const r=role();if(!r||isDirector())return "all";return S.pScope||(/sales/i.test(r.unit||"")?"all":"mine");}
function myProjectIds(){ // projects this person handles: leads, sits on the team of, holds below them on the chart, or (heads) anywhere in their department
  const r=role();if(!r||isDirector())return null;const st=r.seat;const nm=(r.name||"").trim().toLowerCase();const ids=new Set();const seatUnit=id=>{const s=id&&S.seats.get(id);return s?s.unit:"";};
  for(const p of projectsRaw()){const team=p.team||[];const mine=(st&&p.leadSeat===st.id)||(p.leadName||"").trim().toLowerCase()===nm||team.some(m=>(st&&m.seatId===st.id)||(m.name||"").trim().toLowerCase()===nm);
    const dept=r.level==="head"&&r.unit&&(seatUnit(p.leadSeat)===r.unit||p.leadDept===r.unit||team.some(m=>seatUnit(m.seatId)===r.unit||m.dept===r.unit));
    if(mine||dept)ids.add(p.id);}
  const seats=[st].concat(r.covered||[]).filter(Boolean);for(const s of seats){for(const p of seatProjects(s).concat(rolledProjects(s)))ids.add(p.id);}
  if(isMarketingUser()){const tr=myTerritory();for(const p of projectsRaw())if(pcat(p)==="active"&&(!tr||pjLoc(p)===tr))ids.add(p.id);}
  return ids;}
function projectsAll(){const raw=projectsRaw();if(pScope()!=="mine")return raw;const ids=myProjectIds();return ids?raw.filter(p=>ids.has(p.id)):raw;}
function issuesAll(){const all=[...S.issues.values()];if(pScope()!=="mine")return all;const ids=myProjectIds();return ids?all.filter(i=>!i.projectId||ids.has(i.projectId)):all;}
function eventsAll(){const all=[...S.events.values()].filter(e=>e.status!=="Cancelled"||S.evShowCX);if(pScope()!=="mine")return all;const ids=myProjectIds();return ids?all.filter(e=>!e.projectId||ids.has(e.projectId)):all;}
function openIssues(){return issuesAll().filter(i=>IOPEN(i.status));}
function overdueIssue(i){return IOPEN(i.status)&&i.due&&i.due<todayStr()?daysBetween(i.due,todayStr()):0;}
function projectIssues(pid){return issuesAll().filter(i=>i.projectId===pid);}
function projectTasks(pid){const pj=S.projects.get(pid);return active().filter(t=>t.projectId===pid||(pj&&t.link&&t.link.trim().toLowerCase()===pj.name.trim().toLowerCase()));}
function projectPct(pj){const ph=(pj.phases||[]).filter(p=>p.name);if(!ph.length)return Math.max(0,Math.min(100,Number(pj.overallPct)||0));const tw=ph.reduce((a,p)=>a+(Number(p.weight)||0),0);if(!tw)return Math.round(ph.reduce((a,p)=>a+(Number(p.pct)||0),0)/ph.length);return Math.round(ph.reduce((a,p)=>a+(Number(p.pct)||0)*(Number(p.weight)||0),0)/tw);}
function rfoRows(pj){return (pj.rfo||[]);}
function rfoSummary(pj){const r=rfoRows(pj);const s={total:r.length,byCond:{},byAvail:{},value:0,availValue:0,needsWork:0};for(const x of r){s.byCond[x.condition]=(s.byCond[x.condition]||0)+1;s.byAvail[x.avail]=(s.byAvail[x.avail]||0)+1;const v=Number(x.price)||0;s.value+=v;if(x.avail==="Available")s.availValue+=v;if(["Minor repairs","Major repairs","Punch-listed","Under rectification"].includes(x.condition))s.needsWork++;}return s;}
function rfoCondCls(c){return {"Ready":"st-DN","Turned over":"st-DN","Minor repairs":"st-WO","Punch-listed":"st-WO","Major repairs":"st-BL","Under rectification":"st-IP"}[c]||"st-NS";}
function rfoAvailCls(a){return {"Available":"st-IP","Reserved":"st-WO","Sold":"st-DN","Turned over":"st-DN","On hold":"st-BL"}[a]||"st-NS";}
function assetCls(s){return {"Requested":"st-NS","In production":"st-IP","For approval":"st-WO","Approved":"st-DN","Published":"st-DN","On hold":"st-BL"}[s]||"st-NS";}
function collCls(s){return {"Current":"st-DN","For update":"st-WO","Outdated":"st-BL","For reprint":"st-WO","Retired":"st-CX"}[s]||"st-NS";}
function collLow(c){const oh=Number(c.onHand),ra=Number(c.reorderAt);return isFinite(oh)&&isFinite(ra)&&ra>0&&oh<=ra;}
function assetLate(a){return a.due&&a.due<todayStr()&&!["Approved","Published"].includes(a.status);}
function invIsUnits(rows){return rows.some(r=>r.lot!=null||r.blkLot!=null||r.status!=null||r.client!=null);}
function invStatus(r){const st=String(r.status||"").toUpperCase().trim();if(INV_STATUS.includes(st))return st;if(String(r.client||"").trim())return "SOLD";if(/hold|block/i.test((r.pdt||"")+" "+(r.remarks||"")))return "HOLD";if(/reserv/i.test((r.pdt||"")+" "+(r.remarks||"")+" "+st))return "RESERVED";return "UNSOLD";}
function fixInvRow(r){r.status=invStatus(r);if(!String(r.blkLot||"").trim()&&(String(r.block||"").trim()||String(r.lot||"").trim()))r.blkLot=[r.block,r.lot].filter(x=>String(x||"").trim()).join("-");let p=r.progress;if(p!==""&&p!=null){p=Number(String(p).replace(/[^\d.\-]/g,""));if(isNaN(p))p="";else{if(p>0&&p<=1)p=p*100;p=Math.round(p*10)/10;if(p>100&&p<101)p=100;}r.progress=p;}for(const k of ["model","lotCat","color"])if(String(r[k]||"").trim()==="-"||r[k]==="0"||r[k]===0)r[k]="";return r;}
function invGroups(pj){const groups={};for(const x of (pj.inventory||[])){const g=String(x.phase||x.label||pj.code||"—").trim()||"—";const o=groups[g]||(groups[g]={g,n:0,sold:0,res:0,hold:0,hl:0,lot:0});o.n++;const st=invStatus(x);if(st==="SOLD"||st==="TURNED OVER")o.sold++;else if(st==="RESERVED")o.res++;else if(st==="HOLD")o.hold++;if(/h\s*&\s*l/i.test(x.lotCat||""))o.hl++;else o.lot++;}return Object.values(groups).map(o=>Object.assign(o,{av:o.n-o.sold-o.res-o.hold}));}
function invTotals(pj){const r=(pj.inventory||[]);const t={total:0,reserved:0,sold:0,turned:0,hold:0,units:false};
  if(invIsUnits(r)){t.units=true;for(const x of r){t.total++;const st=invStatus(x);if(st==="SOLD")t.sold++;else if(st==="TURNED OVER"){t.sold++;t.turned++;}else if(st==="RESERVED")t.reserved++;else if(st==="HOLD")t.hold++;}t.available=t.total-t.sold-t.reserved-t.hold;}
  else{for(const x of r){t.total+=Number(x.total)||0;t.reserved+=Number(x.reserved)||0;t.sold+=Number(x.sold)||0;t.turned+=Number(x.turned)||0;}t.available=Math.max(0,t.total-t.reserved-t.sold);}
  t.soldPct=t.total?Math.round(100*(t.sold+t.reserved)/t.total):0;return t;}
function projectRag(pj){const is=projectIssues(pj.id).filter(i=>IOPEN(i.status));const crit=is.filter(i=>i.severity==="Critical").length,od=is.filter(overdueIssue).length,hi=is.filter(i=>i.severity==="High").length;const fr=flaggedRisks(pj).length;let c="G";if((is.length&&(od||hi))||openRisks(pj).some(r=>riskBand(r)==="A"))c="A";if(crit||od>=2||hi>=3||fr)c="R";if(pj.status==="On hold"||pj.landTag==="Stale")c="A";return {c,open:is.length,crit,od,fr};}
function canEditProjects(){return !!role();}
function leadName(pj){const st=pj.leadSeat&&S.seats.get(pj.leadSeat);return pj.leadName||(st?seatPerson(st)||st.title:"")||"—";}
function issuePill(i){return pill("st-"+({OP:"NS",IP:"IP",WO:"WO",RS:"DN",CL:"CX"}[i.status]||"NS"),ISNAME[i.status]||i.status);}
function issueRow(i,why){const pj=S.projects.get(i.projectId);const od=overdueIssue(i);return `<div class="tr" data-openissue="${i.id}"><div class="sev ${i.severity}"></div><div><div class="t">${esc(i.title)} <span class="small muted">· ${esc(pj?pj.name:"")}</span></div><div class="m">${pill("cat",i.category)} ${issuePill(i)} ${pill("pr-"+i.severity,i.severity)} ${od?pill("over",`Overdue ${od}d`):i.due?`<span class="small muted num">due ${fmtD(i.due)}</span>`:""} ${i.owner?`<span class="small muted">${esc(i.owner)}</span>`:""}${i.sample?" "+pill("sample","SAMPLE"):""}</div></div>${why?`<div class="why">${esc(why)}</div>`:""}</div>`;}
function vProjects(){

function openRows(kind,pid){const pj=S.projects.get(pid);if(!pj)return;RM={kind,pid,rows:JSON.parse(JSON.stringify(pj[kind]||[])),eff:pj.priceEffective||"",asOf:pj[kind+"AsOf"]||""};drawRows();}
function openCollRows(kind,filter,defaults){const d=ROWDEFS[kind];const map=S[d.coll];const all=[...map.values()];const shown=filter?all.filter(filter):all;RM={kind,coll:d.coll,rows:shown.map(x=>JSON.parse(JSON.stringify(x))),hiddenIds:new Set(all.filter(x=>!shown.includes(x)).map(x=>x.id)),defaults:defaults||null,gone:[],asOf:""};if(!RM.rows.length&&defaults)RM.rows.push(Object.assign({},defaults));drawRows();}
function hdrRowIndex(kind,grid){const keys=(ROWDEFS[kind].hdrKeys||[]).map(normHdr);for(let i=0;i<Math.min(grid.length,25);i++){const r=grid[i].map(normHdr);const n=r.filter(Boolean).length;if(n<2)continue;if(!keys.length||keys.some(k=>r.includes(k)))return i;}return grid.findIndex(r=>r.filter(v=>String(v??"").trim()).length>=2);}
function pickSheet(wb,kind,pj){const bad=/^(summary|inventory|sheet\d*|notes?|legend)$/i;const names=wb.SheetNames.filter(n=>!bad.test(n.trim()));const cands=names.filter(n=>hdrRowIndex(kind,XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}).slice(0,25))>=0);if(!cands.length)return wb.SheetNames[0];if(cands.length===1)return cands[0];const toks=[pj&&pj.code,pj&&pj.name].filter(Boolean).join(" ").toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>2);const hit=cands.find(n=>{const l=n.toLowerCase();return toks.some(t=>l.includes(t));});return hit||cands[0];}
function normHdr(x){return String(x||"").toLowerCase().replace(/[₱%().\/_-]/g," ").replace(/\s+/g," ").trim();}
function mapUpload(kind,grid){const d=ROWDEFS[kind];if(!grid.length)return {rows:[],matched:[]};const hdr=grid[0].map(normHdr);const idx={};const matched=[];
  const used=new Set();const names=c=>[c.k,c.l,c.x].concat(c.alias||[]).filter(Boolean).map(normHdr);
  for(const c of d.cols){const ns=names(c);const j=hdr.findIndex((h,i)=>!used.has(i)&&ns.includes(h));if(j>=0){idx[c.k]=j;used.add(j);}}
  for(const c of d.cols){if(c.k in idx)continue;const ns=names(c);const j=hdr.findIndex((h,i)=>!used.has(i)&&h&&ns.some(n=>n.length>2&&(h.includes(n)||(h.length>3&&n.includes(h)))));if(j>=0){idx[c.k]=j;used.add(j);}}
  for(const c of d.cols)if(c.k in idx)matched.push(c.l);
  const rows=grid.slice(1).filter(r=>r.some(v=>String(v??"").trim())).map(r=>{const o={};for(const c of d.cols){if(!(c.k in idx))continue;let v=r[idx[c.k]];if(v instanceof Date)v=v.toISOString().slice(0,10);v=String(v??"").trim();if(c.t==="number"){v=v.replace(/[^\d.\-]/g,"");if(!/\d/.test(v))v="";}if(c.t==="select"&&v){const m=c.opts.find(o2=>o2.toLowerCase()===v.toLowerCase())||c.opts.find(o2=>o2.toLowerCase().startsWith(v.toLowerCase().slice(0,4)));v=m||v;}if(c.t==="project"&&v){const pj=projectsRaw().find(p=>p.name.toLowerCase()===v.toLowerCase()||(p.code||"").toLowerCase()===v.toLowerCase());v=pj?pj.id:"";}if(c.t==="facility"&&v){const fx=[...S.facilities.values()].find(x=>(x.name||"").toLowerCase()===v.toLowerCase());v=fx?fx.id:"";}o[c.k]=v;}return o;});
  return {rows,matched};}
function parseCsv(text){const rows=[];let row=[],cur="",q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===","){row.push(cur);cur="";}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur="";}else cur+=ch;}}if(cur.length||row.length){row.push(cur);rows.push(row);}return rows;}
async function uploadRows(file){if(!RM||!file)return;let grid;try{if(/\.(xlsx|xls)$/i.test(file.name)){await loadXlsx();const buf=await file.arrayBuffer();const wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:true});const sn=pickSheet(wb,RM.kind,RM.pid&&S.projects.get(RM.pid));const ws=wb.Sheets[sn];grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});if(wb.SheetNames.length>1)toast("Reading sheet “"+sn+"” ("+wb.SheetNames.length+" sheets in the workbook)");}else{grid=parseCsv(await file.text());}}catch(e){toast("Could not read the file: "+((e&&e.message)||"the Excel reader could not load on this connection — save the sheet as CSV and upload that"));return;}
  let start=hdrRowIndex(RM.kind,grid);if(start<0){toast("No table found in the file");return;}grid=grid.slice(start);
  let {rows,matched}=mapUpload(RM.kind,grid);if(RM.kind==="inventory"){rows=rows.filter(r=>String(r.lot||"").trim()||String(r.blkLot||"").trim()).map(fixInvRow);}if(!matched.length){toast("None of the column headings were recognised — use the same names as the grid (e.g. "+ROWDEFS[RM.kind].cols.slice(0,3).map(c=>c.l).join(", ")+")");return;}
  askConfirm("Replace or add?",`${rows.length} row${rows.length===1?"":"s"} read; matched columns: ${matched.join(", ")}. Confirm = replace the current ${RM.rows.length} row${RM.rows.length===1?"":"s"} with the file. Keep = add the file's rows below the existing ones.`,ok=>{if(ok)RM.rows=rows;else RM.rows=RM.rows.concat(rows);if(!RM.asOf)RM.asOf=todayStr();drawRows();toast(`${rows.length} rows loaded from ${file.name}`);});}

function templatesFor(type){const t=(S.evTemplates&&S.evTemplates.types&&S.evTemplates.types[type])||null;if(t&&t.length)return t.map(x=>Object.assign({},x));return (DEFAULT_TEMPLATES[type]||DEFAULT_TEMPLATES["Other"]).map(([title,unit,qtyPer])=>({title,tag:"STANDARD",unit:unit||"",qtyPer:qtyPer||0}));}

function attSummary(ev){const a=(ev.attendees||[]).filter(x=>x.name);const cl=a.filter(x=>x.kind==="Client");const val=k=>cl.filter(x=>x.unitStatus===k).reduce((s,x)=>s+(Number(x.unitValue)||0),0);return {total:a.length,clients:cl.length,sellers:a.filter(x=>x.kind.startsWith("Seller")).length,corp:a.filter(x=>x.kind.startsWith("Corporate")).length,targeted:cl.filter(x=>x.unit).length,targetValue:cl.reduce((s,x)=>s+(Number(x.unitValue)||0),0),sold:cl.filter(x=>x.unitStatus==="Sold").length,soldValue:val("Sold"),reserved:cl.filter(x=>x.unitStatus==="Reserved").length,reservedValue:val("Reserved")};}

function calendarItems(){ // events + project phase milestones + dated sub-tasks of workstreams
  const items=[];

function openEvent(id,projectId,date){const ev=id?S.events.get(id):null;if(id&&!ev)return;EM={orig:ev?JSON.parse(JSON.stringify(ev)):null,e:ev?JSON.parse(JSON.stringify(ev)):blankEvent(projectId,date),isNew:!ev,tab:"details",err:""};const e=EM.e;e.checklist=e.checklist||[];e.attendees=e.attendees||[];e.comments=e.comments||[];e.log=e.log||[];e.budgetMemo=e.budgetMemo||{status:"Not started",ref:"",url:""};if(EM.isNew)e.checklist=templatesFor(e.type).map(t=>({id:uid("c"),title:t.title,tag:"STANDARD",unit:t.unit||"",qtyPer:t.qtyPer||0,done:false,owner:"",due:""}));drawEvent();}
function drawEvent(){
  const e=EM.e;const ed=!!role();const opt=(arr,v,blank)=>(blank?`<option value="">${blank}</option>`:"")+arr.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val===v?"selected":""}>${esc(l)}</option>`;}).join("");
  const a=attSummary(e);const pj=S.projects.get(e.projectId);const units=pj?(pj.priceList||[]).map(x=>x.type):[];
  const tabs=[["details","Details"],["checklist",`Checklist ${evProgress(e)}%`],["attendees",`Attendees ${a.total}`],["notes","Notes & log"]];
  let body="";
  if(EM.tab==="details")body=`<div class="grid g2">
      <div class="field" style="grid-column:1/-1"><label>Event title</label><input type="text" id="ev_title" value="${esc(e.title)}" placeholder="e.g. Asiana Hermosa Ph2 Open House — October"></div>
      <div class="field"><label>Type</label><select id="ev_type">${opt(EVENT_TYPES,e.type)}</select></div>
      <div class="field"><label>Project</label><select id="ev_project">${opt(projectsAll().map(p=>[p.id,p.name]),e.projectId,"— none —")}</select></div>
      <div class="field"><label>Date</label><input type="date" id="ev_date" value="${e.date||""}"></div>
      <div class="field"><label>End date (multi-day)</label><input type="date" id="ev_end" value="${e.endDate||""}"></div>
      <div class="field"><label>Time</label><input type="text" id="ev_time" value="${esc(e.time)}" placeholder="e.g. 9:00 AM – 4:00 PM"></div>
      <div class="field"><label>Venue</label><input type="text" id="ev_venue" value="${esc(e.venue)}"></div>
      <div class="field"><label>Status</label><select id="ev_status">${opt(EVENT_STATUS,e.status)}</select></div>
      <div class="field"><label>Corporate in charge</label><input type="text" id="ev_owner" value="${esc(e.owner)}"></div>
      <div class="field"><label>Expected attendees (drives quantities)</label><input type="text" id="ev_expected" value="${esc(e.expected)}" inputmode="numeric" placeholder="e.g. 60"></div>
      <div class="field"><label>Budget (₱)</label><input type="text" id="ev_budget" value="${esc(e.budget)}" inputmode="decimal"></div>
      <div class="field" style="grid-column:1/-1"><label>Event concept</label><textarea id="ev_concept" rows="4" placeholder="Objective, target audience, format, promo mechanics, key messages">${esc(e.concept)}</textarea></div>
    </div>
    <div class="sub"><h3>Budget memo</h3><div class="grid g3"><div class="field"><label>Status</label><select id="ev_bmstatus">${opt(["Not started","Drafted","Submitted","Approved","Revise"],e.budgetMemo.status)}</select></div><div class="field"><label>Reference no.</label><input type="text" id="ev_bmref" value="${esc(e.budgetMemo.ref)}" placeholder="e.g. BM-2026-014"></div><div class="field"><label>Link (shared drive)</label><input type="url" id="ev_bmurl" value="${esc(e.budgetMemo.url)}" placeholder="https://…"></div></div><div class="small muted" style="margin-top:6px">Approving the memo ticks the "Budget memo approved" checklist item; filling the concept ticks "Event concept approved" when you mark it so.</div></div>`;
  else if(EM.tab==="checklist"){const std=e.checklist.filter(c=>c.tag==="STANDARD"),sp=e.checklist.filter(c=>c.tag!=="STANDARD");const item=(c,i)=>`<div class="ckrow ${c.done?"done":""}"><input type="checkbox" data-ck-done="${i}" ${c.done?"checked":""}><input type="text" data-ck-title="${i}" value="${esc(c.title)}" placeholder="Item"><span class="small num muted" title="quantity from expected attendees">${chkQty(c,e)?chkQty(c,e)+" "+esc(c.unit):""}</span><input type="text" data-ck-owner="${i}" value="${esc(c.owner||"")}" placeholder="Owner"><input type="date" data-ck-due="${i}" value="${c.due||""}"><select data-ck-tag="${i}"><option ${c.tag==="STANDARD"?"selected":""}>STANDARD</option><option ${c.tag!=="STANDARD"?"selected":""}>SPECIAL</option></select><button class="del" data-ck-del="${i}" type="button" aria-label="Remove">×</button></div>`;
    body=`<div class="note">STANDARD items come from the ${esc(e.type)} template and appear on every ${esc(e.type)}; SPECIAL items are for this event only. Quantities in grey scale with the expected attendees (${e.expected||0}).</div>
      <div class="sub"><h3>Standard <span class="small muted num">${std.filter(c=>c.done).length}/${std.length}</span><span class="spacer"></span>${isDirector()?`<button class="btn sm" data-ck-savestd type="button" title="Make this event's STANDARD list the template for ${esc(e.type)}">Save as standard for ${esc(e.type)}</button>`:""}<button class="btn sm" data-ck-reload type="button">Reload template</button></h3><div class="ckhead"><span></span><span>Item</span><span>Qty</span><span>Owner</span><span>Due</span><span>Tag</span><span></span></div>${e.checklist.map((c,i)=>c.tag==="STANDARD"?item(c,i):"").join("")||`<div class="small muted">No standard items.</div>`}</div>
      <div class="sub"><h3>Special — this event only <span class="small muted num">${sp.filter(c=>c.done).length}/${sp.length}</span><span class="spacer"></span><button class="btn sm" data-ck-add="SPECIAL" type="button">+ Special item</button><button class="btn sm ghost" data-ck-add="STANDARD" type="button">+ Standard item</button></h3>${e.checklist.map((c,i)=>c.tag!=="STANDARD"?item(c,i):"").join("")||`<div class="small muted">None. Add case-to-case requirements here (e.g. LGU permit for a street event, shuttle service).</div>`}</div>`;}
  else if(EM.tab==="attendees"){body=`<div class="row" style="margin-bottom:8px"><div class="kpi" style="padding:8px 12px"><div class="lbl">Clients</div><div class="v num" style="font-size:24px">${a.clients}</div></div><div class="kpi" style="padding:8px 12px"><div class="lbl">Units targeted</div><div class="v num" style="font-size:24px">${a.targeted}</div><div class="s">${peso(a.targetValue)}</div></div><div class="kpi good" style="padding:8px 12px"><div class="lbl">Sold</div><div class="v num" style="font-size:24px">${a.sold}</div><div class="s">${peso(a.soldValue)}</div></div><div class="kpi warn" style="padding:8px 12px"><div class="lbl">Reserved</div><div class="v num" style="font-size:24px">${a.reserved}</div><div class="s">${peso(a.reservedValue)}</div></div><div class="kpi info" style="padding:8px 12px"><div class="lbl">Sellers · Corporate</div><div class="v num" style="font-size:24px">${a.sellers} · ${a.corp}</div></div></div>
      <div class="sub"><h3>Attendees<span class="spacer"></span><button class="btn sm" data-at-add="Client" type="button">+ Client</button><button class="btn sm" data-at-add="Seller — Agent" type="button">+ Agent</button><button class="btn sm" data-at-add="Seller — Broker" type="button">+ Broker</button><button class="btn sm" data-at-add="Corporate — In charge" type="button">+ Corporate</button></h3>
      <div class="tblwrap"><div style="min-width:980px"><div class="athead"><span>Name</span><span>Kind</span><span>Team / brokerage / agent</span><span>Project</span><span>Unit targeted</span><span>Value ₱</span><span>Status</span><span>Notes</span><span></span></div>
      ${e.attendees.map((x,i)=>`<div class="atrow ${x.kind==="Client"?"":"nonclient"}"><input type="text" data-at-name="${i}" value="${esc(x.name)}" placeholder="Name"><select data-at-kind="${i}">${opt(ATT_KINDS,x.kind)}</select><input type="text" data-at-team="${i}" value="${esc(x.team||"")}" placeholder="${x.kind==="Client"?"handling agent / broker":"team or brokerage"}"><select data-at-project="${i}">${opt(projectsAll().map(p=>[p.id,p.code||p.name]),x.projectId||e.projectId,"—")}</select><input type="text" data-at-unit="${i}" list="unitList" value="${esc(x.unit||"")}" placeholder="e.g. Blk 3 Lot 12"><input type="text" data-at-value="${i}" value="${esc(x.unitValue||"")}" inputmode="decimal"><select data-at-status="${i}">${opt(UNIT_STATUS,x.unitStatus||"Targeted")}</select><input type="text" data-at-notes="${i}" value="${esc(x.notes||"")}"><button class="del" data-at-del="${i}" type="button" aria-label="Remove">×</button></div>`).join("")||`<div class="small muted">No attendees yet.</div>`}
      <datalist id="unitList">${units.map(u=>`<option value="${esc(u)}">`).join("")}</datalist></div></div>
      <div class="small muted" style="margin-top:6px">Clients carry the unit they are being shown, its list value and whether it was sold. Sellers are agents (with their team) or brokers; corporate rows are the WRLD people in charge.</div></div>`;}
  else body=`<div class="sub"><h3>Comments <span class="small muted num">${e.comments.length}</span></h3>${e.comments.map(c=>`<div class="cmt"><div>${esc(c.text)}</div><div class="ca">${esc(c.author)} · ${stamp(c.ts)}</div></div>`).join("")}<div class="row" style="margin-top:8px"><input type="text" id="ev_cmt" placeholder="Add a note" style="flex:1"><button class="btn sm" data-ev-addcmt type="button">Post</button></div></div><div class="sub"><h3>Change log</h3><div class="log">${[...e.log].reverse().map(l=>`<div><span class="muted num">${stamp(l.ts)}</span> · <b>${esc(l.role)}</b> — ${esc(l.text)}</div>`).join("")||`<div class="muted">No changes yet.</div>`}</div></div>`;
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog" style="width:min(1060px,100%)"><div class="dh"><h2>${EM.isNew?"New event":esc(e.title||"Event")}</h2>${pill("st-"+({Planned:"NS",Confirmed:"IP",Done:"DN",Cancelled:"CX"}[e.status]||"NS"),e.status)}<span class="small muted">${esc(evDateLabel(e))}</span>${e.sample?pill("sample","SAMPLE"):""}<button class="x" data-close aria-label="Close">×</button></div>
    <div class="tabs" style="padding:0 18px;border-bottom:1px solid var(--line)">${tabs.map(([id,l])=>`<button data-evtab="${id}" class="${EM.tab===id?"on":""}" type="button">${l}</button>`).join("")}</div>
    <div class="db">${EM.err?`<div class="err">${esc(EM.err)}</div>`:""}<fieldset style="border:0;padding:0;margin:0;min-width:0" ${ed?"":"disabled"}>${body}</fieldset></div>
    <div class="df">${!EM.isNew&&ed?`<button class="btn sm" data-ev-report type="button">Download event sheet</button>`:""}<span class="spacer"></span><button class="btn" data-close type="button">Close</button>${ed?`<button class="btn primary" data-saveevent type="button">${EM.isNew?"Create event":"Save event"}</button>`:""}</div></div></div>`;
  const ty=$("#ev_type");if(ty)ty.addEventListener("change",e2=>{readEvent();if(EM.isNew||!EM.e.checklist.length||confirmReload()){EM.e.checklist=EM.e.checklist.filter(c=>c.tag!=="STANDARD").concat(templatesFor(e2.target.value).map(t=>({id:uid("c"),title:t.title,tag:"STANDARD",unit:t.unit||"",qtyPer:t.qtyPer||0,done:false,owner:"",due:""})));}toast("Checklist reset to the "+e2.target.value+" standard");});
  const bm=$("#ev_bmstatus");if(bm)bm.addEventListener("change",e2=>{if(e2.target.value==="Approved"){readEvent();const it=EM.e.checklist.find(c=>/budget memo/i.test(c.title));if(it)it.done=true;}});
}
function confirmReload(){return true;}
function readEvent(){const e=EM.e,g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
  if(g("ev_title")!==undefined)Object.assign(e,{title:g("ev_title").trim(),type:g("ev_type"),projectId:g("ev_project"),date:g("ev_date"),endDate:g("ev_end"),time:g("ev_time").trim(),venue:g("ev_venue").trim(),status:g("ev_status"),owner:g("ev_owner").trim(),expected:g("ev_expected").trim(),budget:g("ev_budget").trim(),concept:g("ev_concept").trim(),budgetMemo:{status:g("ev_bmstatus"),ref:g("ev_bmref").trim(),url:g("ev_bmurl").trim()}});
  document.querySelectorAll("[data-ck-title]").forEach(el=>{const c=e.checklist[+el.dataset.ckTitle];c.title=el.value;c.done=document.querySelector(`[data-ck-done="${el.dataset.ckTitle}"]`).checked;c.owner=document.querySelector(`[data-ck-owner="${el.dataset.ckTitle}"]`).value.trim();c.due=document.querySelector(`[data-ck-due="${el.dataset.ckTitle}"]`).value;c.tag=document.querySelector(`[data-ck-tag="${el.dataset.ckTitle}"]`).value;});
  document.querySelectorAll("[data-at-name]").forEach(el=>{const i=el.dataset.atName;const x=e.attendees[+i];const q=k=>document.querySelector(`[data-at-${k}="${i}"]`).value;x.name=el.value.trim();x.kind=q("kind");x.team=q("team").trim();x.projectId=q("project");x.unit=q("unit").trim();x.unitValue=q("value").replace(/[^\d.]/g,"");x.unitStatus=q("status");x.notes=q("notes").trim();});}
async function saveEvent(){readEvent();const e=EM.e,o=EM.orig;if(!e.title){EM.err="Give the event a title.";EM.tab="details";drawEvent();return;}if(!e.date){EM.err="Set the event date.";EM.tab="details";drawEvent();return;}
  e.checklist=e.checklist.filter(c=>c.title.trim());e.attendees=e.attendees.filter(x=>x.name);
  if(EM.isNew)logEntry(e,"create","Event created");else{if(o.status!==e.status)logEntry(e,"status",`Status ${o.status} → ${e.status}`);if(o.date!==e.date)logEntry(e,"date",`Date ${fmtD(o.date)} → ${fmtD(e.date)}`);const od=(o.checklist||[]).filter(c=>c.done).length,nd=e.checklist.filter(c=>c.done).length;if(od!==nd)logEntry(e,"check",`Checklist ${od} → ${nd} done`);const os=attSummary(o),ns=attSummary(e);if(os.sold!==ns.sold||os.reserved!==ns.reserved)logEntry(e,"sales",`Sold ${os.sold} → ${ns.sold} · reserved ${os.reserved} → ${ns.reserved}`);if((o.budgetMemo||{}).status!==e.budgetMemo.status)logEntry(e,"memo",`Budget memo ${(o.budgetMemo||{}).status||"—"} → ${e.budgetMemo.status}`);}
  closeModal();EM=null;await saveEventDoc(e);toast(EM?"":"Event saved");}
async function saveEventDoc(e){e.updated=nowISO();e.updatedBy=role()?role().label:"?";S.events.set(e.id,e);if(S.db){try{await S.db.doc("events/"+e.id).set(e);}catch(x){toast("Save failed: "+(x.message||x.code||"unknown"));}}render();}
async function saveTemplates(t){S.evTemplates=t;if(S.db){try{await S.db.doc("org/eventTemplates").set(t);}catch(x){toast("Save failed");}}}
async function saveStdFromEvent(){readEvent();const e=EM.e;const items=e.checklist.filter(c=>c.tag==="STANDARD"&&c.title.trim()).map(c=>({title:c.title.trim(),tag:"STANDARD",unit:c.unit||"",qtyPer:c.qtyPer||0}));if(!items.length){toast("No STANDARD items to save.");return;}const t=JSON.parse(JSON.stringify(S.evTemplates||{types:{}}));t.types=t.types||{};t.types[e.type]=items;await saveTemplates(t);toast(`${items.length} items saved as the standard ${e.type} checklist`);}
/* templates editor */
let TPM=null;
function openTemplates(){TPM={type:EVENT_TYPES[0]};drawTemplates();}
function drawTemplates(){const items=templatesFor(TPM.type);const custom=!!(S.evTemplates&&S.evTemplates.types&&S.evTemplates.types[TPM.type]);
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog"><div class="dh"><h2>Standard checklists</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db"><div class="note">These items are pre-filled on every new event of the type. Qty-per-attendee makes an item scale with the expected attendance (1 = one per attendee, 0.5 = one per two).</div>
    <div class="row" style="margin-bottom:10px"><select id="tp_type">${EVENT_TYPES.map(t=>`<option ${t===TPM.type?"selected":""}>${t}</option>`).join("")}</select><span class="small muted">${custom?"customised for WRLD":"built-in default"}</span><span class="spacer" style="flex:1"></span>${isDirector()?`<button class="btn sm" data-tp-add type="button">+ Item</button>${custom?`<button class="btn sm ghost" data-tp-reset type="button">Reset to built-in</button>`:""}`:""}</div>
    <div class="rowhead" style="grid-template-columns:3fr 90px 120px 28px"><span>Item</span><span>Unit</span><span>Qty per attendee</span><span></span></div>${items.map((it,i)=>`<div class="rowline" style="grid-template-columns:3fr 90px 120px 28px"><input type="text" data-tp-title="${i}" value="${esc(it.title)}" ${isDirector()?"":"disabled"}><input type="text" data-tp-unit="${i}" value="${esc(it.unit||"")}" placeholder="pcs" ${isDirector()?"":"disabled"}><input type="text" data-tp-qty="${i}" value="${esc(it.qtyPer||"")}" inputmode="decimal" ${isDirector()?"":"disabled"}><button class="del" data-tp-del="${i}" type="button" ${isDirector()?"":"disabled"}>×</button></div>`).join("")}
  </div><div class="df"><span class="spacer"></span><button class="btn" data-close type="button">Close</button>${isDirector()?`<button class="btn primary" data-tp-save type="button">Save for ${esc(TPM.type)}</button>`:""}</div></div></div>`;
  $("#tp_type").addEventListener("change",e=>{TPM.type=e.target.value;drawTemplates();});}
function readTemplates(){return [...document.querySelectorAll("[data-tp-title]")].map(el=>{const i=el.dataset.tpTitle;return {title:el.value.trim(),tag:"STANDARD",unit:document.querySelector(`[data-tp-unit="${i}"]`).value.trim(),qtyPer:Number(document.querySelector(`[data-tp-qty="${i}"]`).value)||0};}).filter(x=>x.title);}
function eventSheetHtml(e){const E=esc;const pj=S.projects.get(e.projectId);const a=attSummary(e);const cl=e.attendees.filter(x=>x.kind==="Client"),sl=e.attendees.filter(x=>x.kind.startsWith("Seller")),co=e.attendees.filter(x=>x.kind.startsWith("Corporate")||x.kind.startsWith("Guest"));
  const style=`body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#2E211A;margin:0;background:#fff;font-size:12.5px;line-height:1.4}.pg{max-width:960px;margin:0 auto;padding:28px 32px}h1{font-family:Georgia,serif;font-weight:600;font-size:24px;margin:0}h2{font-family:Georgia,serif;font-weight:600;font-size:16px;margin:20px 0 6px;border-bottom:1px solid #D9CBB4;padding-bottom:4px}.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7A6656;font-weight:700}.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #3B2A20;padding-bottom:10px;gap:12px;flex-wrap:wrap}.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px}.kv span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#7A6656}table{border-collapse:collapse;width:100%}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7A6656;padding:6px;border-bottom:1px solid #C9B79B}td{padding:5px 6px;border-bottom:1px solid #EFE6D6;vertical-align:top}.num{text-align:right;white-space:nowrap}.m{font-size:11px;color:#7A6656}.done{color:#6E8560}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}.kp div{border-left:3px solid #A8836A;padding-left:10px}.kp b{font-family:Georgia,serif;font-size:26px;font-weight:500;display:block;line-height:1}.kp span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#7A6656}@media print{.pg{padding:0}}`;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${E(e.title)} — event sheet</title><style>${style}</style></head><body><div class="pg"><div class="hd"><div><div class="lbl">WRLD Capital Holdings · EDGG · ${E(e.type)}</div><h1>${E(e.title)}</h1><div class="m">${E(evDateLabel(e))}${e.venue?" · "+E(e.venue):""}${pj?" · "+E(pj.name):""}</div></div><div style="text-align:right"><div class="lbl">Status</div><div style="font-family:Georgia,serif;font-size:18px">${E(e.status)}</div><div class="m">In charge: ${E(e.owner||"—")}</div></div></div>
  <div class="kp"><div><b>${evProgress(e)}%</b><span>Checklist done</span></div><div><b>${e.expected||"—"}</b><span>Expected attendees</span></div><div><b>${a.clients}</b><span>Clients listed</span></div><div><b>${a.targeted}</b><span>Units targeted · ${peso(a.targetValue)}</span></div><div><b>${a.sold}</b><span>Sold · ${peso(a.soldValue)}</span></div><div><b>${a.reserved}</b><span>Reserved · ${peso(a.reservedValue)}</span></div><div><b style="font-size:18px;padding-top:6px">${e.budget?peso(e.budget):"—"}</b><span>Budget · memo ${E(e.budgetMemo.status)}${e.budgetMemo.ref?" · "+E(e.budgetMemo.ref):""}</span></div></div>
  <h2>Concept</h2><p>${E(e.concept||"—")}</p>
  <h2>Checklist</h2><table><thead><tr><th></th><th>Item</th><th>Tag</th><th class="num">Qty</th><th>Owner</th><th>Due</th></tr></thead><tbody>${e.checklist.map(c=>`<tr class="${c.done?"done":""}"><td>${c.done?"☑":"☐"}</td><td>${E(c.title)}</td><td>${E(c.tag)}</td><td class="num">${chkQty(c,e)?chkQty(c,e)+" "+E(c.unit):""}</td><td>${E(c.owner||"")}</td><td>${c.due?fmtD(c.due):""}</td></tr>`).join("")}</tbody></table>

function localPending(){const all=LocalStore.read();const n=c=>Object.keys(all[c]||{}).length;const parts=[["accounts",n("accounts")],["seats",n("seats")],["tasks",n("tasks")],["projects",n("projects")],["issues",n("issues")],["events",n("events")]].filter(x=>x[1]);if(!parts.length&&!(all.org&&all.org.structure))return "";return parts.map(([k,v])=>v+" "+k).join(", ")+(all.org&&all.org.structure?", the org structure":"");}
async function migrateLocal(){const all=LocalStore.read();if(!FB)throw new Error("not connected");
  for(const c of Object.keys(COLLS)){for(const [id,d] of Object.entries(all[c]||{})){await FireStore.doc(c+"/"+id).set(d);}}
  if(all.org){for(const k of ["meta","structure","eventTemplates"])if(all.org[k])await FireStore.doc("org/"+k).set(all.org[k]);}
  try{localStorage.setItem("edgg.data.migrated",JSON.stringify(all));localStorage.removeItem("edgg.data");}catch(e){}
  toast("Copied to the shared database — reloading");setTimeout(()=>location.reload(),800);}
async function importAll(d){
  const write=async(coll,arr)=>{for(const x of arr||[]){if(!x||!x.id)continue;await S.db.doc(coll+"/"+x.id).set(x);}};
  if(d.structure)await saveStruct(d.structure);
  await write("tasks",d.tasks);await write("escalations",d.escalations);await write("events",d.events);await write("appointments",d.appointments);await write("assets",d.assets);await write("merchants",d.merchants);await write("facilities",d.facilities);await write("upkeep",d.upkeep);await write("sales",d.sales);await write("targets",d.targets);await write("accounts",d.accounts);if(d.eventTemplates)await S.db.doc("org/eventTemplates").set(d.eventTemplates);await write("seats",d.seats);await write("projects",d.projects);await write("issues",d.issues);
  if(d.meta)await S.db.doc("org/meta").set(Object.assign({},META_DEFAULT,d.meta));
  if(S.db===LocalStore){LocalStore.load();render();}
}
function restoreFile(input){const f=input.files&&input.files[0];if(!f)return;const rd=new FileReader();rd.onload=async e=>{try{const d=JSON.parse(e.target.result);askConfirm("Restore from backup?",`${(d.tasks||[]).length} tasks, ${(d.seats||[]).length} seats, ${(d.projects||[]).length} projects, ${(d.issues||[]).length} issues from ${d.exported?stamp(d.exported):"an unknown date"}. Records with the same id are replaced.`,async ok=>{if(!ok)return;await importAll(d);toast("Backup restored");});}catch(x){toast("That file is not an EDGG backup.");}};rd.readAsText(f);input.value="";}

function reportPreview(){
  const ts=active().filter(t=>OPEN(t.status));const by={};for(const t of ts){(by[t.owner||"Unassigned"]=by[t.owner||"Unassigned"]||[]).push(t);}
  const rows=Object.entries(by).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
  return `<div class="tblwrap"><table class="reg" style="min-width:0"><thead><tr><th>Person</th><th>Open</th><th>Overdue</th><th>Blocked</th><th>Avg progress</th></tr></thead><tbody>${rows.map(([o,a])=>`<tr><td class="t">${esc(o)}</td><td class="num">${a.length}</td><td class="num" style="${a.filter(t=>overdueDays(t)>0).length?"color:var(--bad);font-weight:700":""}">${a.filter(t=>overdueDays(t)>0).length}</td><td class="num">${a.filter(t=>t.status==="BL").length}</td><td class="num">${Math.round(a.reduce((s,t)=>s+progressOf(t),0)/a.length)}%</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No open tasks.</td></tr>`}</tbody></table></div>`;
}
function progressOf(t){if(t.status==="DN")return 100;if(t.status==="CX")return 0;if((t.subtasks||[]).length)return Math.round(100*t.subtasks.filter(s=>s.done).length/t.subtasks.length);return {NS:0,IP:40,WO:50,BL:35,FR:90}[t.status]||0;}
