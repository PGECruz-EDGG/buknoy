<style>
:root{
  --espresso:#3B2A20; --terracotta:#B5563A; --sand:#E9DFCD; --clay:#A8836A; --sage:#7E8F6E;
  --bg:#F3EDE2; --surface:#FBF8F2; --surface2:#EFE6D6; --line:#D9CBB4; --line2:#C9B79B;
  --text:#2E211A; --muted:#7A6656; --faint:#A79483;
  --accent:#B5563A; --accent-ink:#FFFFFF;
  --good:#6E8560; --warn:#C08A2E; --bad:#A93A2C; --info:#5E7A8C;
  --good-bg:#E4EADB; --warn-bg:#F3E6C8; --bad-bg:#F1D6CF; --info-bg:#DCE6EC;
  --shadow:0 6px 24px rgba(59,42,32,.14);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sand:#3A2E24; --bg:#1E1712; --surface:#2A2119; --surface2:#332A20; --line:#463A2E; --line2:#5A4B3C;
    --text:#F0E7DA; --muted:#BDAA95; --faint:#8C7A68;
    --accent:#D2734F; --accent-ink:#1E1712;
    --good:#9DB58C; --warn:#DDB25A; --bad:#E07A66; --info:#8FB0C4;
    --good-bg:#2E3A28; --warn-bg:#443620; --bad-bg:#4A2820; --info-bg:#25353F;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sand:#3A2E24; --bg:#1E1712; --surface:#2A2119; --surface2:#332A20; --line:#463A2E; --line2:#5A4B3C;
  --text:#F0E7DA; --muted:#BDAA95; --faint:#8C7A68;
  --accent:#D2734F; --accent-ink:#1E1712;
  --good:#9DB58C; --warn:#DDB25A; --bad:#E07A66; --info:#8FB0C4;
  --good-bg:#2E3A28; --warn-bg:#443620; --bad-bg:#4A2820; --info-bg:#25353F;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--accent)}
.wrap{padding-inline:16px;max-width:1440px;margin:0 auto}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* app shell: left menu */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:linear-gradient(180deg,var(--espresso) 0%,#2A1D15 100%);color:#F3EAE0;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:16px 12px;gap:8px}
.sbrand{display:flex;align-items:center;gap:10px;padding:2px 6px 10px;border-bottom:1px solid rgba(255,255,255,.1)}
.sbrand h1{font-size:17px;color:#fff;line-height:1.1}
.sbrand small{font-size:11px;color:#C9B79B;display:block;letter-spacing:.04em}
.slogo{width:38px;height:38px;border-radius:9px;background:var(--terracotta);color:#fff;font-family:var(--serif);font-weight:600;font-size:20px;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(181,86,58,.45)}
.burger{display:none;margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 9px;font-size:16px;cursor:pointer}
.snav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto;padding-top:6px}
.snav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#A79483;padding:12px 10px 4px;font-weight:700}
.snav button{appearance:none;border:0;background:transparent;color:#E4D8C8;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;transition:background .15s,transform .15s}
.snav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.snav button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}
.snav button.on{background:linear-gradient(90deg,rgba(181,86,58,.35),rgba(181,86,58,.08));color:#fff;border-left-color:var(--terracotta)}
.snav button .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 7px;color:#F3EAE0;font-variant-numeric:tabular-nums}
.snav button .cnt.hot{background:var(--terracotta);color:#fff}
.sfoot{border-top:1px solid rgba(255,255,255,.1);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sfoot .lbl{color:#A79483}
.sfoot select{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.uchip{display:flex;gap:10px;align-items:center;color:#F3EAE0}.uchip .av{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}.uchip .small{color:#C9B79B;font-size:11px}
.sfoot select option{color:var(--text);background:var(--surface)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#C9B79B}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.live i{background:#9DB58C;box-shadow:0 0 0 3px rgba(157,181,140,.25)}
.sync.local i{background:var(--warn)}
.mainwrap{min-width:0}
.topbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 16px 0;max-width:1440px;margin:0 auto}
.topbar h2{font-size:26px}
.topbar .tsub{font-size:13px;color:var(--muted)}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap;cursor:pointer;font-weight:600;font-size:13px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button .cnt{display:inline-block;margin-left:6px;font-size:11px;background:var(--surface2);border-radius:10px;padding:0 6px;color:var(--muted)}
.tabs button .cnt.hot{background:var(--bad-bg);color:var(--bad)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;padding:10px 12px;gap:0}
  .sbrand{border-bottom:0;padding-bottom:4px}
  .burger{display:inline-block}
  .snav,.sfoot{display:none}
  .side.open .snav,.side.open .sfoot{display:flex}
  .side.open .snav{max-height:60vh}
  .topbar{padding-top:12px}.topbar h2{font-size:22px}
}
main.wrap{padding-block:14px 60px}

/* controls */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--clay)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=url],input[type=search],textarea{border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius);padding:7px 9px;min-width:0;max-width:100%}
textarea{resize:vertical;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel .ph{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .ph h2{font-size:17px}
.panel .ph .spacer{flex:1}
.panel .pb{padding:12px 14px}
.sec{margin-bottom:18px}
.sec>h2{font-size:20px;margin-bottom:10px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;border-top:3px solid var(--clay)}
.kpi .v{font-family:var(--serif);font-size:38px;line-height:1;font-weight:500;margin:6px 0 2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad{border-top-color:var(--bad)} .kpi.bad .v{color:var(--bad)}
.kpi.warn{border-top-color:var(--warn)}
.kpi.good{border-top-color:var(--good)}
.kpi.info{border-top-color:var(--info)}

/* RAG strip */
.rag{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.rag .u{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.rag .dot{width:14px;height:14px;border-radius:50%;flex:none}
.rag .dot.G{background:var(--good)} .rag .dot.A{background:var(--warn)} .rag .dot.R{background:var(--bad)}
.rag .u b{display:block;font-size:14px}
.rag .u .s{font-size:12px;color:var(--muted)}

/* task list rows */
.tl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.tr:first-child{border-top:0}
.tr:hover{background:var(--surface2)}
.tr .t{font-weight:600;min-width:0}
.tr .m{font-size:12px;color:var(--muted);min-width:0}
.tr .why{font-size:12px;color:var(--bad);font-weight:600;white-space:nowrap}
.sev{width:6px;align-self:stretch;border-radius:3px;background:var(--line2)}
.sev.Critical{background:var(--bad)} .sev.High{background:var(--warn)} .sev.Normal{background:var(--clay)} .sev.Low{background:var(--line2)}

/* pills */
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid transparent}
.pill.st-NS{background:var(--surface2)} .pill.st-IP{background:var(--info-bg);color:var(--info)}
.pill.st-WO{background:var(--warn-bg);color:var(--warn)} .pill.st-BL{background:var(--bad-bg);color:var(--bad)}
.pill.st-FR{background:var(--sand);color:var(--espresso);border-color:var(--clay)} .pill.st-DN{background:var(--good-bg);color:var(--good)} .pill.st-CX{color:var(--faint);text-decoration:line-through}
:root[data-theme="dark"] .pill.st-FR{color:var(--text)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.st-FR{color:var(--text)}}
.pill.pr-Critical{background:var(--bad-bg);color:var(--bad)} .pill.pr-High{background:var(--warn-bg);color:var(--warn)}
.pill.sample{background:transparent;border:1px dashed var(--clay);color:var(--clay)}
.pill.over{background:var(--bad);color:#fff}
.pill.tier{border:1px solid var(--line2);background:transparent}

/* kanban */
.kb-wrap{overflow-x:auto;padding-bottom:8px}
.kb{display:grid;grid-template-columns:120px repeat(6,minmax(190px,1fr));min-width:1280px;gap:6px}
.kb .kh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:6px 8px;position:sticky;top:0}
.kb .lane{font-family:var(--serif);font-size:15px;font-weight:600;padding:8px;border-top:1px solid var(--line);position:sticky;left:0;background:var(--bg)}
.kb .cell{border-top:1px solid var(--line);min-height:70px;padding:6px;display:flex;flex-direction:column;gap:6px;border-radius:4px}
.kb .cell.over{background:var(--surface2);outline:2px dashed var(--clay)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:4px;padding:7px 9px;cursor:grab;font-size:13px}
.card.pr-Critical{border-left-color:var(--bad)} .card.pr-High{border-left-color:var(--warn)} .card.pr-Low{border-left-color:var(--line2)}
.card .ct{font-weight:600;line-height:1.25}
.card .cm{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card.dragging{opacity:.4}
.card select{font-size:11px;padding:2px 4px;margin-top:4px;width:100%}

/* register */
.tblwrap{overflow-x:auto}
table.reg{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
table.reg th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
table.reg th.on{color:var(--text)}
table.reg td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.reg tr:hover td{background:var(--surface2)}
table.reg td.t{font-weight:600;cursor:pointer}

/* timeline */
.gantt{overflow-x:auto}
.gantt svg{display:block;font-family:var(--sans)}
.gantt .lbl-unit{font-family:var(--serif);font-weight:600;font-size:14px}

/* routines */
.rt-group{margin-bottom:16px}
.rt-group h3{font-size:16px;margin-bottom:6px}

/* report */
.report{background:var(--surface);border:1px solid var(--line);padding:26px 30px;max-width:900px;border-radius:var(--radius)}
.report h2{font-size:26px}
.report .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--espresso);padding-bottom:10px;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.report .rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.report .rk div{border-left:3px solid var(--clay);padding-left:8px}
.report .rk b{font-family:var(--serif);font-size:28px;font-weight:500;display:block;line-height:1}
.report .rk span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.report h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--sans);color:var(--terracotta);margin:14px 0 6px}
.report ul{margin:0;padding-left:18px}
.report li{margin:2px 0}
.report .rf{margin-top:18px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(30,20,14,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);width:min(920px,100%);max-height:92vh;display:flex;flex-direction:column}
.dlg.narrow{width:min(460px,100%)}
.dlg .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg .dh h2{font-size:20px;flex:1;min-width:0}
.dlg .db{padding:14px 18px;overflow:auto}
.dlg .df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.dlg .df .spacer{flex:1}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.sub{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-top:12px}
.sub h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sub h3 .spacer{flex:1}
.subrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;margin-bottom:6px}
.subrow input[type=text]{width:100%}
.subrow .del{color:var(--muted);cursor:pointer;border:0;background:none;font-size:16px}
.attrow{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:6px}
.log{font-size:12px;max-height:180px;overflow:auto}
.log div{padding:4px 0;border-top:1px dotted var(--line)}
.log div:first-child{border-top:0}
.cmt{border-top:1px dotted var(--line);padding:6px 0}
.cmt .ca{font-size:11px;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--radius);padding:8px 10px;font-weight:600;margin-bottom:10px}
.note{background:var(--warn-bg);border-radius:var(--radius);padding:8px 10px;font-size:13px;margin-bottom:12px}
.deps{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:13px}
.deps label{display:flex;gap:6px;align-items:center;padding:2px 0}

/* org chart */
.org-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.org-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative}
.org-wrap svg{display:block;font-family:var(--sans)}
.seat-title{font-family:var(--serif);font-weight:600;font-size:13px}
.seat-meta{font-size:10px;fill:var(--muted)}
.seat-status{font-size:9px;font-weight:700;letter-spacing:.08em}
.seat-occ{font-size:12px;font-weight:600}
.org-list{display:flex;flex-direction:column;gap:4px}
.org-li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer}
.org-li.VACANT,.org-li.OIC{border-style:dashed;background:var(--surface2)}
.org-li .lyr{font-size:10px;color:var(--muted);width:44px;text-align:center;font-weight:700}
.org-li b{font-family:var(--serif);font-weight:600}
.org-li .s{font-size:11px;color:var(--muted)}
.tblock{font-size:11px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--surface);margin-top:10px}
.tblock div span{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:9px}
.tblock div b{font-weight:600}
.checks{margin-top:10px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dotted var(--line);font-size:13px}
.chk:first-child{border-top:0}
.chk i{flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#fff}
.chk.ok i{background:var(--good)} .chk.bad i{background:var(--bad)} .chk.warn i{background:var(--warn)}
.dotrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px}
.legendbox{font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px}
.legendbox span{display:inline-flex;align-items:center;gap:6px}

/* ===================== date helpers ===================== */
const fmtISO=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
function todayStr(){return fmtISO.format(new Date());}
function nowISO(){return new Date().toISOString();}
function stamp(iso){try{return new Intl.DateTimeFormat("en-PH",{timeZone:TZ,dateStyle:"medium",timeStyle:"short"}).format(new Date(iso));}catch(e){return iso;}}
function dnum(d){if(!d)return NaN;const[y,m,dd]=d.split("-").map(Number);return Date.UTC(y,m-1,dd)/86400000;}
function dstr(n){return new Date(n*86400000).toISOString().slice(0,10);}
function addDays(d,n){return dstr(dnum(d)+n);}
function addMonths(d,n){const[y,m,dd]=d.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(dd,last));return t.toISOString().slice(0,10);}
function nextDue(d,rec){return rec==="Weekly"?addDays(d,7):rec==="Monthly"?addMonths(d,1):rec==="Quarterly"?addMonths(d,3):rec==="Annual"?addMonths(d,12):addDays(d,7);}
function daysBetween(a,b){return dnum(b)-dnum(a);}
function fmtD(d){if(!d)return "—";const[y,m,dd]=d.split("-").map(Number);return `${dd} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1]}${y!==Number(todayStr().slice(0,4))?" "+y:""}`;}
function weekOf(d){const n=dnum(d);const dow=(new Date(n*86400000).getUTCDay()+6)%7;const mon=dstr(n-dow);return {mon,sun:dstr(n-dow+6)};}
function overdueDays(t){if(!t.due||!OPEN(t.status))return 0;const n=daysBetween(t.due,todayStr());return n>0?n:0;}
function blockedDays(t){if(t.status!=="BL")return 0;const e=[...(t.log||[])].reverse().find(l=>l.kind==="status"&&l.to==="BL");if(!e)return 0;return Math.floor((Date.now()-new Date(e.ts).getTime())/86400000);}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function peso(n){n=Number(n);if(!isFinite(n))return "—";return "₱"+n.toLocaleString("en-PH",{maximumFractionDigits:0});}
function num(n){n=Number(n);return isFinite(n)?n.toLocaleString("en-PH"):"—";}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ===================== permissions ===================== */
const ACCOUNTS=!!window.EDGG_ACCOUNTS;
function role(){
  if(ACCOUNTS){const u=S.user;if(!u)return null;const st=u.seatId&&S.seats.get(u.seatId);let unit=u.level==="director"?null:(st?st.unit:(u.unit||null));let level=u.level;
    const covered=level==="director"?[]:(st?coversFor(st):coversForName(u.name));let via="";
    for(const c of covered){if(level!=="head"&&deptRoots(c.unit).some(r=>r.id===c.id)){level="head";unit=c.unit;via=c.title;}}

function ownsTask(t){const r=role();if(!r)return false;if(r.covered&&r.covered.some(c=>c.id===t.ownerSeat))return true;return (r.seatId&&t.ownerSeat===r.seatId)||(r.name&&t.owner&&t.owner.trim().toLowerCase()===r.name.trim().toLowerCase())||t.createdBy===r.label;}
function canEdit(t){const r=role();if(!r)return false;if(r.unit===null)return true;if(isMember())return t.unit===r.unit&&ownsTask(t);return t.unit===r.unit;}

/* ===================== persistence ===================== */
let pendingLocal=false;
/* ===================== storage: Firebase Realtime Database, or this browser only ===================== */
const CFG_KEY="edgg.firebase",AI_KEY="edgg.claudeKey",AI_MODEL_KEY="edgg.claudeModel",WS_KEY="edgg.workspace";
const COLLS={tasks:"tasks",escalations:"esc",seats:"seats",projects:"projects",issues:"issues",accounts:"accounts",events:"events"};
function getCfg(){let c=null;try{c=JSON.parse(localStorage.getItem(CFG_KEY)||"null");}catch(e){}return c||(window.EDGG_FIREBASE&&window.EDGG_FIREBASE.databaseURL?window.EDGG_FIREBASE:null);}
function cfgIsBuiltIn(){let c=null;try{c=JSON.parse(localStorage.getItem(CFG_KEY)||"null");}catch(e){}return !c&&!!(window.EDGG_FIREBASE&&window.EDGG_FIREBASE.databaseURL);}
function workspace(){let w="";try{w=localStorage.getItem(WS_KEY)||"";}catch(e){}return (w||window.EDGG_WORKSPACE||"edgg").replace(/[.#$\[\]\/]/g,"-");}
const ARR_KEYS=["subtasks","deps","comments","log","attachments","dotted","team","phases","inventory","priceList","links","updates","structuralNotes","departments","subunits","risks","checklist","attendees"];
function norm(d){if(!d||typeof d!=="object")return d;for(const k of ARR_KEYS)if(k in d||["subtasks","deps","comments","log","attachments"].includes(k)){if(!Array.isArray(d[k]))d[k]=d[k]&&typeof d[k]==="object"?Object.values(d[k]):[];}if(d.jpdf===undefined&&d.code!==undefined)d.jpdf={};return d;}
function clean(d){return JSON.parse(JSON.stringify(d));}
const LocalStore={
  read(){try{return JSON.parse(localStorage.getItem("edgg.data")||"{}");}catch(e){return {};}},
  write(all){try{localStorage.setItem("edgg.data",JSON.stringify(all));}catch(e){toast("This browser could not save (storage full or blocked).");}},
  doc(path){const [coll,id]=path.split("/");return {set:async data=>{const all=LocalStore.read();(all[coll]=all[coll]||{})[id]=clean(data);LocalStore.write(all);},delete:async()=>{const all=LocalStore.read();if(all[coll])delete all[coll][id];LocalStore.write(all);}};},
  load(){const all=LocalStore.read();for(const [c,k] of Object.entries(COLLS))S[k]=new Map(Object.entries(all[c]||{}).map(([id,d])=>[id,norm(d)]));if(all.org&&all.org.meta)S.meta=Object.assign({},META_DEFAULT,norm(all.org.meta));if(all.org&&all.org.structure)applyStruct(norm(all.org.structure));if(all.org&&all.org.eventTemplates)S.evTemplates=all.org.eventTemplates;S.accountsLoaded=true;accountsSynced();}
};
let FB=null;
const FireStore={
  doc(path){const r=FB.ref(workspace()+"/"+path);return {set:async data=>r.set(clean(data)),delete:async()=>r.remove()};},
  subscribe(set){
    for(const [c,k] of Object.entries(COLLS)){FB.ref(workspace()+"/"+c).on("value",snap=>{const v=snap.val()||{};S[k]=new Map(Object.entries(v).map(([id,d])=>[id,norm(d)]));if(c==="accounts"){S.accountsLoaded=true;accountsSynced();}else render();},err=>{set("local","permission denied — check database rules");if(c==="accounts"){S.accountsLoaded=true;render();}});}
    FB.ref(workspace()+"/org/meta").on("value",snap=>{const v=snap.val();if(v)S.meta=Object.assign({},META_DEFAULT,norm(v));render();});
    FB.ref(workspace()+"/org/eventTemplates").on("value",snap=>{const v=snap.val();if(v){S.evTemplates=v;for(const k in (v.types||{}))if(!Array.isArray(v.types[k]))v.types[k]=Object.values(v.types[k]);}render();});
    FB.ref(workspace()+"/org/structure").on("value",snap=>{const v=snap.val();if(v){applyStruct(norm(v));refreshRoleSel();}render();});
    FB.ref(".info/connected").on("value",snap=>{set(snap.val()?"live":"local",snap.val()?"live · shared":"reconnecting…");});
  }
};
function loadScript(url){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=url;s.onload=res;s.onerror=()=>rej(new Error("Could not load "+url));document.head.appendChild(s);});}
async function initDb(){
  const sync=document.getElementById("sync");
  const set=(cls,txt)=>{sync.className="sync "+cls;sync.lastElementChild.textContent=txt;};
  const cfg=getCfg();
  if(!cfg||!cfg.databaseURL){LocalStore.load();S.db=LocalStore;S.live=false;set("local","this browser only — set up Firebase in Settings");render();return;}
  try{
    set("local","connecting…");
    if(!window.firebase){await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");}
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    FB=firebase.database();S.db=FireStore;S.live=true;set("live","live · shared");FireStore.subscribe(set);
  }catch(e){LocalStore.load();S.db=LocalStore;S.live=false;set("local","Firebase failed — this browser only");toast("Firebase could not start: "+(e.message||e));render();}
}
async function saveTask(t){
  t.updated=nowISO();t.updatedBy=role()?role().label:"?";
  S.tasks.set(t.id,t);
  if(S.db){try{await S.db.doc("tasks/"+t.id).set(t);}catch(e){toast("Save failed: "+(e.message||e.code||"unknown"));}}
  render();
}
async function saveSeat(s){
  s.updated=nowISO();s.updatedBy=role()?role().label:"?";S.seats.set(s.id,s);
  if(S.db){try{await S.db.doc("seats/"+s.id).set(s);}catch(e){toast("Save failed: "+(e.message||e.code||"unknown"));}}
  render();
}
async function saveProject(pj){pj.updated=nowISO();pj.updatedBy=role()?role().label:"?";S.projects.set(pj.id,pj);if(S.db){try{await S.db.doc("projects/"+pj.id).set(pj);}catch(e){toast("Save failed: "+(e.message||e.code||"unknown"));}}render();}
async function saveIssue(is){is.updated=nowISO();is.updatedBy=role()?role().label:"?";S.issues.set(is.id,is);if(S.db){try{await S.db.doc("issues/"+is.id).set(is);}catch(e){toast("Save failed: "+(e.message||e.code||"unknown"));}}render();}
async function saveStruct(st){applyStruct(st);refreshRoleSel();if(S.db){try{await S.db.doc("org/structure").set(st);}catch(e){toast("Save failed");}}render();}
function refreshRoleSel(){const sel=$("#roleSel");if(!sel||!S.role)return;if(!ROLES.some(r=>r.id===S.role)){S.role=null;render();return;}sel.innerHTML=ROLES.map(x=>`<option value="${x.id}" ${x.id===S.role?"selected":""}>${esc(x.label)}</option>`).join("")+`<option value="__out">Switch role…</option>`;}

function logEntry(t,kind,text,extra){t.log=t.log||[];t.log.push(Object.assign({ts:nowISO(),role:role()?role().label:"?",kind,text},extra||{}));if(t.log.length>120)t.log=t.log.slice(-120);}

/* ===================== rules ===================== */
function openSubtasks(t){return (t.subtasks||[]).filter(s=>!s.done);}
function openDeps(t){return (t.deps||[]).map(id=>S.tasks.get(id)).filter(d=>d&&OPEN(d.status));}
function checkStatusChange(t,to,extra){
  extra=extra||{};
  if(to==="DN"){
    const os=openSubtasks(t),od=openDeps(t);
    if(os.length)return {ok:false,msg:`Cannot mark Done: ${os.length} open sub-task${os.length>1?"s":""} (${os.slice(0,2).map(s=>s.title).join("; ")}${os.length>2?"…":""}). Close them first.`};
    if(od.length)return {ok:false,msg:`Cannot mark Done: blocked by open dependenc${od.length>1?"ies":"y"} (${od.map(d=>d.title).join("; ")}).`};
  }
  if(to==="BL"&&!(extra.reason||"").trim())return {ok:false,msg:"Blocked needs a reason.",need:"reason"};
  if(to==="WO"&&!(extra.waitingOn||"").trim())return {ok:false,msg:"Waiting on Others needs the name of who you are waiting on.",need:"waitingOn"};
  return {ok:true};
}
async function applyStatus(t,to,extra){
  extra=extra||{};
  const chk=checkStatusChange(t,to,extra);
  if(!chk.ok){
    if(chk.need){askText(to==="BL"?"Why is this blocked?":"Waiting on whom?",chk.need==="reason"?"Reason":"Person / office",v=>{if(v)applyStatus(t,to,{[chk.need]:v});});return;}
    toast(chk.msg);return;
  }
  const from=t.status;if(from===to)return;
  const nt=JSON.parse(JSON.stringify(t));
  nt.status=to;
  if(to==="BL")nt.blockReason=extra.reason;
  if(to==="WO")nt.waitingOn=extra.waitingOn;
  if(to==="DN")nt.completed=todayStr();else if(from==="DN")nt.completed="";
  logEntry(nt,"status",`Status ${SNAME[from]} → ${SNAME[to]}${to==="BL"?" — "+extra.reason:to==="WO"?" — waiting on "+extra.waitingOn:""}`,{from,to});
  await saveTask(nt);if(to==="DN")await issueTaskDone(nt);
  if(to==="DN"&&nt.tier==="Routine"&&nt.recurrence&&nt.due){
    const nx=JSON.parse(JSON.stringify(nt));
    nx.id=uid("t");nx.status="NS";nx.completed="";nx.blockReason="";nx.waitingOn="";nx.comments=[];nx.log=[];
    nx.due=nextDue(nt.due,nt.recurrence);nx.start=nt.start?nextDue(nt.start,nt.recurrence):"";
    nx.subtasks=(nt.subtasks||[]).map(s=>Object.assign({},s,{done:false,id:uid("s")}));
    nx.created=nowISO();nx.createdBy=role().label;
    logEntry(nx,"create",`Auto-generated next ${nt.recurrence.toLowerCase()} instance after "${nt.title}" was marked Done`);
    await saveTask(nx);
    toast(`Done. Next ${nt.recurrence.toLowerCase()} instance created, due ${fmtD(nx.due)}.`);
  }else toast(`Status: ${SNAME[to]}`);
}

/* ===================== derived ===================== */
function allTasks(){return [...S.tasks.values()];}
function active(){return allTasks().filter(t=>t.status!=="CX");}
function unitRag(unit){
  const ts=active().filter(t=>t.unit===unit&&OPEN(t.status));
  const od=ts.filter(t=>overdueDays(t)>0),bl=ts.filter(t=>t.status==="BL");
  const hot=od.filter(t=>t.priority==="Critical"||t.priority==="High").length;
  let c="G";if(od.length||bl.length)c="A";if(hot>=1||bl.length>=2||od.length>=3)c="R";
  return {c,od:od.length,bl:bl.length,open:ts.length,hot};
}
function attention(){
  const out=[];
  for(const t of active()){
    if(!OPEN(t.status))continue;
    const od=overdueDays(t);
    if(od>0&&(t.priority==="Critical"||t.priority==="High"))out.push({t,w:3,why:`Overdue ${od}d · ${t.priority}`});
    else if(t.status==="BL"&&blockedDays(t)>3)out.push({t,w:2,why:`Blocked ${blockedDays(t)}d`});
    else if(t.status==="FR")out.push({t,w:1,why:"For Review — awaiting Director"});
    else if(od>0)out.push({t,w:0.5,why:`Overdue ${od}d`});
  }
  return out.sort((a,b)=>b.w-a.w||overdueDays(b.t)-overdueDays(a.t)).slice(0,10);
}
function kpis(scope){
  const ts=scope.filter(t=>t.status!=="CX");const today=todayStr();const {mon,sun}=weekOf(today);
  const open=ts.filter(t=>OPEN(t.status));
  return {
    open:open.length,
    overdue:open.filter(t=>overdueDays(t)>0).length,
    week:open.filter(t=>t.due&&t.due>=mon&&t.due<=sun).length,
    blocked:open.filter(t=>t.status==="BL").length,
    done30:ts.filter(t=>t.status==="DN"&&t.completed&&daysBetween(t.completed,today)<=30).length,
    review:open.filter(t=>t.status==="FR").length
  };
}

function wireKanban(){
  let dragId=null;

    c.addEventListener("dragstart",e=>{dragId=c.dataset.id;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId);}catch(x){}});
    c.addEventListener("dragend",()=>{c.classList.remove("dragging");document.querySelectorAll(".cell.over").forEach(x=>x.classList.remove("over"));});
  });
  document.querySelectorAll(".cell").forEach(cell=>{
    cell.addEventListener("dragover",e=>{if(!dragId)return;const t=S.tasks.get(dragId);if(t&&t.unit===cell.dataset.unit){e.preventDefault();cell.classList.add("over");}});

    cell.addEventListener("drop",e=>{e.preventDefault();cell.classList.remove("over");const t=S.tasks.get(dragId);dragId=null;if(!t||t.unit!==cell.dataset.unit)return;applyStatus(t,cell.dataset.drop);});
  });
}

  if(f.unit)ts=ts.filter(t=>t.unit===f.unit);if(f.cat)ts=ts.filter(t=>t.category===f.cat);if(f.tier)ts=ts.filter(t=>t.tier===f.tier);
  if(f.owner)ts=ts.filter(t=>(t.owner||"").toLowerCase().includes(f.owner.toLowerCase()));if(f.status)ts=ts.filter(t=>t.status===f.status);if(f.prio)ts=ts.filter(t=>t.priority===f.prio);
  if(f.from)ts=ts.filter(t=>t.due&&t.due>=f.from);if(f.to)ts=ts.filter(t=>t.due&&t.due<=f.to);
  const k=S.sort.k,d=S.sort.d;

}

function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("Select and copy manually");}ta.remove();}

/* ---- Timeline ---- */
function vTimeline(){
  const ts=active().filter(t=>t.tier!=="Routine"&&t.due).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||(a.start||a.due).localeCompare(b.start||b.due));
  if(!ts.length)return `<div class="empty">No Deliverables or Workstreams with a due date yet.</div>`;
  const today=todayStr();
  let min=Math.min(...ts.map(t=>dnum(t.start||t.due)),dnum(today))-7,max=Math.max(...ts.map(t=>dnum(t.due)),dnum(today))+14;
  const L=210,RW=18,pxPerDay=Math.max(3,Math.min(14,1000/(max-min)));const W=L+(max-min)*pxPerDay+20;
  let y=34;const rows=[];let lastUnit=null;
  for(const t of ts){if(t.unit!==lastUnit){rows.push({unit:t.unit,y});y+=24;lastUnit=t.unit;}rows.push({t,y});y+=RW+6;}
  const H=y+10;const x=d=>L+(dnum(d)-min)*pxPerDay;
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline">`;
  // month grid
  let d=new Date(min*86400000);d.setUTCDate(1);
  for(;d.getTime()/86400000<max;d.setUTCMonth(d.getUTCMonth()+1)){const ds=d.toISOString().slice(0,10);const xx=x(ds);if(xx<L)continue;svg+=`<line x1="${xx}" y1="22" x2="${xx}" y2="${H}" stroke="var(--line)" stroke-width="1"/><text x="${xx+4}" y="14" font-size="11" fill="var(--muted)">${d.toLocaleString("en",{month:"short",timeZone:"UTC"})} ${d.getUTCFullYear()}</text>`;}
  for(const r of rows){
    if(r.unit){svg+=`<text x="4" y="${r.y+16}" class="lbl-unit" fill="var(--text)">${esc(r.unit)}</text>`;continue;}
    const t=r.t,s=t.start||t.due,x1=x(s),x2=Math.max(x(t.due),x1+4);const od=overdueDays(t)>0;const done=t.status==="DN";
    const fill=od?"var(--bad)":done?"var(--sage)":t.tier==="Workstream"?"var(--clay)":"var(--terracotta)";
    const pct=(t.subtasks||[]).length?(t.subtasks.filter(s=>s.done).length/t.subtasks.length):(done?1:0);
    svg+=`<g data-open="${t.id}" style="cursor:pointer"><title>${esc(t.title)} · ${fmtD(s)} → ${fmtD(t.due)} · ${SNAME[t.status]}</title>
      <text x="${L-8}" y="${r.y+13}" font-size="12" text-anchor="end" fill="var(--text)">${esc(t.title.length>30?t.title.slice(0,29)+"…":t.title)}</text>
      <rect x="${x1}" y="${r.y}" width="${x2-x1}" height="${RW}" rx="3" fill="${fill}" opacity="${done?".55":".85"}"/>
      ${pct>0&&!done?`<rect x="${x1}" y="${r.y}" width="${(x2-x1)*pct}" height="${RW}" rx="3" fill="var(--espresso)" opacity=".35"/>`:""}
      ${(t.subtasks||[]).filter(s=>s.due).map(s=>{const mx=x(s.due);return `<polygon points="${mx},${r.y-2} ${mx+6},${r.y+RW/2} ${mx},${r.y+RW+2} ${mx-6},${r.y+RW/2}" fill="${s.done?"var(--sage)":"var(--surface)"}" stroke="var(--espresso)" stroke-width="1.2"><title>${esc(s.title)} · ${fmtD(s.due)}</title></polygon>`;}).join("")}
      </g>`;
  }
  const tx=x(today);svg+=`<line x1="${tx}" y1="20" x2="${tx}" y2="${H}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${tx+4}" y="${H-2}" font-size="11" fill="var(--bad)" font-weight="700">Today ${fmtD(today)}</text>`;
  svg+=`</svg>`;
  return `<div class="gantt panel" style="padding:8px">${svg}</div><div class="legend">Bars: terracotta = Deliverable, clay = Workstream, sage = Done, red = overdue. Darker overlay = sub-task completion. Diamonds = dated sub-task milestones (filled when done). Routine tasks live on the Routines tab.</div>`;
}

/* ---- Routines ---- */
function vRoutines(){
  const today=todayStr();const {mon,sun}=weekOf(today);const mEnd=addMonths(today.slice(0,8)+"01",1);
  const rs=active().filter(t=>t.tier==="Routine").sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"));
  const g={over:[],week:[],month:[],later:[],done:[]};
  for(const t of rs){if(t.status==="DN"){g.done.push(t);continue;}const od=overdueDays(t);if(od)g.over.push(t);else if(t.due&&t.due<=sun)g.week.push(t);else if(t.due&&t.due<mEnd)g.month.push(t);else g.later.push(t);}
  const grp=(title,arr,cls)=>`<div class="rt-group panel"><div class="ph"><h2 style="${cls?"color:var(--"+cls+")":""}">${title}</h2><span class="small muted num">${arr.length}</span></div><div class="pb tl">${arr.map(t=>`<div class="tr" data-open="${t.id}"><div class="sev ${t.priority}"></div><div><div class="t">${esc(t.title)} <span class="small muted">· ${USHORT[t.unit]} · ${esc(t.recurrence||"")}</span></div><div class="m">${taskMeta(t)}</div></div><div>${canEdit(t)&&OPEN(t.status)?`<button class="btn sm" data-done="${t.id}">Mark done</button>`:""}</div></div>`).join("")||`<div class="empty">None.</div>`}</div></div>`;
  return `<div class="note no-print">Marking a routine Done closes this instance and creates the next one automatically (weekly +7d, monthly +1m, quarterly +3m, annual +1y), carrying the sub-task checklist reset.</div>
  ${grp("Overdue",g.over,"bad")}${grp(`Due this week · ${fmtD(mon)} – ${fmtD(sun)}`,g.week)}${grp("Due later this month",g.month)}${grp("Upcoming",g.later)}${grp("Completed instances",g.done.slice(-15).reverse())}`;
}

/* ---- Weekly report ---- */
function vReport(){

  const ts=active();

  const slipped=ts.filter(t=>OPEN(t.status)&&t.due&&t.due<=sun&&t.due>=addDays(mon,-60)&&t.due<todayStr()); // due on/before week end, still open
  const blocked=ts.filter(t=>t.status==="BL"||t.status==="WO");
  const upcoming=ts.filter(t=>OPEN(t.status)&&t.due&&t.due>=nmon&&t.due<=nsun);
  const review=ts.filter(t=>t.status==="FR");
  const escs=[...S.esc.values()].filter(e=>e.ts.slice(0,10)>=mon&&e.ts.slice(0,10)<=sun);
  const iNew=issuesAll().filter(i=>i.raised>=mon&&i.raised<=sun),iRes=issuesAll().filter(i=>!IOPEN(i.status)&&i.resolved>=mon&&i.resolved<=sun),iHot=openIssues().filter(i=>i.severity==="Critical"||overdueIssue(i));

  const li=t=>`<li><b>${esc(t.title)}</b> <span class="muted">(${USHORT[t.unit]} · ${esc(t.owner||"")}${t.due?" · due "+fmtD(t.due):""}${overdueDays(t)?" · <span style='color:var(--bad)'>"+overdueDays(t)+"d overdue</span>":""})</span>${t.status==="BL"&&t.blockReason?` — ${esc(t.blockReason)}`:t.status==="WO"&&t.waitingOn?` — waiting on ${esc(t.waitingOn)}`:""}</li>`;
  const sec=(h,arr)=>`<h3>${h} <span class="muted num">(${arr.length})</span></h3>${arr.length?`<ul>${arr.map(li).join("")}</ul>`:`<div class="muted small">None.</div>`}`;
  const k=kpis(ts);
  const text=[`EDGG WEEKLY STATUS — week of ${fmtD(mon)} to ${fmtD(sun)}`,`Open ${k.open} · Overdue ${k.overdue} · Blocked ${k.blocked} · Completed this week ${completed.length}`,"",
    ...[["COMPLETED",completed],["SLIPPED / OVERDUE",slipped],["BLOCKED / WAITING",blocked],["UPCOMING NEXT WEEK",upcoming],["FOR DIRECTOR REVIEW",review]].flatMap(([h,a])=>[h+" ("+a.length+")",...(a.length?a.map(t=>` - ${t.title} [${USHORT[t.unit]}${t.owner?" · "+t.owner:""}${t.due?" · due "+fmtD(t.due):""}${t.status==="BL"&&t.blockReason?" · "+t.blockReason:""}${t.status==="WO"&&t.waitingOn?" · waiting on "+t.waitingOn:""}]`):[" - none"]),""]),
    "ESCALATIONS ("+escs.length+")",...(escs.length?escs.map(e=>` - ${e.taskTitle} [${USHORT[e.unit]}] — ${e.reason}${e.acked?" (acknowledged)":" (pending)"}`):[" - none"]),"",
    "PROJECT ISSUES — critical or overdue ("+iHot.length+")",...(iHot.length?iHot.map(i=>` - ${i.title} [${(S.projects.get(i.projectId)||{}).name||""} · ${i.category} · ${i.severity}${i.owner?" · "+i.owner:""}]`):[" - none"]),
    "Issues raised this week: "+iNew.length+" · resolved this week: "+iRes.length].join("\n");
  S._reportText=text;
  return `<div class="row no-print" style="margin-bottom:12px"><span class="lbl">Week containing</span><input type="date" id="repDate" value="${base}"><button class="btn sm" id="repPrev">‹ Prev</button><button class="btn sm" id="repNext">Next ›</button><span class="spacer" style="flex:1"></span><button class="btn sm" id="repCopy">Copy as text for MANCOM deck</button><button class="btn sm" data-rep="html">Download progress report</button></div>
  <div class="report">

    <div class="rf">Generated ${stamp(nowISO())} (Asia/Manila) · Unit-by-unit RAG: ${UNITS.map(u=>USHORT[u]+" "+unitRag(u).c).join(" · ")}</div>
  </div>`;

/* ===================== projects & issues ===================== */
function pcat(p){return p.category||"active";}
function riskScore(r){const v=x=>({Low:1,Medium:2,High:3}[x]||1);return v(r.likelihood)*v(r.impact);}
function riskBand(r){const sc=riskScore(r);return sc>=6?"R":sc>=3?"A":"G";}
function openRisks(p){return (p.risks||[]).filter(r=>r.title&&r.status!=="Closed");}
function flaggedRisks(p){return openRisks(p).filter(r=>r.flag==="Yes"||riskBand(r)==="R");}
function projectsAll(){return [...S.projects.values()].filter(p=>!p.archived).sort((a,b)=>(a.name||"").localeCompare(b.name||""));}
function issuesAll(){return [...S.issues.values()];}
function openIssues(){return issuesAll().filter(i=>IOPEN(i.status));}
function overdueIssue(i){return IOPEN(i.status)&&i.due&&i.due<todayStr()?daysBetween(i.due,todayStr()):0;}
function projectIssues(pid){return issuesAll().filter(i=>i.projectId===pid);}
function projectTasks(pid){const pj=S.projects.get(pid);return active().filter(t=>t.projectId===pid||(pj&&t.link&&t.link.trim().toLowerCase()===pj.name.trim().toLowerCase()));}
function projectPct(pj){const ph=(pj.phases||[]).filter(p=>p.name);if(!ph.length)return Math.max(0,Math.min(100,Number(pj.overallPct)||0));const tw=ph.reduce((a,p)=>a+(Number(p.weight)||0),0);if(!tw)return Math.round(ph.reduce((a,p)=>a+(Number(p.pct)||0),0)/ph.length);return Math.round(ph.reduce((a,p)=>a+(Number(p.pct)||0)*(Number(p.weight)||0),0)/tw);}
function invTotals(pj){const r=(pj.inventory||[]);const t={total:0,reserved:0,sold:0,turned:0};for(const x of r){t.total+=Number(x.total)||0;t.reserved+=Number(x.reserved)||0;t.sold+=Number(x.sold)||0;t.turned+=Number(x.turned)||0;}t.available=Math.max(0,t.total-t.reserved-t.sold);t.soldPct=t.total?Math.round(100*(t.sold+t.reserved)/t.total):0;return t;}
function projectRag(pj){const is=projectIssues(pj.id).filter(i=>IOPEN(i.status));const crit=is.filter(i=>i.severity==="Critical").length,od=is.filter(overdueIssue).length,hi=is.filter(i=>i.severity==="High").length;const fr=flaggedRisks(pj).length;let c="G";if((is.length&&(od||hi))||openRisks(pj).some(r=>riskBand(r)==="A"))c="A";if(crit||od>=2||hi>=3||fr)c="R";if(pj.status==="On hold"||pj.landTag==="Stale")c="A";return {c,open:is.length,crit,od,fr};}
function canEditProjects(){return !!role();}
function leadName(pj){const st=pj.leadSeat&&S.seats.get(pj.leadSeat);return pj.leadName||(st?seatPerson(st)||st.title:"")||"—";}
function issuePill(i){return pill("st-"+({OP:"NS",IP:"IP",WO:"WO",RS:"DN",CL:"CX"}[i.status]||"NS"),ISNAME[i.status]||i.status);}
function issueRow(i,why){const pj=S.projects.get(i.projectId);const od=overdueIssue(i);return `<div class="tr" data-openissue="${i.id}"><div class="sev ${i.severity}"></div><div><div class="t">${esc(i.title)} <span class="small muted">· ${esc(pj?pj.name:"")}</span></div><div class="m">${pill("cat",i.category)} ${issuePill(i)} ${pill("pr-"+i.severity,i.severity)} ${od?pill("over",`Overdue ${od}d`):i.due?`<span class="small muted num">due ${fmtD(i.due)}</span>`:""} ${i.owner?`<span class="small muted">${esc(i.owner)}</span>`:""}${i.sample?" "+pill("sample","SAMPLE"):""}</div></div>${why?`<div class="why">${esc(why)}</div>`:""}</div>`;}
function vProjects(){
  if(S.projectId&&S.projects.get(S.projectId))return vProjectPage(S.projects.get(S.projectId));
  const all=projectsAll();const ed=canEditProjects();S.pcatF=S.pcatF||"all";const pjs=S.pcatF==="all"?all:all.filter(p=>pcat(p)===S.pcatF);
  const cards=pjs.map(pj=>{const r=projectRag(pj);const pct=projectPct(pj);const inv=invTotals(pj);const is=projectIssues(pj.id).filter(i=>IOPEN(i.status));const byCat={};for(const i of is)byCat[i.category]=(byCat[i.category]||0)+1;
    return `<div class="pcard" data-openproject="${pj.id}"><div class="pc-top"><span class="dot ${r.c}"></span><div><b>${esc(pj.name)}</b><div class="small muted">${esc(pj.code||"")}${pj.code?" · ":""}${esc(pj.type||"")}${pj.location?" · "+esc(pj.location):""}</div><div style="margin-top:4px">${pill("pc-"+pcat(pj),PCAT[pcat(pj)])}${pcat(pj)==="landbank"&&pj.landTag?" "+pill(pj.landTag==="Stale"?"st-BL":"st-WO",pj.landTag):""}${flaggedRisks(pj).length?" "+pill("pr-Critical",`${flaggedRisks(pj).length} flagged risk${flaggedRisks(pj).length>1?"s":""}`):""}</div></div>${pj.sample?pill("sample","SAMPLE"):""}</div>
      <div class="pc-mid"><div class="ring" style="--p:${pct}"><b class="num">${pct}%</b></div><div class="pc-kv"><div><span>Status</span><b>${esc(pj.status||"—")}</b></div><div><span>Lead</span><b>${esc(leadName(pj))}</b></div>${pj.subId&&subunit(pj.subId)?`<div style="grid-column:1/-1"><span>Team</span><b>${esc(subLabel(pj.subId))}</b></div>`:""}<div><span>Team</span><b>${(pj.team||[]).length} member${(pj.team||[]).length===1?"":"s"}</b></div><div><span>Target</span><b>${pj.target?fmtD(pj.target):"—"}</b></div></div></div>
      <div class="pc-inv">${inv.total?`<div class="ibar"><i style="width:${inv.total?100*inv.sold/inv.total:0}%" class="s"></i><i style="width:${inv.total?100*inv.reserved/inv.total:0}%" class="r"></i></div><div class="small muted num">${num(inv.sold)} sold · ${num(inv.reserved)} reserved · ${num(inv.available)} available of ${num(inv.total)} units</div>`:`<div class="small muted">No inventory recorded.</div>`}</div>

function openProject(id){const pj=id?S.projects.get(id):null;if(id&&!pj)return;PM={orig:pj?JSON.parse(JSON.stringify(pj)):null,p:pj?JSON.parse(JSON.stringify(pj)):blankProject(),isNew:!pj,err:""};PM.p.team=PM.p.team||[];PM.p.links=PM.p.links||[];drawProject();}
function drawProject(){
  const p=PM.p;const opt=(arr,v,blank)=>(blank?`<option value="">${blank}</option>`:"")+arr.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val===v?"selected":""}>${esc(l)}</option>`;}).join("");
  const seatOpts=seatsAll().filter(x=>seatPerson(x)).sort((a,b)=>UNITS.indexOf(a.unit)-UNITS.indexOf(b.unit)||seatLayer(a)-seatLayer(b)).map(x=>[x.id,`${USHORT[x.unit]} · ${seatPerson(x)} — ${x.title}`]);
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog"><div class="dh"><h2>${PM.isNew?"New project":esc(p.name)}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db">
    ${PM.err?`<div class="err">${esc(PM.err)}</div>`:""}
    <div class="grid g2">
      <div class="field" style="grid-column:1/-1"><label>Project name</label><input type="text" id="p_name" value="${esc(p.name)}" placeholder="e.g. Asiana Hermosa Ph2"></div>
      <div class="field"><label>Category</label><select id="p_cat">${PCATS.map(([k,l])=>`<option value="${k}" ${pcat(p)===k?"selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label>Land bank tag</label><select id="p_landtag"><option value="">—</option>${LAND_TAGS.map(t=>`<option ${p.landTag===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="field"><label>Project code</label><input type="text" id="p_code" value="${esc(p.code)}" placeholder="e.g. PRJ-AHM-02"></div>
      <div class="field"><label>Type</label><select id="p_type">${opt(PTYPES,p.type)}</select></div>
      <div class="field"><label>Status</label><select id="p_status">${opt(PSTATUS,p.status)}</select></div>
      <div class="field"><label>Location</label><input type="text" id="p_loc" value="${esc(p.location)}" placeholder="Barangay, municipality, province"></div>
      <div class="field"><label>Start</label><input type="date" id="p_start" value="${p.start||""}"></div>
      <div class="field"><label>Target completion</label><input type="date" id="p_target" value="${p.target||""}"></div>
      <div class="field"><label>Land area</label><input type="text" id="p_land" value="${esc(p.landArea)}" placeholder="e.g. 12.4 ha"></div>
      <div class="field"><label>Overall % (used only when no phases are set)</label><input type="text" id="p_pct" value="${esc(p.overallPct||0)}" inputmode="numeric"></div>
      <div class="field" style="grid-column:1/-1"><label>Description / scope</label><textarea id="p_desc" rows="2">${esc(p.description)}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>General comments (shown on the overview and in reports)</label><textarea id="p_gc" rows="3">${esc(p.generalComments||"")}</textarea></div>
    </div>
    <div class="sub"><h3>Project lead and team</h3><div class="grid g2"><div class="field"><label>Team / territory on the org chart</label><select id="p_sub"><option value="">— none —</option>${(S.struct.subunits||[]).map(u=>`<option value="${u.id}" ${p.subId===u.id?"selected":""}>${esc(USHORT[u.deptId]||u.deptId)} · ${esc(u.kind)}: ${esc(subLabel(u.id))}</option>`).join("")}</select></div><div class="field"><label>Lead — from the EDGG org chart</label><select id="p_leadSeat">${opt(seatOpts,p.leadSeat,"— pick a seat —")}</select></div><div class="field"><label>…or name (other department)</label><input type="text" id="p_leadName" value="${esc(p.leadName)}" placeholder="Name"></div><div class="field"><label>Department (if not EDGG)</label><input type="text" id="p_leadDept" list="deptList" value="${esc(p.leadDept)}"></div></div></div>
    <div class="sub"><h3>Team members <span class="small muted">EDGG seats or other departments</span><span class="spacer"></span><button class="btn sm" data-addteam type="button">+ Add member</button></h3>
      ${p.team.map((m,i)=>`<div class="teamrow"><select data-tm-seat="${i}">${opt(seatOpts,m.seatId,"— other department —")}</select><input type="text" data-tm-name="${i}" value="${esc(m.name)}" placeholder="Name"><input type="text" data-tm-dept="${i}" list="deptList" value="${esc(m.dept)}" placeholder="Department / unit"><input type="text" data-tm-role="${i}" value="${esc(m.role)}" placeholder="Role on project"><button class="del" data-tm-del="${i}" type="button" aria-label="Remove">×</button></div>`).join("")||`<div class="small muted">No members yet. Pick an EDGG seat, or leave the seat blank and type a name and department for members from Construction, Finance, Legal, HR and so on.</div>`}
      <datalist id="deptList">${DEPTS.concat(UNITS).map(d=>`<option value="${esc(d)}">`).join("")}</datalist></div>
    <div class="sub"><h3>Links <span class="small muted">shared-drive folders, plans, permits</span><span class="spacer"></span><button class="btn sm" data-addlink type="button">+ Add link</button></h3>${p.links.map((l,i)=>`<div class="attrow"><input type="text" data-lk-l="${i}" value="${esc(l.label)}" placeholder="Label"><input type="url" data-lk-u="${i}" value="${esc(l.url)}" placeholder="https://…"><button class="del" data-lk-del="${i}" type="button" aria-label="Remove">×</button></div>`).join("")}</div>
    ${!PM.isNew?`<div class="sub"><h3>Project log</h3><div class="log">${[...(p.log||[])].reverse().slice(0,40).map(l=>`<div><span class="muted num">${stamp(l.ts)}</span> · <b>${esc(l.role)}</b> — ${esc(l.text)}</div>`).join("")||`<div class="muted">No changes yet.</div>`}</div></div>`:""}
  </div><div class="df">${!PM.isNew?`<button class="btn danger sm" data-archiveproject type="button">Archive project</button>`:""}<span class="spacer"></span><button class="btn" data-close type="button">Close</button><button class="btn primary" data-saveproject type="button">${PM.isNew?"Create project":"Save project"}</button></div></div></div>`;
  $("#p_leadSeat").addEventListener("change",e=>{const st=S.seats.get(e.target.value);if(st){$("#p_leadName").value=seatPerson(st);$("#p_leadDept").value="";}});
  document.querySelectorAll("[data-tm-seat]").forEach(el=>el.addEventListener("change",e=>{const st=S.seats.get(e.target.value);const i=e.target.dataset.tmSeat;if(st){document.querySelector(`[data-tm-name="${i}"]`).value=seatPerson(st);document.querySelector(`[data-tm-dept="${i}"]`).value=st.unit;}}));
}
function readProject(){const p=PM.p,g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};if(g("p_name")===undefined)return;
  Object.assign(p,{name:g("p_name").trim(),code:g("p_code").trim(),type:g("p_type"),status:g("p_status"),location:g("p_loc").trim(),start:g("p_start"),target:g("p_target"),landArea:g("p_land").trim(),overallPct:Number(g("p_pct"))||0,description:g("p_desc").trim(),category:g("p_cat")||"active",landTag:g("p_cat")==="landbank"?g("p_landtag"):"",generalComments:g("p_gc").trim(),leadSeat:g("p_leadSeat"),leadName:g("p_leadName").trim(),leadDept:g("p_leadDept").trim(),subId:g("p_sub")||""});
  document.querySelectorAll("[data-tm-seat]").forEach(el=>{p.team[+el.dataset.tmSeat].seatId=el.value;});document.querySelectorAll("[data-tm-name]").forEach(el=>{p.team[+el.dataset.tmName].name=el.value.trim();});document.querySelectorAll("[data-tm-dept]").forEach(el=>{p.team[+el.dataset.tmDept].dept=el.value.trim();});document.querySelectorAll("[data-tm-role]").forEach(el=>{p.team[+el.dataset.tmRole].role=el.value.trim();});
  document.querySelectorAll("[data-lk-l]").forEach(el=>{p.links[+el.dataset.lkL].label=el.value;});document.querySelectorAll("[data-lk-u]").forEach(el=>{p.links[+el.dataset.lkU].url=el.value.trim();});}
async function saveProjectModal(){readProject();const p=PM.p,o=PM.orig;if(!p.name){PM.err="Project name is required.";drawProject();return;}
  if(!p.leadSeat&&!p.leadName){PM.err="Name the project lead — from the org chart or another department.";drawProject();return;}
  p.team=p.team.filter(m=>m.seatId||m.name);p.links=p.links.filter(l=>l.url);p.log=p.log||[];
  if(PM.isNew)logEntry(p,"create","Project created");else{for(const [k,l] of [["status","Status"],["target","Target completion"],["leadName","Lead"],["name","Name"],["type","Type"]])if((o[k]||"")!==(p[k]||""))logEntry(p,"field",`${l} "${o[k]||"—"}" → "${p[k]||"—"}"`);if((o.team||[]).length!==p.team.length)logEntry(p,"team",`Team ${o.team.length} → ${p.team.length} members`);}
  closeModal();PM=null;S.projectId=p.id;S.tab="projects";await saveProject(p);toast(PM?"":"Project saved");}
/* land & title editor */
let LM=null;
function openLand(pid){const pj=S.projects.get(pid);if(!pj)return;LM={pid,L:Object.assign(blankLand(),pj.land||{})};const L=LM.L;const f=(k,l,t,ph,opts)=>`<div class="field"><label>${l}</label>${opts?`<select id="l_${k}">${opts.map(o=>`<option ${L[k]===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input type="${t||"text"}" id="l_${k}" value="${esc(L[k])}" placeholder="${ph||""}" ${t==="number"?'inputmode="decimal"':""}>`}</div>`;
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog"><div class="dh"><h2>Land & title — ${esc(pj.name)}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db">
    <div class="sub"><h3>Title</h3><div class="grid g2">${f("titleNo","Title no. (TCT / OCT)","text","e.g. TCT No. 012345")}${f("titleName","Title under the name of","text","registered owner as it appears on the title")}${f("titleStatus","Title status","text","e.g. Clean · With annotation · Mother title · For transfer")}${f("taxDec","Tax declaration no.")}${f("areaSqm","Area (sqm)","number","e.g. 80000")}${f("encumbrances","Encumbrances / annotations","text","liens, adverse claims, easements, right of way")}</div></div>
    <div class="sub"><h3>Acquisition</h3><div class="grid g3">${f("purchaseValue","Purchase value (₱)","number")}${f("purchaseDate","Purchase date","date")}${f("acquisitionMode","Mode","text","Deed of sale · JV · Option · Contract to sell")}</div></div>
    <div class="sub"><h3>Land use</h3><div class="grid g2">${f("zoning","Current zoning / classification","text","Agricultural · Residential · Commercial · Mixed")}${f("conversion","Conversion / reclassification",null,null,CONVERSION)}${f("conversionNote","Conversion note","text","application no., agency, date filed")}${f("survey","Survey / relocation","text","relocation survey date, boundary issues")}${f("access","Access","text","road right of way, frontage")}</div></div>
    <div class="sub"><h3>Real property tax</h3><div class="grid g2">${f("rptYear","RPT updated to (year / quarter)","text","e.g. 2026 Q3")}${f("rptLastPaid","Last payment date","date")}${f("rptAmount","Last amount paid (₱)","number")}${f("rptStatus","RPT status","text","Updated · With arrears · Under protest")}</div></div>
    <div class="field"><label>Remarks</label><textarea id="l_remarks" rows="3">${esc(L.remarks)}</textarea></div>
  </div><div class="df"><span class="spacer"></span><button class="btn" data-close type="button">Cancel</button><button class="btn primary" data-saveland type="button">Save</button></div></div></div>`;}
async function saveLand(){const pj=JSON.parse(JSON.stringify(S.projects.get(LM.pid)));const L={};for(const k of Object.keys(blankLand())){const el=document.getElementById("l_"+k);L[k]=el?el.value.trim():"";}for(const k of ["areaSqm","purchaseValue","rptAmount"])if(L[k])L[k]=Number(String(L[k]).replace(/[^\d.]/g,""))||"";
  const before=JSON.stringify(pj.land||{});pj.land=L;pj.log=pj.log||[];if(before!==JSON.stringify(L))logEntry(pj,"land","Land & title details updated");closeModal();LM=null;await saveProject(pj);toast("Land details saved");}
/* generic rows editor for phases / inventory / price list */
const ROWDEFS={
  phases:{title:"Phases and completion",help:"Weight is the share of the project each phase represents (any scale — they are normalised). Progress is 0–100.",cols:[{k:"name",l:"Phase",t:"text",w:"2fr"},{k:"weight",l:"Weight",t:"number",w:"70px"},{k:"pct",l:"% done",t:"number",w:"70px"},{k:"target",l:"Target date",t:"date",w:"140px"},{k:"note",l:"Note",t:"text",w:"2fr"}]},
  inventory:{title:"Inventory monitoring",help:"One row per phase or product line. Available is computed as total − reserved − sold.",cols:[{k:"label",l:"Phase / product",t:"text",w:"2fr"},{k:"total",l:"Total",t:"number",w:"70px"},{k:"reserved",l:"Reserved",t:"number",w:"80px"},{k:"sold",l:"Sold",t:"number",w:"70px"},{k:"turned",l:"Turned over",t:"number",w:"90px"},{k:"note",l:"Note",t:"text",w:"2fr"}]},
  risks:{title:"Risk register",help:"One row per risk. Rating = likelihood × impact (High × High = 9). Set Flag to Yes to put it in front of the Director.",cols:[{k:"title",l:"Risk",t:"text",w:"2fr"},{k:"category",l:"Category",t:"select",opts:RISK_CATS,w:"130px"},{k:"likelihood",l:"Likelihood",t:"select",opts:RISK_LVL,w:"100px"},{k:"impact",l:"Impact",t:"select",opts:RISK_LVL,w:"100px"},{k:"owner",l:"Owner",t:"text",w:"1fr"},{k:"mitigation",l:"Mitigation / next step",t:"text",w:"2fr"},{k:"due",l:"Due",t:"date",w:"140px"},{k:"status",l:"Status",t:"select",opts:["Open","Mitigating","Accepted","Closed"],w:"110px"},{k:"flag",l:"Flag",t:"select",opts:["No","Yes"],w:"70px"}]},
  priceList:{title:"Price list",help:"List prices in ₱. Set the effective date below.",cols:[{k:"type",l:"Unit / lot type",t:"text",w:"2fr"},{k:"lot",l:"Lot sqm",t:"number",w:"80px"},{k:"floor",l:"Floor sqm",t:"number",w:"80px"},{k:"price",l:"List price ₱",t:"number",w:"130px"},{k:"avail",l:"Availability",t:"select",opts:["Available","Limited","Sold out","Coming soon"],w:"120px"},{k:"note",l:"Note",t:"text",w:"2fr"}]}};
function openRows(kind,pid){const pj=S.projects.get(pid);if(!pj)return;RM={kind,pid,rows:JSON.parse(JSON.stringify(pj[kind]||[])),eff:pj.priceEffective||""};drawRows();}
function drawRows(){const d=ROWDEFS[RM.kind];const grid=d.cols.map(c=>c.w).join(" ")+" 28px";
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog" style="width:min(1040px,100%)"><div class="dh"><h2>${d.title}</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db"><div class="note">${d.help}</div>
    ${RM.kind==="priceList"?`<div class="field" style="max-width:220px;margin-bottom:10px"><label>Effective date</label><input type="date" id="r_eff" value="${RM.eff}"></div>`:""}
    <div class="tblwrap"><div style="min-width:760px"><div class="rowhead" style="grid-template-columns:${grid}">${d.cols.map(c=>`<span>${c.l}</span>`).join("")}<span></span></div>
    ${RM.rows.map((r,i)=>`<div class="rowline" style="grid-template-columns:${grid}">${d.cols.map(c=>c.t==="select"?`<select data-r="${i}" data-k="${c.k}">${c.opts.map(o=>`<option ${r[c.k]===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input type="${c.t==="number"?"text":c.t}" ${c.t==="number"?'inputmode="decimal"':""} data-r="${i}" data-k="${c.k}" value="${esc(r[c.k]??"")}">`).join("")}<button class="del" data-rdel="${i}" type="button" aria-label="Remove">×</button></div>`).join("")||`<div class="empty">No rows yet.</div>`}</div></div>
    <button class="btn sm" data-radd type="button" style="margin-top:8px">+ Add row</button>
  </div><div class="df"><span class="spacer"></span><button class="btn" data-close type="button">Cancel</button><button class="btn primary" data-saverows type="button">Save</button></div></div></div>`;}
function readRows(){document.querySelectorAll("[data-r]").forEach(el=>{RM.rows[+el.dataset.r][el.dataset.k]=el.value;});const e=$("#r_eff");if(e)RM.eff=e.value;}
async function saveRows(){readRows();const pj=JSON.parse(JSON.stringify(S.projects.get(RM.pid)));const d=ROWDEFS[RM.kind];const rows=RM.rows.filter(r=>d.cols.some(c=>c.t==="text"&&String(r[c.k]||"").trim()));for(const r of rows)for(const c of d.cols)if(c.t==="number")r[c.k]=r[c.k]===""||r[c.k]==null?"":Number(String(r[c.k]).replace(/[^\d.\-]/g,""))||0;
  const before=RM.kind==="phases"?projectPct(pj)+"%":RM.kind==="inventory"?`${invTotals(pj).sold} sold / ${invTotals(pj).total}`:RM.kind==="risks"?`${openRisks(pj).length} open`:`${(pj.priceList||[]).length} lines`;
  pj[RM.kind]=rows;if(RM.kind==="priceList")pj.priceEffective=RM.eff;
  const after=RM.kind==="phases"?projectPct(pj)+"%":RM.kind==="inventory"?`${invTotals(pj).sold} sold / ${invTotals(pj).total}`:RM.kind==="risks"?`${rows.filter(r=>r.status!=="Closed").length} open`:`${rows.length} lines`;
  pj.log=pj.log||[];logEntry(pj,RM.kind,`${d.title} updated: ${before} → ${after}`);closeModal();RM=null;await saveProject(pj);toast(d.title+" saved");}
/* issues */
function blankIssue(pid){return {id:uid("i"),projectId:pid||"",title:"",category:ISSUE_CATS[0],severity:"Normal",status:"OP",owner:"",ownerSeat:"",ownerDept:"",raisedBy:role().label,raised:todayStr(),due:"",resolved:"",description:"",impact:"",action:"",waitingOn:"",updates:[],taskId:"",log:[],sample:false,created:nowISO(),createdBy:role().label};}
function openIssue(id,pid){const is=id?S.issues.get(id):null;if(id&&!is)return;IMod={orig:is?JSON.parse(JSON.stringify(is)):null,i:is?JSON.parse(JSON.stringify(is)):blankIssue(pid),isNew:!is,err:""};IMod.i.updates=IMod.i.updates||[];IMod.i.log=IMod.i.log||[];drawIssue();}
function drawIssue(){
  const i=IMod.i;const ed=canEditProjects();const opt=(arr,v,blank)=>(blank?`<option value="">${blank}</option>`:"")+arr.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val===v?"selected":""}>${esc(l)}</option>`;}).join("");
  const seatOpts=seatsAll().filter(x=>seatPerson(x)).map(x=>[x.id,`${USHORT[x.unit]} · ${seatPerson(x)} — ${x.title}`]);const lt=i.taskId&&S.tasks.get(i.taskId);
  $("#modals").innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog"><div class="dh"><h2>${IMod.isNew?"Log a project issue":esc(i.title)}</h2>${!IMod.isNew?issuePill(i):""}${i.sample?pill("sample","SAMPLE"):""}<button class="x" data-close aria-label="Close">×</button></div><div class="db">
    ${IMod.err?`<div class="err">${esc(IMod.err)}</div>`:""}
    <fieldset style="border:0;padding:0;margin:0;min-width:0" ${ed?"":"disabled"}><div class="grid g2">
      <div class="field" style="grid-column:1/-1"><label>Issue</label><input type="text" id="i_title" value="${esc(i.title)}" placeholder="One line that says what is wrong"></div>
      <div class="field"><label>Project</label><select id="i_project">${opt(projectsAll().map(p=>[p.id,p.name]),i.projectId,"— choose —")}</select></div>
      <div class="field"><label>Category</label><select id="i_cat">${opt(ISSUE_CATS,i.category)}</select></div>
      <div class="field"><label>Severity</label><select id="i_sev">${opt(PRIOS,i.severity)}</select></div>
      <div class="field"><label>Status</label><select id="i_status">${opt(ISSUE_STATUS,i.status)}</select></div>
      <div class="field" id="i_wwait" ${i.status==="WO"?"":"hidden"}><label>Waiting on — who</label><input type="text" id="i_wait" value="${esc(i.waitingOn)}"></div>
      <div class="field"><label>Owner — EDGG seat</label><select id="i_ownerSeat">${opt(seatOpts,i.ownerSeat,"— other department / none —")}</select></div>
      <div class="field"><label>Owner name / department</label><input type="text" id="i_owner" value="${esc(i.owner)}" list="deptList2" placeholder="e.g. Legal — Atty. Cruz"><datalist id="deptList2">${DEPTS.map(d=>`<option value="${esc(d)}">`).join("")}</datalist></div>
      <div class="field"><label>Date raised</label><input type="date" id="i_raised" value="${i.raised||""}"></div>
      <div class="field"><label>Resolve by</label><input type="date" id="i_due" value="${i.due||""}"></div>
      <div class="field" style="grid-column:1/-1"><label>What happened</label><textarea id="i_desc" rows="2">${esc(i.description)}</textarea></div>
      <div class="field"><label>Impact (schedule, cost ₱, sales)</label><textarea id="i_impact" rows="2">${esc(i.impact)}</textarea></div>
      <div class="field"><label>Agreed action / next step</label><textarea id="i_action" rows="2">${esc(i.action)}</textarea></div>
    </div></fieldset>
    ${!IMod.isNew?`<div class="sub"><h3>Linked task</h3>${lt?`<div class="tl">${taskRow(lt)}</div><div class="small muted">When the linked task is marked Done, this issue is set to Resolved automatically.</div>`:`<div class="row"><span class="small muted">No task yet. Create one so the work shows on the owner's unit page and the Director's board without re-typing it.</span>${role()?`<button class="btn sm" data-taskfromissue="${i.id}" type="button">Create task from this issue</button>`:""}</div>`}</div>
    <div class="sub"><h3>Updates <span class="small muted num">${i.updates.length}</span></h3>${i.updates.map(u=>`<div class="cmt"><div>${esc(u.text)}</div><div class="ca">${esc(u.author)} · ${stamp(u.ts)}</div></div>`).join("")}<div class="row" style="margin-top:8px"><input type="text" id="i_upd" placeholder="Add an update" style="flex:1"><button class="btn sm" data-addupd type="button">Post</button></div></div>
    <div class="sub"><h3>Change log</h3><div class="log">${[...i.log].reverse().map(l=>`<div><span class="muted num">${stamp(l.ts)}</span> · <b>${esc(l.role)}</b> — ${esc(l.text)}</div>`).join("")||`<div class="muted">No changes yet.</div>`}</div></div>`:""}
  </div><div class="df"><span class="spacer"></span><span class="small muted">${i.raisedBy?`Raised by ${esc(i.raisedBy)}`:""}</span><button class="btn" data-close type="button">Close</button>${ed?`<button class="btn primary" data-saveissue type="button">${IMod.isNew?"Log issue":"Save issue"}</button>`:""}</div></div></div>`;
  $("#i_status").addEventListener("change",e=>{$("#i_wwait").hidden=e.target.value!=="WO";});
  $("#i_ownerSeat").addEventListener("change",e=>{const st=S.seats.get(e.target.value);if(st)$("#i_owner").value=seatPerson(st);});

function calendarItems(){ // events + project phase milestones + dated sub-tasks of workstreams

async function settingsAction(a){
  if(a==="savecfg"){let cfg;try{const t=$("#st_cfg").value.trim().replace(/^const\s+firebaseConfig\s*=\s*/,"").replace(/;\s*$/,"");cfg=Function("return ("+t+")")();}catch(e){toast("That is not a valid config object.");return;}if(!cfg||!cfg.databaseURL){toast("The config needs a databaseURL — enable Realtime Database first.");return;}
    try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.setItem(WS_KEY,$("#st_ws").value.trim()||"edgg");}catch(e){}toast("Saved — reloading to connect");setTimeout(()=>location.reload(),600);return;}
  if(a==="clearcfg"){try{localStorage.removeItem(CFG_KEY);}catch(e){}toast("Disconnected — reloading");setTimeout(()=>location.reload(),600);return;}
  if(a==="saveai"){try{localStorage.setItem(AI_KEY,$("#st_ai").value.trim());localStorage.setItem(AI_MODEL_KEY,$("#st_model").value.trim());}catch(e){}toast("Saved in this browser");render();return;}
  if(a==="clearai"){try{localStorage.removeItem(AI_KEY);}catch(e){}toast("Key removed");render();return;}
  if(a==="loadsample"){if(!isDirector())return;askConfirm("Load sample data?","Adds the sample structure, tasks, seats, projects and issues (tagged SAMPLE). Existing records with the same ids are overwritten; your own records are untouched.",async ok=>{if(!ok)return;await importAll(SAMPLE_DATA);toast("Sample data loaded");});return;}
  if(a==="clearsample"){clearSample();return;}
  if(a==="backup"){const all={exported:nowISO(),by:role().label,version:APP_VERSION,tasks:[...S.tasks.values()],escalations:[...S.esc.values()],seats:[...S.seats.values()],projects:[...S.projects.values()],issues:[...S.issues.values()],meta:S.meta,structure:S.struct};deliver(`EDGG-backup-${todayStr()}.json`,JSON.stringify(all,null,1),"Backup");return;}
  if(a==="theme"){const r=document.documentElement;const cur=r.getAttribute("data-theme");const next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");r.setAttribute("data-theme",next);try{localStorage.setItem("edgg.theme",next);}catch(e){}return;}
  if(a==="fullscreen"){if(document.fullscreenElement){document.exitFullscreen();}else{document.documentElement.requestFullscreen().catch(()=>toast("Full screen is not available here."));}return;}
  if(a==="switchrole"){S.role=null;try{localStorage.removeItem("edgg.role");}catch(e){}render();return;}
}
async function importAll(d){
  const write=async(coll,arr)=>{for(const x of arr||[]){if(!x||!x.id)continue;await S.db.doc(coll+"/"+x.id).set(x);}};
  if(d.structure)await saveStruct(d.structure);
  await write("tasks",d.tasks);await write("escalations",d.escalations);await write("events",d.events);await write("seats",d.seats);await write("projects",d.projects);await write("issues",d.issues);
  if(d.meta)await S.db.doc("org/meta").set(Object.assign({},META_DEFAULT,d.meta));
  if(S.db===LocalStore){LocalStore.load();render();}
}
function restoreFile(input){const f=input.files&&input.files[0];if(!f)return;const rd=new FileReader();rd.onload=async e=>{try{const d=JSON.parse(e.target.result);askConfirm("Restore from backup?",`${(d.tasks||[]).length} tasks, ${(d.seats||[]).length} seats, ${(d.projects||[]).length} projects, ${(d.issues||[]).length} issues from ${d.exported?stamp(d.exported):"an unknown date"}. Records with the same id are replaced.`,async ok=>{if(!ok)return;await importAll(d);toast("Backup restored");});}catch(x){toast("That file is not an EDGG backup.");}};rd.readAsText(f);input.value="";}

function reportPreview(){
  const ts=active().filter(t=>OPEN(t.status));const by={};for(const t of ts){(by[t.owner||"Unassigned"]=by[t.owner||"Unassigned"]||[]).push(t);}
  const rows=Object.entries(by).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
  return `<div class="tblwrap"><table class="reg" style="min-width:0"><thead><tr><th>Person</th><th>Open</th><th>Overdue</th><th>Blocked</th><th>Avg progress</th></tr></thead><tbody>${rows.map(([o,a])=>`<tr><td class="t">${esc(o)}</td><td class="num">${a.length}</td><td class="num" style="${a.filter(t=>overdueDays(t)>0).length?"color:var(--bad);font-weight:700":""}">${a.filter(t=>overdueDays(t)>0).length}</td><td class="num">${a.filter(t=>t.status==="BL").length}</td><td class="num">${Math.round(a.reduce((s,t)=>s+progressOf(t),0)/a.length)}%</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No open tasks.</td></tr>`}</tbody></table></div>`;
}
function progressOf(t){if(t.status==="DN")return 100;if(t.status==="CX")return 0;if((t.subtasks||[]).length)return Math.round(100*t.subtasks.filter(s=>s.done).length/t.subtasks.length);return {NS:0,IP:40,WO:50,BL:35,FR:90}[t.status]||0;}

function importFileChosen(input){
  const f=input.files&&input.files[0];if(!f)return;
  IM=Object.assign(IM||{},{file:f.name,text:"",err:"",proposal:null,status:"Reading "+f.name+"…"});
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  const done=txt=>{IM.text=txt;IM.status=`Loaded ${f.name} (${Math.round(txt.length/1024)} KB)`;const el=$("#impStatus");if(el)el.textContent=IM.status;};
  if(ext==="xlsx"||ext==="xls"){
    loadXlsx().then(()=>{const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});let out="";for(const n of wb.SheetNames){out+=`### Sheet: ${n}\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n],{dateNF:"yyyy-mm-dd",blankrows:false})+"\n\n";}done(out);}catch(x){IM.err="Could not read the workbook: "+x.message;render();}};rd.readAsArrayBuffer(f);}).catch(()=>{IM.err="The Excel reader could not be loaded. Save the sheet as CSV and upload that instead.";render();});
